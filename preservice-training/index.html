const M6_SLIDES=[{"type":"title","title":"Module 6: Child Abuse and Neglect -- Prevention, Recognition, and Reporting","sub":"Your legal obligation as a mandatory reporter, how to recognize the signs, and what happens after a report is made."},{"type":"content","title":"Your Legal Obligation","body":"Under Texas law (Texas Family Code, Section 261.101), every employee of a child care center is a mandatory reporter. This means you are legally required to report suspected child abuse or neglect.\n\nKey facts:\n- You must report within 48 hours of forming a suspicion.\n- You report to the Texas Abuse Hotline: 1-800-252-5400 or online at www.txabusehotline.org.\n- You do not need proof. You only need a reasonable suspicion.\n- Failure to report is a criminal offense (Class A misdemeanor).\n- You are protected from retaliation by law when you make a good-faith report.\n\n[callout-danger]This is not optional. It is not a suggestion. It is the law. If you suspect abuse or neglect and do not report it, you can be arrested, charged, and convicted. More importantly, a child remains at risk.[/callout-danger]\n[flip=Who is legally required to report suspected abuse or neglect?]YOU are. Every employee of a child care center in Texas is a mandatory reporter. The director does not report for you. YOU call the hotline.[/flip]"},{"type":"content","title":"Who Reports?","body":"YOU report. Not the director. Not the assistant director. Not another staff member. YOU.\n\nMany people assume that in a child care setting, the director will handle the report. That is incorrect. Texas law places the reporting obligation on the individual who suspects the abuse or neglect.\n\nHere is how it works at BHA:\n1. You form a suspicion based on what you see, hear, or are told.\n2. You call the Texas Abuse Hotline at 1-800-252-5400 (or report online).\n3. You also notify the director so BHA can take appropriate internal action.\n4. The director does not decide whether you report. That is your legal responsibility.\n\n[callout-warn]If you tell the director about a concern and the director says 'I will handle it' or 'That is not abuse,' you are still required to make your own report. The director's opinion does not relieve you of your legal duty.[/callout-warn]"},{"type":"content","title":"What Is Child Abuse?","body":"Texas law defines child abuse as an act or omission that causes or may cause substantial harm to a child's physical, mental, or emotional well-being.\n\nPhysical Abuse:\n- Hitting, punching, kicking, biting, shaking, or burning a child\n- Using an object to strike a child\n- Any physical contact that leaves a mark, bruise, or injury\n- Physical force that is disproportionate to the situation\n\nEmotional Abuse:\n- Constant criticism, threats, or rejection\n- Isolating a child from normal social interactions\n- Terrorizing a child\n- Exposing a child to domestic violence\n\nSexual Abuse:\n- Any sexual contact with a child\n- Exposing a child to sexual material or acts\n- Exploitation of a child for sexual purposes\n\n[callout-info]Abuse can be committed by parents, family members, other caregivers, or anyone with access to the child, including child care staff.[/callout-info]"},{"type":"content","title":"What Is Child Neglect?","body":"Neglect is the failure to provide a child with the basic necessities for their physical, emotional, or developmental well-being.\n\nPhysical Neglect:\n- Failure to provide adequate food, clothing, or shelter\n- Failure to provide necessary medical or dental care\n- Leaving a child unsupervised in dangerous conditions\n- Failure to protect a child from known hazards\n\nEmotional Neglect:\n- Chronic indifference to a child's emotional needs\n- Failure to provide affection, attention, or nurturing\n- Ignoring a child consistently\n\nEducational Neglect:\n- Failure to enroll a school-age child in school\n- Chronic truancy without parental effort to address it\n\n[callout-warn]Neglect is often harder to recognize than abuse because there may not be visible injuries. Look for patterns, not just single incidents.[/callout-warn]"},{"type":"selfcheck","title":"Quick Check","q":"You suspect a child is being abused at home. Your director says it is not abuse. What do you do?","opts":["Accept the director's opinion","YOU still call the Texas Abuse Hotline","Wait and observe for more signs","Ask other staff what they think"],"ans":1,"explanation":"The director's opinion does not relieve you of your legal duty. If you suspect abuse, YOU call the hotline. That is the law."},{"type":"content","title":"Physical Signs of Abuse","body":"You are not a doctor. You are not an investigator. But you should know what to look for:\n\nBruises and marks:\n- Bruises in unusual locations (face, neck, upper arms, buttocks, thighs, back)\n- Bruises in shapes that suggest an object (belt, cord, hand)\n- Multiple bruises in different stages of healing\n- Bruises on infants who are not yet mobile (a non-crawling baby should not have bruises)\n\nBurns:\n- Circular burns (cigarette burns)\n- Burns with clear demarcation lines (dipping burns from hot water)\n- Burns on soles of feet, palms of hands, or buttocks\n\nOther physical signs:\n- Unexplained fractures or dislocations\n- Bite marks (adult-sized)\n- Hair loss in patches (from pulling)\n\n[callout-info]A single bruise on a toddler's shin is not necessarily abuse. Toddlers fall and bump into things constantly. But a bruise on an infant's face or a pattern of injuries should raise concern.[/callout-info]"},{"type":"content","title":"Behavioral Signs of Abuse","body":"Children who are being abused may show behavioral changes, even when physical signs are not visible:\n\n- Sudden fearfulness or anxiety, especially around certain adults\n- Flinching when an adult raises their hand (even to wave)\n- Withdrawal from activities they used to enjoy\n- Age-inappropriate sexual knowledge or behavior\n- Extreme aggression or extreme passivity\n- Regression (a potty-trained child suddenly having accidents)\n- Reluctance to go home or excessive clinging at pickup\n- Self-harm behaviors\n- Changes in eating habits (hoarding food, refusing to eat)\n- Frequent absences or arriving dirty, hungry, or inappropriately dressed\n\n[callout-warn]No single behavioral sign confirms abuse. But a cluster of signs or a sudden change in behavior should prompt you to pay closer attention and consider whether a report is warranted.[/callout-warn]"},{"type":"content","title":"Signs of Neglect","body":"Neglect often presents as a pattern rather than a single event:\n\n- Consistently dirty or wearing clothing that is inappropriate for the weather\n- Chronic hunger (hoarding food, eating excessively at meals)\n- Untreated medical or dental conditions\n- Chronic fatigue (falling asleep frequently during the day)\n- Poor hygiene (body odor, unwashed hair, dental decay)\n- Frequent absences\n- Left at the center well past closing time repeatedly\n- Lack of supervision at home (young child reports being home alone)\n\n[callout-info]Poverty is not neglect. A family that struggles financially may send a child in worn clothing. That is different from a family that has resources but fails to provide for the child's basic needs. Use your judgment carefully and compassionately.[/callout-info]"},{"type":"content","title":"What Children May Tell You","body":"Sometimes a child will disclose abuse directly. If this happens:\n\n1. Listen calmly. Do not react with shock, horror, or anger.\n2. Believe the child. Do not question whether they are telling the truth.\n3. Do not investigate or ask leading questions. Say: 'I am glad you told me. Can you tell me more about what happened?'\n4. Do not promise confidentiality. Say: 'Thank you for telling me. I want to help you, so I need to talk to some people who can keep you safe.'\n5. Document what the child said, using their exact words. Do not interpret or paraphrase.\n6. Report to the Texas Abuse Hotline within 48 hours.\n7. Do not confront the alleged abuser.\n8. Do not notify the parent/caregiver who is the alleged abuser.\n\n[callout-danger]Never promise a child that you will keep their disclosure a secret. You are legally required to report, and telling a child you will keep it secret and then reporting can destroy their trust. Be honest: 'I need to tell someone who can help.'[/callout-danger]\n[reveal=Click for disclosure response steps]1. Listen calmly. 2. Believe the child. 3. Do not investigate or ask leading questions. 4. Do not promise confidentiality. 5. Document their exact words immediately. 6. Report to the hotline within 48 hours. 7. Do not confront the alleged abuser.[/reveal]"},{"type":"content","title":"How to Make a Report","body":"You have two options for making a report:\n\nOption 1: Call the Texas Abuse Hotline\n1-800-252-5400\nAvailable 24 hours a day, 7 days a week\n\nOption 2: Report Online\nwww.txabusehotline.org\nAvailable 24 hours a day, 7 days a week\n\nInformation you should be prepared to provide:\n- Child's name, age, and address (if known)\n- Description of the suspected abuse or neglect (what you saw, heard, or were told)\n- Names and descriptions of the people involved\n- Your name and contact information (your identity is confidential)\n- Any immediate safety concerns\n\n[callout-info]You do not need all of this information to make a report. Report what you know. The hotline staff will guide you through the rest.[/callout-info]\n[accordion=Texas Abuse Hotline information]Phone: 1-800-252-5400 (24/7). Online: www.txabusehotline.org (24/7). You do not need all information to report. Share what you know. Your identity is confidential. You are protected from retaliation by law.[/accordion]"},{"type":"content","title":"What Happens After You Report","body":"After you make a report to the Texas Abuse Hotline:\n\n1. The Department of Family and Protective Services (DFPS) reviews the report and assigns a priority level.\n2. A caseworker may be assigned to investigate.\n3. The caseworker may visit the child's home, interview family members, and interview the child.\n4. The caseworker may also visit BHA to speak with you or other staff. Answer honestly.\n5. DFPS will make a finding: confirmed (abuse/neglect occurred), reason to believe, ruled out, or unable to determine.\n6. If the child is in immediate danger, DFPS may remove the child from the home.\n\nYou may not be told the outcome of the investigation. That is normal. Investigations are confidential. Your role is to report. The investigation is DFPS's responsibility.\n\n[callout-info]If an investigator visits BHA and wants to speak with you, cooperate fully. You may be asked to describe what you observed. Be factual and honest.[/callout-info]"},{"type":"content","title":"Abuse in Child Care Settings","body":"Child abuse does not only happen in homes. It can happen in child care centers. You must be vigilant about the behavior of your colleagues as well.\n\nSigns that a staff member may be harming a child:\n- Excessive physical force during routine care\n- Yelling, threatening, or humiliating a child\n- Taking a child to a private area away from other staff\n- Showing favoritism to one child while treating others harshly\n- Inappropriate physical contact\n- Giving a child special gifts or attention in a way that seems designed to build secrecy\n\n[callout-danger]If you observe a co-worker engaging in any of these behaviors, report it. Report it to the director AND to the Texas Abuse Hotline. Protecting a colleague who is hurting a child makes you complicit.[/callout-danger]"},{"type":"selfcheck","title":"Quick Check","q":"A child says, 'Daddy hit me.' What should you NOT say?","opts":["'I am glad you told me.'","'Can you tell me more about what happened?'","'I promise I will not tell anyone.'","'Thank you for telling me.'"],"ans":2,"explanation":"Never promise confidentiality. You are legally required to report, and telling a child you will keep it secret can destroy their trust."},{"type":"content","title":"Protecting Yourself from False Allegations","body":"While false allegations are rare, you should protect yourself by following these practices:\n\n1. Never be alone with a child behind a closed door. If you need privacy (diapering, toileting assistance), keep the door open or have another adult nearby.\n2. Use appropriate touch only. Side hugs, high-fives, and a hand on the shoulder are appropriate. Kissing, lap-sitting for extended periods, and tickling are not appropriate for staff.\n3. Document everything. Thorough documentation protects you if questions arise.\n4. Follow all BHA policies exactly. Policies are designed to protect children AND staff.\n5. Speak up if you are placed in a situation where you feel vulnerable (alone with children, asked to do something outside policy).\n\n[callout-tip]If a child sits in your lap, it is appropriate to gently redirect them to sit next to you instead. Say: 'Let me scoot you right here next to me so we can both see the book.' This protects you and models appropriate boundaries.[/callout-tip]"},{"type":"content","title":"Prevention: Creating a Safe Environment","body":"The best way to address abuse and neglect is to prevent it. BHA's prevention strategies include:\n\n1. Thorough background checks for all staff\n2. Clear policies about acceptable and unacceptable behavior\n3. Open classroom environments where all activities are visible\n4. A team culture where staff hold each other accountable\n5. Ongoing training on recognizing and reporting abuse\n6. Strong relationships with families so they trust us enough to ask for help\n\nYour role in prevention:\n- Follow the policies\n- Watch out for your colleagues and the children\n- Build trusting relationships with families\n- Report concerns early, before they become crises\n\n[callout-info]A center with strong prevention practices and a transparent culture is a center where abuse is far less likely to occur. You contribute to that culture every day.[/callout-info]"},{"type":"content","title":"Supporting Families Under Stress","body":"Not every concerning situation is abuse or neglect. Some families are struggling and need support, not investigation.\n\nIf you notice a family is under stress (financial difficulty, housing instability, mental health challenges, new baby, job loss), you can:\n\n- Be warm and nonjudgmental\n- Share community resources (food banks, counseling services, housing assistance) through the director\n- Offer practical support: 'We have extra diapers if you need some for home.'\n- Be a consistent, positive presence in the child's life\n\n[callout-warn]Supporting families is part of your role, but you are not a social worker. If a family's situation is affecting the child's safety or well-being, report it. Support and reporting are not mutually exclusive.[/callout-warn]"},{"type":"content","title":"Retaliation Is Prohibited","body":"Texas law protects you from retaliation when you make a good-faith report of suspected abuse or neglect.\n\nThis means:\n- BHA cannot fire you, demote you, or reduce your hours for making a report\n- A parent cannot take legal action against you for making a good-faith report\n- Your identity as the reporter is kept confidential\n\nIf you believe you have experienced retaliation for making a report, contact the director. If the director is the source of retaliation, contact HHSC or DFPS directly.\n\n[callout-info]Good-faith means you genuinely believed there was reason to suspect abuse or neglect. You do not need to be right. You need to be sincere. A report made in good faith is always protected.[/callout-info]"},{"type":"content","title":"Common Questions About Reporting","body":"Q: What if I am wrong?\nA: It is better to report and be wrong than to not report and a child continues to be harmed. Investigators are trained to determine the truth. Your job is to report your concern.\n\nQ: Will the family know I reported?\nA: Your identity as the reporter is confidential by law. DFPS will not tell the family who made the report.\n\nQ: What if the suspected abuser is a family member who drops off the child?\nA: Report to the hotline. DFPS will investigate. You are not responsible for confronting anyone.\n\nQ: What if I suspect my co-worker?\nA: Report to the hotline AND to the director. Both.\n\nQ: Can I be sued for reporting?\nA: Not if your report is made in good faith.\n\n[callout-tip]If you are unsure whether something rises to the level of a report, call the hotline and describe what you observed. They will help you determine whether a formal report is warranted.[/callout-tip]"},{"type":"content","title":"Documentation After a Disclosure","body":"If a child discloses abuse to you, documentation is critical:\n\n1. Write down the child's exact words as soon as possible after the conversation. Do not wait until end of day.\n2. Include: date, time, location of the disclosure, who was present, and what the child said verbatim.\n3. Note the child's demeanor (calm, crying, fearful, matter-of-fact).\n4. Do not add your interpretation or opinions.\n5. Store the documentation securely. Share it only with the director and DFPS investigator.\n\nExample:\n'On May 5, 2026, at approximately 9:45 AM during circle time in Classroom 4, Child A (age 4) said to me: Daddy hit me with a belt last night. It hurt really bad. Child A was crying and holding their left arm. I responded: Thank you for telling me. I am going to help you be safe. I notified Director Mashburn at 9:50 AM and called the Texas Abuse Hotline at 10:00 AM.'\n\n[callout-info]This documentation may be used in an investigation. Accuracy and timeliness are essential.[/callout-info]"},{"type":"content","title":"The Child Maltreatment Training Statement","body":"As part of your onboarding, you will sign a Child Maltreatment Training Statement. This document confirms that:\n\n1. You have been trained on recognizing the signs of child abuse and neglect.\n2. You understand your legal obligation as a mandatory reporter.\n3. You know how to make a report (Texas Abuse Hotline: 1-800-252-5400).\n4. You understand that failure to report is a criminal offense.\n\nThis signed statement is placed in your employee file as required by TAC 746.901(11).\n\n[callout-info]You will sign this document after completing this module and passing the quiz. It is one of the 28 required documents in your employee file.[/callout-info]"},{"type":"content","title":"Scenario: Recognizing and Reporting","body":"[scenario]Three-year-old Mia arrives at BHA on Monday morning. During the health check, you notice a bruise on her upper arm that looks like fingerprints. Her dad, who dropped her off, says she fell off the couch over the weekend.\n\nYou also notice that Mia, who is usually outgoing, is quiet and clingy this morning. During circle time, she flinches when you raise your hand to wave at the group.\n\nWhat do you do?\n\n1. Do not confront the father.\n2. Document what you observed: the location and appearance of the bruise, what the father said, and Mia's behavior changes.\n3. Report to the Texas Abuse Hotline within 48 hours. Describe the bruise, the explanation given, and the behavioral changes.\n4. Also notify Director Mashburn so BHA can take appropriate internal steps.\n5. Continue to treat Mia with warmth and normalcy throughout the day.\n\nYou do not need to determine whether the bruise was caused by abuse. That is the investigator's job. Your job is to report what you observed.[/scenario]"},{"type": "scenario-branch", "title": "Interactive Scenario: Child Disclosure", "scenarioId": "m6_disclosure"},{"type":"content","title":"Module 6 Summary","body":"Here is what you should take away from this module:\n\n[keypoint]You are a mandatory reporter. If you suspect child abuse or neglect, YOU must report it to the Texas Abuse Hotline at 1-800-252-5400. This is the law, and it is non-negotiable.[/keypoint]\n\n- Every child care employee in Texas is a mandatory reporter\n- Report within 48 hours of suspicion. You do not need proof.\n- Know the physical and behavioral signs of abuse and neglect\n- If a child discloses, listen, believe, document their exact words, and report\n- Never confront the alleged abuser or promise a child secrecy\n- Report concerns about co-workers to the hotline AND the director\n- Protect yourself by following all policies and never being alone behind a closed door with a child\n- Retaliation against good-faith reporters is prohibited by law\n- You will sign the Child Maltreatment Training Statement as part of your onboarding\n\nYou are now ready for the Module 6 quiz."}];
const M6_QUIZ=[{"q":"Under Texas law, who is responsible for reporting suspected child abuse or neglect?","opts":["Only the director of the child care center","Only licensed social workers","Every employee of a child care center (mandatory reporters)","Only staff who directly witnessed the abuse"],"ans":2},{"q":"What is the phone number for the Texas Abuse Hotline?","opts":["1-800-422-4453","1-800-252-5400","911","1-800-799-7233"],"ans":1},{"q":"Within how many hours must you make a report after forming a suspicion?","opts":["24 hours","48 hours","72 hours","1 week"],"ans":1},{"q":"A child tells you their parent hurt them. What should you NOT do?","opts":["Listen calmly without reacting with shock","Document the child's exact words","Promise the child you will keep it a secret","Report to the Texas Abuse Hotline"],"ans":2},{"q":"A bruise on which part of an infant should raise the most concern?","opts":["Their knee (from crawling)","Their shin (from bumping furniture)","Their face (non-mobile infants should not have facial bruises)","Their elbow (from rolling)"],"ans":2},{"q":"What happens if you fail to report suspected abuse or neglect?","opts":["Nothing, as long as you told your director","You may receive a written warning from BHA","You can be charged with a Class A misdemeanor","You lose your CPR certification"],"ans":2},{"q":"If your co-worker is using excessive physical force with a child, what should you do?","opts":["Talk to the co-worker privately and ask them to stop","Report to the Texas Abuse Hotline AND notify the director","Wait to see if it happens again before reporting","Mention it during the next staff meeting"],"ans":1},{"q":"Which statement about reporting is correct?","opts":["You must have physical proof before making a report","The director must approve your report before you call","You only need a reasonable suspicion to make a report","You can be sued for making a good-faith report"],"ans":2}];
const M7_SLIDES=[{"type":"title","title":"Module 7: Daily Operations and Documentation","sub":"Attendance, meals, Brightwheel, daily schedules, classroom setup, transitions, and parent communication in action."},{"type":"content","title":"Your Daily Workflow","body":"Every day at BHA follows a structured flow. Consistency is what makes a child care center run smoothly and what keeps children feeling safe.\n\nYour day looks like this:\n1. Arrive and prepare your classroom before children arrive\n2. Greet families and check children in on Brightwheel\n3. Conduct morning health checks\n4. Morning circle and social-emotional check-in\n5. Structured learning activities (Experience Curriculum by Brightwheel)\n6. Outdoor play\n7. Meals and snacks (logged in Brightwheel)\n8. Rest time and quiet activities\n9. Afternoon activities\n10. Departure: check children out, communicate with parents\n11. Clean and reset the classroom\n\n[callout-info]The daily schedule is posted in every classroom. Stick to it. Children thrive on predictability.[/callout-info]"},{"type":"content","title":"Opening the Classroom","body":"Before the first child arrives, your classroom must be ready:\n\n1. Turn on lights and check the room temperature (65-82 degrees F).\n2. Inspect the room for safety hazards (loose outlets, small objects on the floor, broken furniture).\n3. Set out the first activity of the day on tables.\n4. Check that the attendance roster, emergency binder, and first aid kit are in place.\n5. Review the allergy board. Has anyone new enrolled?\n6. Check the Brightwheel app for any parent messages or schedule changes.\n7. Verify that diapering supplies (for infant/toddler rooms) are stocked.\n8. Fill water cups and set out breakfast items if applicable.\n\n[callout-tip]A 10-minute classroom check at the start of the day prevents issues all day long. Make it a non-negotiable habit.[/callout-tip]\n[reveal=Click for the full morning checklist]1. Lights on, check temperature (65-82 F). 2. Safety hazard inspection. 3. Set out first activity. 4. Attendance roster, emergency binder, first aid kit in place. 5. Review allergy board. 6. Check Brightwheel for messages. 7. Stock diapering supplies. 8. Set out breakfast items.[/reveal]"},{"type":"content","title":"Attendance and Check-In","body":"Accurate attendance is a safety and compliance requirement. Every child must be checked in and out of Brightwheel with the exact time.\n\nCheck-in process:\n1. Greet the parent and child warmly by name.\n2. Conduct a visual health check (look for signs of illness, injury, or distress).\n3. Check the child in on Brightwheel. Record the exact time.\n4. Verify the drop-off person matches the enrollment record.\n5. Note any parent instructions (early pickup, medication, mood concerns).\n\nCheck-out process:\n1. Verify the pickup person is authorized. Check ID if you do not recognize them.\n2. Check the child out on Brightwheel. Record the exact time.\n3. Share a brief positive update about the child's day.\n4. Ensure the child has all their belongings.\n\n[callout-danger]If a child is present in the classroom but not checked in on Brightwheel, you have no documentation that they are here. In an emergency evacuation, this could mean a child is unaccounted for. Check them in immediately upon arrival. No exceptions.[/callout-danger]"},{"type":"content","title":"CACFP Meal Documentation","body":"BHA participates in the Child and Adult Care Food Program (CACFP). Federal law requires us to document every meal and snack served.\n\nWhat must be documented:\n- Date and meal type (breakfast, AM snack, lunch, PM snack, dinner)\n- What was served (specific menu items)\n- Which children were present and served\n- Portion sizes by age group\n\nYou log meals in Brightwheel. Select the meal type, check which children are present, and note what was served.\n\n[callout-warn]CACFP documentation is audited by the USDA. Inaccurate or missing meal logs can result in loss of funding. Log every meal, every day, for every child present. Do not batch-log at the end of the day. Log in real time.[/callout-warn]"},{"type":"selfcheck","title":"Quick Check","q":"You forgot to log breakfast in Brightwheel. It is now snack time. What do you do?","opts":["Skip it","Log it now with the correct breakfast time","Log it at the end of the day","Ask the director to log it"],"ans":1,"explanation":"Log it now with the correct time. CACFP requires every meal to be documented. Never skip a log."},{"type":"content","title":"Meal Service Standards","body":"BHA follows family-style dining for all meals:\n\n- Adults sit with children at the table\n- Food is placed in serving bowls and children serve themselves (with assistance for younger children)\n- Children decide how much to eat. Never force a child to finish their plate.\n- Offer but do not push. If a child says they are not hungry, do not insist.\n- Seconds are available.\n- Water is always accessible.\n\nSpecial dietary needs:\n- Check the allergy board before every meal\n- Children with allergies receive an approved substitute\n- Religious or cultural dietary restrictions are respected\n- Vegetarian and other dietary preferences are accommodated\n\n[callout-tip]Mealtimes are teaching opportunities. Model good table manners. Use the time to practice conversation skills: 'What did you do at recess today?' Family-style dining builds independence and social skills.[/callout-tip]"},{"type":"content","title":"Brightwheel: Daily Logging","body":"Brightwheel is your primary documentation tool. Here is what you log daily:\n\nAttendance:\n- Check-in and check-out times for every child\n\nMeals and Snacks:\n- What was served and who was present\n\nDiaper Changes / Toileting:\n- Time, wet/soiled, and any notes\n\nNap/Rest Time:\n- When the child fell asleep and when they woke up\n\nActivities:\n- Photos and descriptions of activities throughout the day\n\nIncidents:\n- Any injury, illness, or behavioral incident (detailed in Module 1)\n\nParent Messages:\n- Respond to parent inquiries within 30 minutes during business hours\n\n[callout-info]Aim to send at least one photo per child per day. Parents love seeing their child engaged and happy. It builds trust and strengthens the home-school connection.[/callout-info]"},{"type":"content","title":"Daily Schedules by Age Group","body":"Each classroom follows an age-appropriate daily schedule. While exact times may vary, the structure is consistent:\n\nInfants:\n- Feeding, diapering, and napping follow each child's individual schedule\n- Tummy time and sensory activities throughout the day\n- No group schedule imposed; infants set the pace\n\nToddlers:\n- More structured with morning circle, activities, outdoor play, lunch, nap, afternoon play\n- Transitions are short and frequent (toddler attention spans are 2-5 minutes)\n\nPreschool:\n- Full structured day with circle time, curriculum activities, outdoor play, rest, enrichment\n- Longer attention spans allow for 15-20 minute activities\n\nSchool-Age:\n- Enrichment-based programming (STEM, art, physical activity, homework time)\n- More autonomy and choice in activities\n\n[callout-info]The daily schedule should be posted in every classroom at both adult and child eye level. Use visuals for pre-readers.[/callout-info]"},{"type":"content","title":"The Experience Curriculum","body":"BHA uses the Experience Curriculum by Brightwheel as its primary curriculum for children ages 0-5.\n\nKey features:\n- Developmentally appropriate lesson plans organized by age group and theme\n- Activities cover all developmental domains: cognitive, language, physical, social-emotional, and creative\n- Integrated into the Brightwheel app for seamless planning and documentation\n- Weekly themes with daily activities that build on each other\n\nYour responsibilities:\n- Follow the curriculum plan for your classroom's age group\n- Document activities and learning moments in Brightwheel\n- Adapt activities to the needs and interests of the children in your room\n- Communicate with the director if you need additional materials\n\n[callout-tip]The curriculum is a guide, not a rigid script. If the children are deeply engaged in a particular activity, it is okay to extend it and adjust the schedule slightly. Follow the children's lead.[/callout-tip]\n[flip=What curriculum does BHA use?]Experience Curriculum by Brightwheel. Developmentally appropriate lesson plans by age group and theme, covering cognitive, language, physical, social-emotional, and creative domains.[/flip]"},{"type":"content","title":"Classroom Setup and Environment","body":"The physical setup of your classroom directly impacts children's behavior, engagement, and safety.\n\nBest practices:\n- Organize the room into defined activity centers (blocks, dramatic play, art, reading, sensory)\n- Ensure clear sightlines so you can see every area from where you are standing\n- Keep walkways clear for easy movement and emergency evacuation\n- Display children's work at their eye level\n- Rotate materials regularly to maintain interest\n- Label shelves with pictures and words so children can find and return materials independently\n\n[callout-warn]Furniture should never block your view of any part of the classroom. If you cannot see a child from where you are standing, rearrange the room. Blind spots are supervision hazards.[/callout-warn]"},{"type":"content","title":"Transitions","body":"Transitions are the moments between activities (cleanup to circle, circle to outdoor, outdoor to lunch). They are the most common time for challenging behavior because children do not know what to do with themselves.\n\nEffective transition strategies:\n- Give advance notice: 'In 5 minutes, we are going to clean up.'\n- Use transition songs or chants that children know\n- Assign jobs: 'Marcus, you are the door holder. Nia, you are the line leader.'\n- Keep transitions short. Long waits in line lead to pushing and restlessness.\n- Have the next activity ready before you begin the transition\n\n[callout-tip]Never make all children wait for one child to finish. If one child is still cleaning up, start the next activity with the rest of the group. The cleaning child can join when they are done.[/callout-tip]\n[accordion=Effective transition strategies]Give advance notice (\"In 5 minutes, we clean up\"). Use transition songs children know. Assign jobs (\"You are the door holder\"). Keep transitions short. Have the next activity ready. Never make all children wait for one child.[/accordion]"},{"type":"content","title":"Nap and Rest Time","body":"All children in care for more than 5 hours must be offered a rest period.\n\nInfants: Nap on their own schedule in individual cribs (safe sleep rules apply).\n\nToddlers and Preschoolers:\n- Rest time is typically after lunch (12:30 to 2:30 PM)\n- Each child has their own cot or mat\n- Cots are spaced at least 3 feet apart\n- The room is dimmed, and quiet music or white noise may be used\n- Children who do not sleep are not forced to. After 30 minutes, offer quiet activities (books, puzzles) on their cot.\n\n[callout-info]Some children need naps and some do not. Forcing a child to lie still for 2 hours is not productive. Let non-nappers engage in quiet, restful activities. The goal is rest, not sleep.[/callout-info]"},{"type":"content","title":"Diapering and Toileting Documentation","body":"For infant and toddler rooms, every diaper change must be documented in Brightwheel:\n\n- Time of change\n- Wet, soiled, or both\n- Any notes (diaper rash, unusual output)\n\nFor potty-training children:\n- Log successful toilet visits\n- Log accidents (handled calmly with no shaming language)\n\n[callout-tip]Diaper change logs may seem tedious, but they serve two purposes: they help parents track their child's health, and they demonstrate compliance during inspections. Log every change as it happens.[/callout-tip]"},{"type":"selfcheck","title":"Quick Check","q":"A parent calls to say a neighbor will pick up. The neighbor is NOT on the authorized list. What do you do?","opts":["Release the child since the parent called","Tell the parent to update the authorized list in Brightwheel first","Check the neighbor's ID and release","Have the child wait in the lobby"],"ans":1,"explanation":"The authorized pickup list must be updated before releasing a child to someone not on it. No exceptions without proper director authorization and documentation."},{"type":"content","title":"Parent Communication Best Practices","body":"Effective parent communication builds trust and partnership. Here are BHA's standards:\n\nDaily communication (via Brightwheel):\n- At least one photo or activity update per child\n- Meal logs, nap logs, and diaper/toileting logs\n- Any incident reports\n\nAs-needed communication:\n- Illness symptoms that develop during the day\n- Supply requests (diapers, wipes, change of clothes)\n- Behavioral concerns (handled privately, not in front of other families)\n- Schedule changes or reminders\n\nPickup conversations:\n- Start with something positive: 'She had a great day. She loved painting today.'\n- Be honest and factual about any issues\n- Keep it brief if other families are waiting\n\n[callout-warn]Never use personal text messages or social media to communicate with parents about their child. All communication must go through Brightwheel or face-to-face at the center.[/callout-warn]"},{"type":"content","title":"Closing the Classroom","body":"At the end of the day, your classroom must be cleaned and reset for the next morning:\n\n1. Verify all children have been picked up and checked out on Brightwheel.\n2. Sanitize all tables, counters, and high-touch surfaces.\n3. Sweep and mop the floor.\n4. Wash and sanitize toys that were mouthed (infant/toddler rooms).\n5. Empty trash cans and diaper pails.\n6. Check the bathroom: restock paper towels and soap.\n7. Secure all hazardous materials in locked storage.\n8. Set out materials for the next day's first activity.\n9. Turn off lights, check windows, and lock the door.\n\n[callout-tip]A clean, prepared classroom in the morning starts with a thorough close the night before. Do not rush closing. It sets the tone for tomorrow.[/callout-tip]"},{"type":"content","title":"Inventory and Supply Management","body":"Keeping your classroom well-stocked prevents disruptions and ensures you can meet children's needs.\n\nItems to monitor daily:\n- Diapers, wipes, and diaper cream (infant/toddler rooms)\n- Paper towels, tissues, and soap\n- Gloves and sanitizing supplies\n- Art supplies (paper, crayons, paint)\n- Extra clothing for accidents\n- First aid kit contents\n\nIf you notice a supply running low:\n- Notify the director or assistant director immediately\n- Do not wait until you are completely out\n- Note the item and quantity needed\n\n[callout-info]BHA maintains a central supply closet. If you need something during the day and the closet is locked, ask the director or assistant director for access.[/callout-info]"},{"type":"content","title":"Technology in the Classroom","body":"Brightwheel tablets are provided for each classroom. They are the only technology you should be using while with children.\n\nAcceptable tablet use:\n- Checking children in and out\n- Logging meals, diapers, naps, and activities\n- Sending photos and updates to parents\n- Accessing the Experience Curriculum lesson plans\n\nNot acceptable:\n- Personal browsing, social media, or email\n- Streaming music or videos not related to the curriculum\n- Allowing children to use the tablet for play\n\n[callout-info]The Brightwheel tablet is a work tool, not a personal device. Treat it that way.[/callout-info]"},{"type":"content","title":"Field Trips and Off-Site Activities","body":"If BHA conducts field trips or off-site activities:\n\n1. Written parental permission is required for every child attending.\n2. A first aid kit, emergency contacts, and attendance roster must be taken.\n3. Ratios must be maintained or tightened during off-site activities.\n4. Head counts are conducted: before leaving, upon arrival, periodically during the trip, before departing, and upon return.\n5. Children wear BHA-branded shirts or identification for visibility.\n6. Transportation follows all TAC 746 vehicle safety requirements (covered in Module 2).\n\n[callout-danger]A final walk-through of the vehicle must be conducted after every trip. The driver physically walks to the back of the vehicle and checks every row and under every seat. No child is ever left in a vehicle.[/callout-danger]"},{"type":"content","title":"Handling Emergencies During Daily Operations","body":"Emergencies can happen in the middle of routine tasks. Here is how daily operations intersect with emergency preparedness:\n\nDuring meal time: If the fire alarm sounds during lunch, leave the food. Grab the attendance clipboard and evacuate.\n\nDuring nap time: If a tornado warning is issued during nap, wake children and move to the safe room. Carry infants.\n\nDuring outdoor play: If a lockdown is initiated while you are outside, move children inside through the nearest secure entrance immediately.\n\nDuring a diaper change: If an emergency occurs, secure the child on the changing table first (pick them up), then follow the emergency procedure.\n\n[callout-warn]Never leave a child on a changing table unattended under any circumstances, including during an emergency. Pick them up first, then respond.[/callout-warn]"},{"type":"content","title":"Scenario: A Day at BHA","body":"[scenario]You are in Classroom 3 (2-year-olds) on a typical Tuesday. Walk through the following situations:\n\n8:15 AM: Jayden's dad drops him off. Jayden is crying and clinging. Dad says he had a rough night and did not sleep well.\nYour response: Check Jayden in on Brightwheel. Note 'rough night, limited sleep' in the daily note. Accept Jayden gently from Dad. Offer comfort: 'Good morning, Jayden. I am glad you are here. Do you want to hold the stuffed bear while we do circle time?' Expect that Jayden may be more emotional than usual today.\n\n10:30 AM: During snack, you realize you forgot to log breakfast in Brightwheel.\nYour response: Log it now with the correct time (not the current time). Do not skip it. CACFP requires every meal to be documented.\n\n1:00 PM: A parent calls and says a neighbor will pick up her child today. The neighbor's name is not on the authorized list.\nYour response: Tell the parent that we need them to update the authorized pickup list in Brightwheel. Until the list is updated, we cannot release the child to the neighbor. If the parent cannot update Brightwheel, the director can authorize a one-time exception with verbal confirmation documented in writing.[/scenario]"},{"type": "scenario-branch", "title": "Interactive Scenario: Missed Meal Log", "scenarioId": "m7_meal_log"},{"type":"content","title":"Module 7 Summary","body":"Here is what you should take away from this module:\n\n[keypoint]Consistent daily operations and thorough documentation are the backbone of a well-run center. If it is not documented, it did not happen.[/keypoint]\n\n- Prepare your classroom before children arrive every day\n- Check every child in and out of Brightwheel with exact times\n- Log every meal, diaper change, nap, and activity in real time\n- Follow the Experience Curriculum and adapt to children's needs\n- Use effective transition strategies to minimize challenging behavior\n- Communicate with parents through Brightwheel: daily, positive, factual\n- Close your classroom thoroughly every evening\n- Be prepared for emergencies to interrupt any part of the day\n\nYou are now ready for the Module 7 quiz."}];
const M7_QUIZ=[{"q":"What is the first thing you should do when a child arrives at your classroom?","opts":["Send them to the breakfast table","Check them in on Brightwheel and conduct a health check","Tell them to go play while you finish setting up","Wait until all children arrive to do attendance at once"],"ans":1},{"q":"How should CACFP meals be logged?","opts":["At the end of the day in a batch","In real time as meals are served","Once per week in a summary report","Only when a supervisor requests it"],"ans":1},{"q":"What curriculum does BHA use for children ages 0-5?","opts":["Learning Beyond Paper","HighScope","Experience Curriculum by Brightwheel","Creative Curriculum"],"ans":2},{"q":"What should you do if a child does not fall asleep during rest time?","opts":["Insist they lie still for the full 2 hours","Offer quiet activities on their cot after 30 minutes","Send them to another classroom","Let them run around the room"],"ans":1},{"q":"Which communication channel should you use for parent updates about their child?","opts":["Personal text messages","Facebook Messenger","Brightwheel or face-to-face at the center","A handwritten note sent home in the child's bag"],"ans":2},{"q":"What is the most critical item to grab during a fire evacuation?","opts":["Your personal phone","The Brightwheel tablet","The attendance roster and emergency binder","The children's artwork"],"ans":2},{"q":"After a field trip, what must the driver always do?","opts":["Return the first aid kit to the classroom","Complete a walk-through of the vehicle checking every row","File a trip report with the director","Refuel the vehicle"],"ans":1},{"q":"What should you do if a parent asks someone not on the authorized list to pick up their child?","opts":["Release the child if the person shows an ID","Tell the parent to update the authorized pickup list first","Call the police","Let the child decide if they want to go with the person"],"ans":1}];
const M8_SLIDES=[{"type":"title","title":"Module 8: Professionalism, Confidentiality, and Team Culture","sub":"Dress code, phone policy, confidentiality, teamwork, conflict resolution, and the culture that makes BHA different."},{"type":"content","title":"What Professionalism Looks Like at BHA","body":"Professionalism at BHA means showing up every day ready to give children and families your best. It is not just about what you wear. It is about how you carry yourself, how you communicate, and how you handle challenges.\n\nProfessionalism means:\n- Arriving on time and prepared\n- Following policies consistently, even when no one is watching\n- Treating children, families, and coworkers with respect\n- Taking ownership of your mistakes\n- Seeking help when you need it\n- Maintaining a positive attitude, even on difficult days\n- Representing BHA well, both inside and outside the building\n\n[callout-info]Families trust us with the most precious people in their lives. Every interaction you have, from how you greet a parent in the morning to how you respond when a child is upset, reflects on BHA and on you.[/callout-info]"},{"type":"content","title":"Dress Code","body":"Your appearance communicates professionalism and safety. BHA's dress code is designed to be practical for working with children while maintaining a clean, professional image.\n\n**Required:**\n- BHA-branded navy blue shirt with logo (two short-sleeve and two long-sleeve shirts will be provided during onboarding)\n- Black or blue pants, or non-tight-fitting jeans in black or blue\n- Closed-toe shoes (tennis shoes are fine)\n- Hair pulled back and secured during food service and infant care\n- Natural hair colors only\n- Fingernails clean and well-maintained, kept at a length that will not scratch a child. Acrylic, gel, and press-on nails are permitted as long as they remain clean, professional, and free of chips.\n\n**Not Permitted:**\n- Shorts of any length\n- Leggings, yoga pants, joggers, or athletic wear\n- Tight-fitting jeans, jeggings, or skinny jeans\n- Crocs, sandals, flip-flops, open-toe shoes, or heels\n- Holes, rips, or tears in any clothing\n- Graphic designs or text on bottoms\n- Clothing with offensive language, imagery, or political messaging\n- Unnatural hair colors (such as pink, blue, green, or purple)\n- Excessive or dangling jewelry (long necklaces, large hoop earrings, dangling bracelets)\n- Visible tattoos depicting offensive imagery or language must be covered\n- Extreme facial or body piercings beyond small ear piercings\n- Strong fragrances or perfumes\n\n[callout-tip]The goal is a clean, professional look every day. You will be on the floor with toddlers, running in the yard with preschoolers, and picking up infants all day. Choose comfort and safety, and keep it looking sharp.[/callout-tip]"},{"type":"content","title":"Cell Phone Policy","body":"This was introduced in Module 1. Here is a comprehensive review:\n\n**During classroom hours (any time you are supervising children):**\n- Personal cell phones must be stored in your bag or in the front office, out of sight\n- You may not call, text, scroll, check notifications, or take personal photos\n- Smartwatches that receive notifications should be placed in Do Not Disturb mode\n- All Brightwheel logging is done on the BHA classroom tablet, never your personal phone\n\n**During breaks:**\n- You may use your phone in the break room only\n\n**There are no exceptions.** Personal phones are never used for work purposes in the classroom.\n\n**Violation consequences (3-strike policy):**\n- First offense: Written warning\n- Second offense: One-day suspension\n- Third offense: Termination\n\n[callout-danger]Phone-related distraction is one of the leading causes of supervision lapses in child care. A child can be injured, leave the room, or choke in the seconds it takes to check a text message.[/callout-danger]\n[flip=What are the consequences for phone violations?]First offense: Written warning. Second offense: One-day suspension. Third offense: Termination. There are no exceptions. Personal phones are never used for work purposes in the classroom.[/flip]"},{"type":"content","title":"Confidentiality: Your Legal and Ethical Obligation","body":"Confidentiality is both a legal requirement and an ethical standard at BHA. When families enroll, they trust us with sensitive information. That trust must never be betrayed.\n\nWhat is confidential:\n- Children's names, ages, and enrollment status\n- Medical information, allergies, and medications\n- Behavioral reports and developmental concerns\n- Family structures, custody arrangements, and home situations\n- Financial information and billing details\n- Anything a parent shares with you in conversation\n- Incident reports and their details\n\n[callout-danger]Confidential information may only be shared with: BHA leadership, the child's assigned classroom team (only what is relevant), licensing inspectors, and CPS investigators. No one else. Not your spouse, not your friends, not other parents.[/callout-danger]"},{"type":"content","title":"Social Media and Confidentiality","body":"Social media is the most common way confidentiality is breached in child care. BHA's policy is absolute:\n\n- Never post photos of children in your care on personal social media, even with good intentions\n- Never post about specific children, families, or workplace situations on any platform\n- Never post vague references that could be identified ('Had a rough day with a biter' when parents know their child bites)\n- Never share BHA internal documents, policies, or communications on social media\n- Never accept parent friend requests on personal social media while the child is enrolled\n\nBHA's official social media accounts are managed by authorized staff only. If a parent asks about BHA's social media presence, direct them to the official pages.\n\n[callout-danger]A single social media post can result in immediate termination. Even if you do not name names, if someone can identify who you are talking about, you have violated confidentiality.[/callout-danger]"},{"type":"selfcheck","title":"Quick Check","q":"A coworker posts on social media about 'a tough day with a biter' without naming anyone. Is this a violation?","opts":["No, because no names were used","Yes, if someone can figure out who they are talking about","Only if a parent sees it","No, it is just venting"],"ans":1,"explanation":"If someone can identify who you are talking about, you have violated confidentiality. Even vague posts can result in immediate termination."},{"type":"content","title":"FERPA and Privacy Protections","body":"While FERPA (Family Educational Rights and Privacy Act) technically applies to schools receiving federal education funding, BHA operates under similar privacy principles:\n\n- Parents have the right to access their child's records\n- Parents must consent before their child's information is shared with outside parties\n- Children's records must be stored securely (locked file cabinets or password-protected digital systems)\n- Records must be retained for the period required by state law\n\nAt BHA:\n- Physical files are stored in the director's office in locked cabinets\n- Digital records are maintained in Brightwheel with role-based access\n- Only authorized staff can view a child's full record\n\n[callout-info]If a parent requests to see their child's file, direct them to the director. Parents have a right to access their child's records, but the process must go through proper channels.[/callout-info]"},{"type":"content","title":"Teamwork at BHA","body":"BHA is a team operation. No one succeeds alone. Here is what teamwork looks like in practice:\n\n- Cover for another staff member when they need a break without being asked\n- Share observations about children so the team has a complete picture\n- Communicate schedule changes, supply needs, and concerns promptly\n- Step into any classroom that needs help, even if it is not your assigned room\n- Celebrate each other's wins publicly and address concerns privately\n\nTeamwork does NOT mean:\n- Gossiping about coworkers\n- Forming cliques that exclude others\n- Complaining about assignments publicly instead of addressing concerns with the director\n- Refusing to help because 'it is not my classroom'\n\n[callout-tip]The strongest teams are the ones where every person feels valued and supported. Look for opportunities to build your teammates up, not tear them down.[/callout-tip]"},{"type":"content","title":"Communication with Your Team","body":"Clear, professional communication prevents misunderstandings and keeps children safe.\n\nBest practices:\n- Use direct, specific language: 'I need you to cover Classroom 3 for 10 minutes while I handle a parent concern' instead of 'Can you help me real quick?'\n- Use handoff communication when changing shifts: 'Marcus had a rough morning, he skipped breakfast. Nia's mom is picking up early at 2:00.'\n- Document anything that needs to survive a shift change in Brightwheel\n- If you have a concern about a coworker's practice, go to them privately first. If unresolved, go to the director.\n\n[callout-warn]Walkie-talkies and intercom conversations can be overheard by parents and children. Keep radio communications professional and free of personal commentary, complaints, or confidential information.[/callout-warn]"},{"type":"content","title":"Conflict Resolution Among Staff","body":"Workplace conflict is normal. How you handle it defines your professionalism.\n\nBHA's conflict resolution process:\n\nStep 1: Address it directly. If you have an issue with a coworker, go to them privately and respectfully. Use 'I' statements: 'I felt frustrated when I did not get a break today. Can we talk about how to coordinate better?'\n\nStep 2: Involve the director. If the conversation does not resolve the issue, bring it to the director. Describe the situation factually, not emotionally.\n\nStep 3: Formal mediation. If needed, the director will facilitate a conversation between the parties.\n\nWhat NOT to do:\n- Do not gossip about the conflict with other staff\n- Do not argue in front of children or families\n- Do not use passive-aggressive behavior\n- Do not refuse to work with a colleague\n\n[callout-info]Conflict is not a sign that the team is broken. It is a sign that people care. How you resolve it determines whether it makes the team stronger or weaker.[/callout-info]\n[accordion=BHA conflict resolution steps]Step 1: Address it directly with the coworker, privately and respectfully, using \"I\" statements. Step 2: If unresolved, bring it to the director with a factual description. Step 3: If needed, the director facilitates a formal mediation. Never gossip, argue in front of children, or refuse to work with a colleague.[/accordion]"},{"type":"content","title":"Attendance and Punctuality","body":"Childcare is a coverage-based profession. When you are late or absent, someone else must cover your position, and ratios may be compromised.\n\nBHA expects:\n- Arrive at least 10 minutes before your shift\n- If you are going to be late, notify the director as early as possible\n- If you are sick, notify the director before 6:00 AM for morning shifts\n- Do not call in sick by text message. Call.\n- Excessive unexcused absences or tardiness will result in progressive discipline\n\n[callout-warn]In a child care center, your absence directly affects children and your coworkers. If you know you need time off, request it in advance so coverage can be arranged.[/callout-warn]"},{"type":"content","title":"Chain of Command","body":"When you have a question, concern, or need, follow BHA's chain of command:\n\n1. **Assistant Director (Tonya Dixon):** For scheduling, supply needs, and daily operational concerns.\n2. **Primary Director (Haddie Mashburn):** For compliance questions, parent concerns, behavioral support plans, and licensing matters.\n3. **COO (Christopher Orr):** For facility issues, vendor concerns, and operational logistics.\n4. **Executive Director (Tanya Orr):** For policy decisions, strategic concerns, and escalated issues.\n\n[callout-info]Most day-to-day questions can be answered by Tonya or Haddie. Use the chain of command so the right person handles the right issue efficiently.[/callout-info]"},{"type":"content","title":"Handling Parent Complaints","body":"If a parent approaches you with a complaint:\n\n1. Listen actively. Do not interrupt or become defensive.\n2. Acknowledge their concern: 'I understand you are upset about this. Thank you for bringing it to my attention.'\n3. If you can resolve it on the spot (a simple misunderstanding), do so warmly and professionally.\n4. If it requires further action, say: 'I want to make sure we address this properly. Let me get Director Mashburn involved so we can find a solution.'\n5. Do not argue with a parent, make promises you cannot keep, or blame a coworker.\n6. Document the complaint and how it was handled.\n\n[callout-tip]Most complaints come from parents who feel unheard, not from parents who want to cause problems. Listen first. Solve second.[/callout-tip]"},{"type":"selfcheck","title":"Quick Check","q":"You are frustrated with a coworker. What is the FIRST step?","opts":["Talk to other coworkers about it","Go directly to the executive director","Address it directly with the coworker, privately and respectfully","Post about it on social media"],"ans":2,"explanation":"BHA's conflict resolution starts with direct, private, respectful conversation. If unresolved, then involve the director."},{"type":"content","title":"Progressive Discipline for Staff","body":"BHA follows a progressive discipline model for staff policy violations:\n\n1. Verbal warning: A private conversation with the director documenting the concern.\n2. Written warning: A formal written notice placed in your employee file.\n3. Suspension: A one-to-three day unpaid suspension.\n4. Termination: Dismissal from BHA.\n\nSome violations may result in immediate termination regardless of prior discipline:\n- Physical punishment of a child\n- Verbal abuse, threats, or humiliation of a child\n- Failure to report suspected abuse or neglect\n- Breach of confidentiality that harms a family\n- Being under the influence of drugs or alcohol while on duty\n- Any criminal offense involving a child\n\n[callout-info]The goal of progressive discipline is to correct behavior, not to punish. If you receive a verbal or written warning, take it seriously and make the change. We want to keep you on the team.[/callout-info]"},{"type":"content","title":"BHA's Culture","body":"Culture is not what is written on a poster. It is what happens when no one is watching. BHA's culture is built on:\n\nRespect: We treat every child, family, and coworker with dignity.\n\nAccountability: We own our mistakes and fix them.\n\nGrowth: We are always learning, always improving.\n\nTransparency: We communicate honestly, even when it is uncomfortable.\n\nCompassion: We lead with empathy, in the classroom and in the break room.\n\nExcellence: We do not settle for minimum standards. We aim higher.\n\n[keypoint]You are not just filling a position. You are building a culture. Every interaction, every decision, and every day matters.[/keypoint]"},{"type":"content","title":"Professional Development","body":"BHA supports your professional growth. Opportunities include:\n\n- Annual training hours (24 hours required; BHA will help you find opportunities)\n- CPR/First Aid recertification (BHA tracks your renewal dates)\n- CDA (Child Development Associate) credential support\n- Feedback and coaching from the director\n- Team meetings for peer learning and problem-solving\n\nYour responsibilities:\n- Complete all required training hours on time\n- Maintain your certifications\n- Be open to feedback and coaching\n- Share what you learn with your team\n\n[callout-tip]Your career in early childhood education can go as far as you want it to. BHA will support you in pursuing credentials, certifications, and leadership roles. Talk to the director about your goals.[/callout-tip]"},{"type":"content","title":"Mandated Policies and Acknowledgments","body":"During onboarding, you will read and sign acknowledgment forms for the following BHA policies:\n\n1. Employee Handbook Acknowledgment\n2. Code of Conduct\n3. Confidentiality Agreement\n4. Cell Phone Policy\n5. Discipline and Guidance Policy\n6. Child Maltreatment Training Statement (covered in Module 6)\n7. Safe Sleep Policy (if working with infants)\n8. Transportation Policy (if transporting children)\n9. Emergency Procedures Acknowledgment\n\nThese signed forms are placed in your employee file. They confirm that you have been trained on and agree to follow each policy.\n\n[callout-info]Read each policy carefully before signing. If you have questions about any policy, ask the director before you sign. Signing means you understand and agree to comply.[/callout-info]"},{"type":"content","title":"Representing BHA in the Community","body":"Whether you are at the grocery store, at a community event, or on social media, you represent BHA. People in Red Oak know where you work.\n\nGuidelines:\n- Speak positively about BHA or do not speak about it at all\n- Never discuss children, families, or internal matters outside the building\n- If someone asks about BHA, share general information: 'We are a 24-hour child care center in Red Oak. We love what we do.'\n- If someone has a complaint or concern about BHA, direct them to the center: 'I am sorry to hear that. Please contact our director at (469) 807-1221.'\n\n[callout-warn]What you say in public, including online, can affect BHA's reputation, enrollment, and even our licensing status. Be mindful.[/callout-warn]"},{"type":"content","title":"Wellness and Work-Life Balance","body":"Child care is physically and emotionally demanding work. BHA recognizes this and encourages:\n\n- Taking your breaks. All of them. Every day.\n- Using your time off. You earn it for a reason.\n- Setting boundaries between work and home. When you leave the building, be present in your own life.\n- Asking for help when you are struggling. This is a sign of strength, not weakness.\n- Building supportive relationships with your teammates.\n\n[callout-tip]Burnout is real and common in child care. The best defense against burnout is a team that supports each other, a director who cares, and your own commitment to your well-being. BHA has your back. You just have to let us know when you need it.[/callout-tip]"},{"type":"content","title":"BHA's Three Differentiators","body":"What makes BHA different from other child care centers in Ellis County?\n\n1. Character Development Framework: Each month, we highlight a character trait (kindness, courage, gratitude, etc.) and integrate it into everything we do: activities, stories, recognition, and daily conversations.\n\n2. Daily Social-Emotional Check-In: Every classroom begins the day with a feelings board check-in. Children learn to identify and express their emotions, and staff gain insight into each child's emotional state.\n\n3. Family Connection Practice: We honor every family structure through classroom displays, family projects, and inclusive events. No child's family is invisible at BHA.\n\nThese three practices are not add-ons. They are woven into the fabric of every day, every classroom, every interaction.\n\n[callout-info]When families ask what makes BHA special, these three things are your answer. Know them. Practice them. Believe in them.[/callout-info]\n[reveal=Click to learn what makes BHA different]1. Character Development Framework: Monthly traits woven into activities, stories, and recognition. 2. Daily Social-Emotional Check-In: Feelings board check-in every morning in every classroom. 3. Family Connection Practice: Honoring every family structure through displays, projects, and inclusive events.[/reveal]"},{"type":"content","title":"Your Impact","body":"Working in child care is one of the most important jobs in the world. You are not just supervising children. You are shaping them.\n\nResearch tells us:\n- 90% of brain development occurs before age 5\n- The quality of early childhood experiences directly predicts school readiness, social skills, and long-term success\n- For many children, their child care teacher is the most consistent, stable adult in their daily life\n\nYou may never know the full impact of your work. The toddler who learned to use words instead of fists because you taught them 'I am mad' may grow into an adult who handles conflict with grace. The infant who learned to trust because you responded every time they cried may grow into a person who trusts the world.\n\n[keypoint]You are the foundation in 'Where Foundations Become Futures.' What you do matters more than you will ever know.[/keypoint]"},{"type":"content","title":"Scenario: Professionalism in Action","body":"[scenario]It is Friday afternoon. You have had a long, difficult week. One of your colleagues called in sick today, so you have been covering extra duties. A parent, Mrs. Johnson, approaches you at pickup visibly frustrated. She says: 'My daughter came home with a stain on her new dress yesterday and no one even told me. I am paying too much for this kind of carelessness.'\n\nYou are tired and irritated. What do you do?\n\n1. Take a breath. Your frustration is valid, but it is not Mrs. Johnson's problem.\n2. Listen without interrupting. Let her finish.\n3. Acknowledge: 'I am sorry about that. I can understand how frustrating it must be. Let me look into what happened.'\n4. Do not blame a coworker: 'Well, I was not here yesterday' makes it sound like you are passing the buck.\n5. Take action: 'I will make a note in our system to make sure we send a Brightwheel message anytime there is a clothing issue. Thank you for letting me know.'\n6. Follow through: Talk to the team about consistent communication on clothing issues.\n\nProfessionalism is not about being perfect. It is about how you respond when things go wrong.[/scenario]"},{"type":"content","title":"Looking Ahead","body":"Congratulations. You have made it through all 8 modules of BHA's New Employee Orientation.\n\nHere is what happens next:\n\n1. Pass all 8 module quizzes with a score of 70% or higher.\n2. Print your completion certificates for your employee file.\n3. Sign all required policy acknowledgment forms.\n4. Begin your first week in your assigned classroom.\n5. Shadow an experienced teacher for Days 2-3.\n6. Check in with the director at the end of Week 1.\n\n[callout-tip]Keep learning. Keep asking questions. Keep showing up. The children and families of BHA are counting on you, and so is your team.[/callout-tip]"},{"type": "scenario-branch", "title": "Interactive Scenario: Social Media Post", "scenarioId": "m8_social_media"},{"type":"content","title":"Module 8 Summary","body":"Here is what you should take away from this module:\n\n[keypoint]Professionalism, confidentiality, and a strong team culture are what separate a good child care center from a great one. You build that culture every single day.[/keypoint]\n\n- Follow the dress code and cell phone policy without exception\n- Confidentiality is absolute. Never share information about children or families outside authorized channels.\n- Social media violations can result in immediate termination\n- Teamwork means covering for each other, communicating clearly, and resolving conflicts respectfully\n- Follow the chain of command\n- Handle parent complaints with empathy, honesty, and follow-through\n- Take care of yourself to prevent burnout\n- BHA's three differentiators (character development, daily check-in, family connection) are your daily practice\n- You are shaping futures. What you do matters.\n\nYou are now ready for the Module 8 quiz. After passing, you have completed BHA's New Employee Orientation."}];
const M8_QUIZ=[{"q":"What should you do if you see a social media post by a coworker that references a child at BHA without naming them?","opts":["Like the post to show support","Ignore it since no names were used","Report it to the director immediately","Comment asking them to take it down"],"ans":2},{"q":"What is the first step in BHA's conflict resolution process for staff?","opts":["File a written complaint with the director","Address it directly with the coworker privately and respectfully","Discuss it with other coworkers to get their perspective","Send an email to the executive director"],"ans":1},{"q":"What is the consequence for a first offense cell phone violation?","opts":["Verbal reminder","Written warning","One-day suspension","Termination"],"ans":1},{"q":"Which of the following is NOT one of BHA's three differentiators?","opts":["Character development framework","Daily social-emotional check-in","Advanced STEM curriculum","Family connection practice"],"ans":2},{"q":"If a parent makes a complaint you cannot resolve on the spot, what should you do?","opts":["Tell them there is nothing you can do","Promise to fix it even if you are not sure you can","Involve the director so the concern can be properly addressed","Suggest they find another center"],"ans":2},{"q":"Which items are required in BHA's dress code?","opts":["Open-toe shoes and BHA shirt","Closed-toe shoes, BHA-branded navy shirt, and black or blue pants","Any professional clothing of your choice","Scrubs"],"ans":1},{"q":"When should you notify the director if you will be absent?","opts":["When you arrive late","Before 6:00 AM for morning shifts","During your shift","The next day"],"ans":1},{"q":"What percentage of brain development occurs before age 5?","opts":["50%","75%","90%","100%"],"ans":2}];

// ======== Storage ========
const STORE_KEY = "bha_training_v3";
function loadStore(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{}}catch{return {}}}
function saveStore(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d))}catch{}}
function getProgress(){const s=loadStore();return s.progress||{}}
function setProgress(modId,data){const s=loadStore();s.progress=s.progress||{};s.progress[modId]={...s.progress[modId],...data};saveStore(s)}
function getName(){return loadStore().name||""}
function setNameStore(n){const s=loadStore();s.name=n;saveStore(s)}
function getEmail(){return loadStore().email||""}
function setEmailStore(e){const s=loadStore();s.email=e;saveStore(s)}

// ======== Jotform configuration (auto-logging completions) ========
// Form ID 261255295349060 collects completion records. The submission endpoint
// accepts standard form-encoded POSTs and does not require an API key.
const JOTFORM_FORM_ID = "261255295349060";
const JOTFORM_SUBMIT_URL = "https://submit.jotform.com/submit/" + JOTFORM_FORM_ID;
function logCompletionToJotform(payload){
  // Fire-and-forget. Never block the UI on this.
  try {
    var fd = new FormData();
    fd.append("formID", JOTFORM_FORM_ID);
    // Field names match the unique names assigned in the Jotform form.
    if(payload.name)         fd.append("q2_textbox0", payload.name);
    if(payload.email)        fd.append("emailAddress", payload.email);
    if(payload.moduleNumber) fd.append("q3_dropdown1", String(payload.moduleNumber));
    if(payload.moduleTitle)  fd.append("q4_textbox2", payload.moduleTitle);
    if(payload.score!=null)  fd.append("q5_number3", String(payload.score));
    if(payload.passFail)     fd.append("q6_dropdown4", payload.passFail);
    if(payload.date)         fd.append("q7_datetime5", payload.date);
    if(payload.time)         fd.append("q8_time6", payload.time);
    if(payload.hours!=null)  fd.append("q9_number7", String(payload.hours));
    if(payload.code)         fd.append("q10_textbox8", payload.code);
    if(payload.topics)       fd.append("q11_textarea9", payload.topics);
    fetch(JOTFORM_SUBMIT_URL, {
      method: "POST",
      body: fd,
      mode: "no-cors"
    }).catch(function(){/* ignore network errors */});
  } catch(e) { /* ignore */ }
}
