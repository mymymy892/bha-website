const M2_QUIZ=[{"q":"What chapter of the Texas Administrative Code governs child care center standards?","opts":["Chapter 744","Chapter 745","Chapter 746","Chapter 749"],"ans":2},{"q":"How often can HHSC inspectors visit BHA?","opts":["Once per year on a scheduled date","Twice per year with advance notice","At any time, without notice","Only when a complaint is filed"],"ans":2},{"q":"If a mixed-age group includes one 12-month-old and nine 3-year-olds, which ratio applies to the entire group?","opts":["1:15 (the 3-year-old ratio)","1:10 (the average)","1:5 (the 12-month-old ratio)","1:9 (the toddler ratio)"],"ans":2},{"q":"How many clock hours of annual training are required for each caregiver under TAC 746?","opts":["8 hours","16 hours","24 hours","30 hours"],"ans":2},{"q":"Where do you report suspected child abuse or neglect?","opts":["To your director only","To the Texas Abuse Hotline at 1-800-252-5400","To the local police first","To the child's parents"],"ans":1},{"q":"What is the minimum square footage of indoor space required per child?","opts":["20 square feet","25 square feet","30 square feet","40 square feet"],"ans":2},{"q":"How often must fire drills be conducted?","opts":["Weekly","Monthly","Quarterly","Twice per year"],"ans":1},{"q":"What happens if an inspector finds a violation?","opts":["Nothing unless it is repeated three times","The center gets a corrective action plan and must fix the issue","The center is immediately closed","The staff member is arrested"],"ans":1}];
const M3_SLIDES=[{"type":"title","title":"Module 3: Trauma-Informed Care Foundations","sub":"Understanding how experiences shape children's behavior and how to create safe, supportive environments for every child."},{"type":"content","title":"Why Trauma-Informed Care Matters for Everyone","body":"Trauma-informed care is not a special program for a specific group of children. It is a universal approach to caring for ALL children that recognizes a simple truth: every child's behavior is shaped by their experiences.\n\nSome children have had experiences that make it harder for them to trust adults, regulate their emotions, or feel safe in new environments. Trauma-informed care means we respond to every child with patience, consistency, and understanding, rather than assuming that difficult behavior is defiance or disrespect.\n\n[callout-info]At BHA, we do not label children as 'traumatized' or 'troubled.' We simply provide the same nurturing, predictable, and responsive environment to every child, every day. That is trauma-informed care in practice.[/callout-info]"},{"type":"content","title":"What Is Trauma?","body":"Trauma is an emotional response to an event or series of events that overwhelms a person's ability to cope. For children, trauma can result from:\n\n- Abuse (physical, emotional, or sexual)\n- Neglect (not having basic needs met)\n- Witnessing violence in the home or community\n- Loss of a caregiver (death, incarceration, separation)\n- Chronic instability (frequent moves, inconsistent caregivers)\n- Medical trauma (hospitalizations, painful procedures)\n- Natural disasters\n- Household dysfunction (substance abuse, mental illness, domestic violence)\n\n[callout-warn]You will not always know which children in your classroom have experienced trauma. Many families do not disclose their history, and many children have no visible signs. That is why we use a trauma-informed approach with every child, not just the ones we know about.[/callout-warn]"},{"type":"content","title":"Adverse Childhood Experiences (ACEs)","body":"The Adverse Childhood Experiences study is one of the largest public health studies ever conducted. It found that childhood experiences have a direct and lasting impact on health, behavior, and development.\n\nThe original study identified 10 categories of adverse experiences:\n1. Physical abuse\n2. Emotional abuse\n3. Sexual abuse\n4. Physical neglect\n5. Emotional neglect\n6. Household substance abuse\n7. Household mental illness\n8. Domestic violence\n9. Parental separation or divorce\n10. Incarcerated household member\n\nKey findings: The more ACEs a child experiences, the higher their risk for developmental delays, behavioral challenges, chronic health conditions, and difficulty forming healthy relationships.\n\n[callout-info]ACEs are far more common than most people realize. Approximately 61% of adults report at least one ACE, and 16% report four or more.[/callout-info]"},{"type":"content","title":"How Trauma Affects the Brain","body":"When a child experiences trauma, their brain develops differently. Specifically:\n\nThe Stress Response System: The brain's alarm system (the amygdala) becomes hyperactive. The child is constantly scanning for danger, even when there is none.\n\nFight, Flight, or Freeze: Children who have experienced trauma may react to minor stressors as though they are life-threatening. This is not a choice. It is a neurological response.\n\nThe Thinking Brain: Under chronic stress, the prefrontal cortex (the part of the brain responsible for reasoning, planning, and impulse control) does not develop as quickly. Children may struggle to think before they act.\n\n[callout-tip]When a child overreacts to something minor, remember: their brain may be responding to a memory of danger, not the current situation. Your calm response helps their brain learn that this environment is safe.[/callout-tip]"},{"type":"content","title":"Recognizing Trauma Responses in Children","body":"Trauma responses in children can look like many things:\n\nInfants and Toddlers:\n- Excessive crying or fussiness\n- Difficulty being soothed\n- Sleep disturbances\n- Regression in developmental milestones\n- Withdrawal from caregivers\n\nPreschoolers:\n- Aggression or defiance\n- Separation anxiety\n- Repetitive play that reenacts traumatic themes\n- Fear of new situations or people\n- Difficulty with transitions\n\nSchool-Age Children:\n- Difficulty concentrating\n- Frequent stomachaches or headaches\n- Withdrawal from peers\n- Explosive anger that seems disproportionate to the situation\n- Difficulty trusting adults\n\n[callout-warn]Many of these behaviors can also be caused by factors unrelated to trauma (hunger, tiredness, developmental stages). Do not diagnose. Simply respond with patience and consistency.[/callout-warn]"},{"type":"selfcheck","title":"Quick Check","q":"A child in your class suddenly starts screaming over a minor event. What is your first thought?","opts":["This child is being dramatic","This child needs stricter consequences","This child's brain may be responding to a past experience","This child is trying to get attention"],"ans":2,"explanation":"Trauma-informed care teaches us that overreactions may be neurological responses to past experiences, not intentional behavior."},{"type":"content","title":"The Four Rs of Trauma-Informed Care","body":"The Substance Abuse and Mental Health Services Administration (SAMHSA) outlines four key principles:\n\n1. Realize: Understand that trauma is widespread and recognize how it can affect children, families, and even staff.\n\n2. Recognize: Learn to identify the signs and symptoms of trauma in children's behavior.\n\n3. Respond: Adjust your practices to provide safety, stability, and support rather than punishment and control.\n\n4. Resist Re-traumatization: Be intentional about not recreating conditions that mirror a child's traumatic experiences (yelling, isolation, unpredictability, loss of control).\n\n[keypoint]You do not need to know a child's trauma history to be trauma-informed. You just need to treat every child as though their behavior might be communicating something important.[/keypoint]\n[accordion=What are the Four Rs?]1. Realize that trauma is widespread. 2. Recognize the signs in children's behavior. 3. Respond with safety, stability, and support. 4. Resist Re-traumatization by not recreating harmful conditions.[/accordion]"},{"type":"content","title":"Creating Safety: Physical Safety","body":"The first need of any child is to feel physically safe. At BHA, we create physical safety by:\n\n- Maintaining clean, well-lit, and organized classrooms\n- Keeping predictable routines so children know what to expect\n- Ensuring adult supervision at all times (no child is ever alone or unattended)\n- Storing hazardous materials out of reach\n- Keeping hallways and doorways clear\n- Inspecting outdoor play areas before each use\n\n[callout-tip]A cluttered, chaotic environment can trigger stress responses in children who have experienced instability. When your classroom is calm and organized, children feel calmer too.[/callout-tip]"},{"type":"content","title":"Creating Safety: Emotional Safety","body":"Emotional safety means a child feels free to express their feelings without fear of judgment, punishment, or rejection.\n\nYou create emotional safety when you:\n- Validate feelings: 'I can see you are really frustrated right now. That is okay.'\n- Avoid dismissing emotions: Never say 'Stop crying,' 'You are fine,' or 'There is nothing to be scared of.'\n- Use a calm, warm voice, even when redirecting behavior\n- Follow through on promises (if you say you will do something, do it)\n- Respond consistently (the same behavior gets the same response every time)\n\n[callout-danger]Yelling at a child is never appropriate at BHA. Even if a child is doing something dangerous, use a firm but calm voice. Yelling triggers the stress response and teaches children that adults are unpredictable.[/callout-danger]"},{"type":"content","title":"Predictable Routines","body":"Predictability is one of the most powerful tools in trauma-informed care. When children know what is coming next, their brains can relax.\n\nAt BHA, every classroom follows a consistent daily schedule:\n- Arrival and greeting\n- Breakfast\n- Morning circle and social-emotional check-in\n- Structured learning activities\n- Outdoor play\n- Lunch\n- Rest time\n- Afternoon activities and free play\n- Snack\n- Departure\n\nTransitions are announced in advance: 'In 5 minutes, we will clean up and go outside.' This gives children time to prepare mentally.\n\n[callout-tip]Post a visual schedule in your classroom at child eye level. Use pictures, not just words. Visual schedules help all children, especially those who cannot yet read or who have experienced unpredictable environments.[/callout-tip]"},{"type":"content","title":"The Power of Connection","body":"Children who have experienced adversity need consistent, caring adults in their lives. You might be one of the most stable, predictable adults a child has ever known.\n\nSimple ways to build connection:\n- Greet every child by name every morning\n- Get down to their eye level when speaking\n- Notice and comment on their interests: 'I see you are building something tall today!'\n- Remember small details: 'How did your dog's vet visit go?'\n- Offer comfort through proximity (sit near them) rather than forcing physical contact\n\n[callout-warn]Some children do not want to be hugged or touched. Respect that. Offer comfort through your presence and words. Say, 'I am right here if you need me.' Let them come to you.[/callout-warn]"},{"type":"content","title":"Responding to Difficult Behavior","body":"When a child acts out, your first question should always be: 'What happened to this child?' not 'What is wrong with this child?'\n\nTrauma-informed responses:\n\nInstead of: 'Stop hitting!'\nTry: 'I can see you are really angry. I will not let you hurt anyone, and I will not let anyone hurt you. Let us find another way to show how you feel.'\n\nInstead of: 'Go sit in the corner.'\nTry: 'It looks like you need a break. Do you want to go to the calm-down corner?'\n\nInstead of: 'Why did you do that?'\nTry: 'Something made you upset. Can you tell me about it, or would you like to draw it?'\n\n[keypoint]Your job is not to control the child's behavior. Your job is to regulate your own emotions so you can help the child regulate theirs.[/keypoint]"},{"type":"content","title":"The Calm-Down Corner","body":"Every BHA classroom has a calm-down corner. This is NOT a time-out spot. It is a tool children can choose to use when they need space to regulate.\n\nThe calm-down corner includes:\n- Soft seating (bean bag, cushion, or small chair)\n- Sensory items (stress balls, fidget tools, textured fabrics)\n- Feelings chart with emotion faces\n- A visual timer (sand timer or digital countdown)\n- Books about feelings\n\nHow to use it:\n- Offer it as a choice, not a punishment: 'Would you like some time in the calm-down corner?'\n- If a child chooses to go, check on them after a few minutes\n- When they are ready, welcome them back without interrogation: 'Glad you are back. We missed you.'\n\n[callout-info]Children can also use the calm-down corner when they are not upset. Some children just need a few minutes of quiet in a busy environment. That is fine.[/callout-info]\n[flip=Is the calm-down corner a time-out?]No. The calm-down corner is a voluntary self-regulation tool. Children choose to use it. It is never used as punishment. Offer it as a choice: \"Would you like some time in the calm-down corner?\"[/flip]"},{"type":"selfcheck","title":"Quick Check","q":"The calm-down corner is:","opts":["A time-out spot for misbehavior","A self-regulation tool children can choose to use","Only for children who cry","A punishment for aggressive behavior"],"ans":1,"explanation":"The calm-down corner is a voluntary self-regulation tool. It is never used as punishment."},{"type":"content","title":"Helping Children Name Their Feelings","body":"Many children do not have the vocabulary to express how they feel. Teaching emotional vocabulary is a core part of trauma-informed care.\n\nDaily practices at BHA:\n- Morning check-in: 'How is your heart feeling today?' (use a feelings board with faces)\n- Labeling emotions as you see them: 'It looks like you are feeling disappointed that the red paint is all gone.'\n- Reading books about emotions during circle time\n- Using 'I feel' statements yourself: 'I feel frustrated when things are messy. Let us clean up together.'\n\n[callout-tip]Start with basic emotions (happy, sad, mad, scared) for younger children. As they grow, introduce more nuanced vocabulary (frustrated, disappointed, anxious, proud, embarrassed, lonely).[/callout-tip]"},{"type":"content","title":"Co-Regulation","body":"Co-regulation is when an adult uses their own calm to help a child return to a regulated state. Children cannot self-regulate until their brains are developmentally ready (around age 5-7 for basic skills, and the prefrontal cortex is not fully developed until the mid-20s).\n\nCo-regulation techniques:\n- Match their energy first, then slowly bring it down: If a child is crying loudly, speak at a slightly lower volume and slower pace. They will begin to mirror you.\n- Breathe with them: 'Let us take three big breaths together. In through the nose, out through the mouth.'\n- Stay physically close but do not crowd\n- Use a calm, steady voice\n- Wait. Regulation takes time. Do not rush a child through their feelings.\n\n[callout-warn]You cannot co-regulate a child if you are dysregulated yourself. If you feel yourself getting frustrated, take a breath. Ask the director to send a floater if you need a moment.[/callout-warn]\n[reveal=Click for co-regulation techniques]Match their energy, then slowly bring it down. Breathe with them. Stay physically close but do not crowd. Use a calm, steady voice. Wait. Do not rush a child through their feelings.[/reveal]"},{"type":"content","title":"Avoiding Re-Traumatization","body":"Re-traumatization happens when a child's current environment mirrors their past harmful experiences. Common triggers in child care settings:\n\n- Yelling or raised voices (mirrors domestic violence)\n- Unpredictable schedules or broken promises (mirrors instability)\n- Physical force, even gentle restraint (mirrors physical abuse)\n- Being singled out or shamed in front of peers (mirrors emotional abuse)\n- Being denied food or rest as punishment (mirrors neglect)\n- Abrupt changes without warning (mirrors loss of control)\n\n[callout-danger]Never threaten a child with loss of care: 'If you do not behave, I am going to call your mom to come get you.' For a child who has been abandoned or separated from caregivers, this is terrifying, not motivating.[/callout-danger]\n[flip=Why should you never say \"If you do not behave, I will call your mom to come get you\"?]For a child who has experienced abandonment or separation, this threat is terrifying, not motivating. It mirrors their trauma and triggers a survival response instead of teaching the behavior you want.[/flip]"},{"type":"content","title":"Secondary Traumatic Stress","body":"Working with children who have experienced adversity can take a toll on you. Secondary traumatic stress (STS) is the emotional impact of hearing about or witnessing the effects of trauma in others.\n\nSigns of STS:\n- Emotional exhaustion or feeling numb\n- Difficulty sleeping or increased anxiety\n- Irritability or a shorter temper than usual\n- Feeling hopeless or questioning whether your work matters\n- Physical symptoms like headaches or stomachaches\n\nIf you notice these signs:\n- Talk to someone you trust (director, counselor, friend)\n- Take your breaks. Do not skip them.\n- Practice your own self-care outside of work\n- Remember that caring about the children in your room is a strength, not a weakness\n\n[callout-tip]BHA cares about your well-being, too. If you are struggling, talk to the director. We will find resources to support you.[/callout-tip]"},{"type":"content","title":"Trauma-Informed Language","body":"The words you use matter. Small shifts in language can make a big difference.\n\nInstead of: 'Bad behavior' or 'Acting out'\nSay: 'Challenging behavior' or 'Struggling to cope'\n\nInstead of: 'What is wrong with you?'\nSay: 'What happened? How can I help?'\n\nInstead of: 'You always do this.'\nSay: 'I noticed you are having a hard time today. Let us figure this out together.'\n\nInstead of: 'If you do not stop, you will lose recess.'\nSay: 'I need you to stop. Let us take a breath and try again.'\n\nInstead of: 'Go to the corner.'\nSay: 'Would you like some time in the calm-down corner to regroup?'\n\n[keypoint]Trauma-informed language is not soft or permissive. It is precise, respectful, and effective. You can be firm and compassionate at the same time.[/keypoint]"},{"type":"content","title":"Building Resilience","body":"Trauma-informed care is not just about preventing harm. It is about building resilience, the ability to bounce back from adversity.\n\nResearch shows that the single most protective factor in a child's life is a stable, caring relationship with at least one adult. You can be that adult.\n\nResilience-building practices:\n- Celebrate effort, not just outcomes: 'You worked really hard on that puzzle!'\n- Help children develop problem-solving skills: 'What could you try next?'\n- Encourage healthy risk-taking: 'That climber looks a little scary. I am right here if you want to try it.'\n- Normalize mistakes: 'Everyone makes mistakes. That is how we learn.'\n- Model resilience yourself: 'I made a mistake today. Here is what I did to fix it.'\n\n[callout-tip]Children watch you more than they listen to you. When you model calm, resilience, and honesty, they learn to do the same.[/callout-tip]"},{"type":"selfcheck","title":"Quick Check","q":"A child does not want to participate in the morning check-in. What do you do?","opts":["Require them to participate","Skip them and never ask again","Say 'You can pass today. We will check in with you later.'","Send them to the director"],"ans":2,"explanation":"Participation should always be voluntary. Offer the option to pass and follow up individually later."},{"type":"content","title":"Families as Partners","body":"Trauma-informed care extends to families. Parents and caregivers may also be navigating their own adversity.\n\nHow to be trauma-informed with families:\n- Never judge a family's circumstances, structure, or choices\n- Use welcoming language: 'We are glad you are here' rather than 'You are late.'\n- Provide information and resources without being condescending\n- Respect cultural differences in parenting\n- Understand that a parent who seems disengaged may be overwhelmed, not uncaring\n\n[callout-warn]If a parent shares personal information with you (mental health struggles, domestic violence, substance use), do not share it with other staff unless it directly affects the child's safety. Direct the parent to the director for support resources.[/callout-warn]"},{"type":"content","title":"Cultural Humility","body":"Trauma-informed care requires cultural humility. This means:\n\n- Recognizing that your own cultural background shapes how you see the world\n- Being curious about other cultures rather than making assumptions\n- Understanding that what looks like a 'behavior problem' may be a cultural difference\n- Never using a child's race, ethnicity, religion, or family structure to explain their behavior\n- Asking families how they prefer to be addressed and what is important to them\n\n[callout-info]BHA serves families from many different backgrounds. Some families celebrate different holidays, speak different languages, eat different foods, and have different expectations about school. Our job is to learn, not to judge.[/callout-info]"},{"type":"content","title":"Putting It Into Practice: Daily Check-In","body":"Every BHA classroom begins the day with a social-emotional check-in. Here is how it works:\n\n1. Gather children in a circle.\n2. Use a feelings board with emotion faces (happy, sad, mad, scared, worried, excited, tired).\n3. Each child points to or names how they are feeling.\n4. The teacher validates: 'Thank you for sharing. It is okay to feel that way.'\n5. If a child says they are sad or scared, follow up privately later: 'You said you were feeling sad this morning. Do you want to tell me about it?'\n\nThe check-in takes 5 to 10 minutes. It sets the tone for the entire day.\n\n[callout-tip]Do not force participation. Some children will not want to share every day. That is okay. Say, 'You can pass today. We will check in with you later.' Participation should always be voluntary.[/callout-tip]"},{"type":"content","title":"Scenario: Trauma-Informed Response","body":"[scenario]A 4-year-old in your class, Marcus, has been at BHA for three weeks. He is usually quiet but today during cleanup time, another child accidentally knocked over his block tower. Marcus screamed, swept all the blocks off the table, and crawled under it. He is crying and refusing to come out.\n\nA non-trauma-informed response: 'Marcus, get out from under the table right now. You need to clean up the mess you made.'\n\nA trauma-informed response:\n1. Get down to his level. Kneel near the table without crowding him.\n2. Use a calm, quiet voice: 'Marcus, I can see you are really upset. I am right here.'\n3. Wait. Let him cry. Do not rush him.\n4. After a minute or two: 'When you are ready, you can come out. I will help you rebuild your tower.'\n5. When he comes out, do not lecture. Say: 'Thank you for coming out. Let us take some big breaths together.'\n6. Later, when he is calm, help him name what happened: 'Your tower fell down and that made you really mad. It is hard when something you worked on gets knocked over.'\n7. Document the incident factually in Brightwheel.[/scenario]"},{"type":"content","title":"Self-Care Is Professional Care","body":"You cannot pour from an empty cup. Taking care of yourself is not selfish. It is essential.\n\nBHA supports your well-being by:\n- Providing scheduled breaks (take them, do not skip them)\n- Maintaining appropriate ratios so you are not overwhelmed\n- Creating a team culture where it is okay to say 'I need a minute'\n\nYour responsibilities:\n- Take your breaks\n- Use your time off\n- Set boundaries between work and home\n- Talk to someone when you are struggling\n- Remember why you chose this work\n\n[callout-tip]At the end of a hard day, ask yourself: 'Did I show up for the children in my care with patience, respect, and compassion?' If the answer is yes, you did your job. Tomorrow is a new day.[/callout-tip]"},{"type": "scenario-branch", "title": "Interactive Scenario: Child in Crisis", "scenarioId": "m3_meltdown"},{"type":"content","title":"Module 3 Summary","body":"Here is what you should take away from this module:\n\n[keypoint]Trauma-informed care is not a special program. It is BHA's universal approach to caring for every child, every day, with patience, consistency, and respect.[/keypoint]\n\n- Trauma affects brain development and behavior. Responses that look like defiance may be survival instincts.\n- Use the Four Rs: Realize, Recognize, Respond, Resist Re-traumatization.\n- Create physical and emotional safety through predictable routines, calm voices, and consistent responses.\n- Connection is your most powerful tool. Be the stable, caring adult every child deserves.\n- Help children name their feelings and use the calm-down corner as a choice, not a punishment.\n- Practice co-regulation: use your calm to help a child find theirs.\n- Take care of yourself so you can take care of them.\n\nYou are now ready for the Module 3 quiz."}];
const M3_QUIZ=[{"q":"What is the primary principle of trauma-informed care at BHA?","opts":["It is a specialized program for children with diagnosed trauma","It is a universal approach used with ALL children","It applies only to children in foster care","It requires children to disclose their history before receiving support"],"ans":1},{"q":"When a child overreacts to a minor event, what should you consider first?","opts":["The child is being manipulative","The child is not listening","The child's brain may be responding to a past experience","The child needs stricter discipline"],"ans":2},{"q":"What is the calm-down corner used for at BHA?","opts":["Time-out for misbehavior","A self-regulation tool children can choose to use","Isolation from the group as punishment","Only for children who cry"],"ans":1},{"q":"Which of the following is a sign of secondary traumatic stress in a caregiver?","opts":["Feeling energized and motivated every day","Emotional exhaustion or feeling numb","Wanting to work overtime","Having no opinions about the children"],"ans":1},{"q":"What is co-regulation?","opts":["Two teachers managing a classroom together","An adult using their own calm to help a child return to a regulated state","Requiring a child to calm down before they can rejoin the group","Matching the child's energy level exactly"],"ans":1},{"q":"What should you do if a child does not want to be hugged?","opts":["Insist, because physical contact is important","Ask their parent to tell them it is okay","Respect it and offer comfort through presence and words","Document it as a behavioral concern"],"ans":2},{"q":"Which of these is a trauma-informed response to a child knocking over blocks in anger?","opts":["Send them to the corner immediately","Say 'I can see you are really upset. I am right here.'","Tell them they have lost recess","Ignore the behavior completely"],"ans":1},{"q":"What does the daily social-emotional check-in involve?","opts":["Testing children on their ABC knowledge","Children sharing how they are feeling using a feelings board","A physical fitness warm-up","Reviewing the rules with the whole class"],"ans":1}];
const M4_SLIDES=[{"type":"title","title":"Module 4: Social-Emotional Development and Positive Guidance","sub":"How BHA approaches discipline, behavior, and emotional growth. What we do, what we never do, and why it matters."},{"type":"content","title":"BHA's Guidance Philosophy","body":"At BHA, we do not use the word 'discipline' in the traditional sense. We use the word **guidance** because our goal is to teach children how to manage their emotions and make good choices, not to punish them for making mistakes.\n\nOur core belief: Every behavior is communication. When a child acts out, they are telling you something. Your job is to figure out what they need, not to make the behavior stop through fear or force.\n\nPositive guidance means:\n- Setting clear, consistent, age-appropriate expectations\n- Teaching children what TO do, not just what NOT to do\n- Using natural and logical consequences instead of punishment\n- Modeling the behavior we want to see\n- Giving children the language to express their feelings\n- Recognizing and reinforcing positive behavior\n\n[callout-info]This approach takes more patience than traditional discipline. It also produces better outcomes. Children who are guided rather than punished develop stronger self-regulation, better social skills, and deeper trust in their caregivers.[/callout-info]"},{"type":"content","title":"What Is NEVER Permitted at BHA","body":"The following actions are prohibited under all circumstances. Violations will result in immediate corrective action, up to and including termination.\n\nPhysical punishment of any kind:\n- Hitting, spanking, slapping, pinching, shaking, or any physical force\n- Forcing a child into uncomfortable positions\n- Restricting movement as punishment\n\nVerbal and emotional punishment:\n- Yelling, screaming, or using a threatening tone\n- Name-calling, shaming, or belittling\n- Using sarcasm or mocking\n- Threatening to call parents as punishment\n- Comparing children to each other negatively\n\nWithholding basic needs:\n- You may never withhold food, water, rest, or bathroom access for any reason\n- You may never deny a child outdoor play time as punishment\n\n[callout-danger]There is no gray area here. If you see another staff member doing any of the above, you must report it to the director immediately. You will not face retaliation for reporting a policy violation.[/callout-danger]\n[accordion=What happens if I see another staff member using prohibited discipline?]Report it to the director immediately. You will not face retaliation. If the behavior involves harm to a child, also report to the Texas Abuse Hotline at 1-800-252-5400. Protecting a colleague who is hurting a child makes you complicit.[/accordion]"},{"type":"content","title":"Age-Appropriate Expectations: Infants (0-11 months)","body":"Infants are not capable of intentional misbehavior. Everything they do is driven by basic needs.\n\nWhat to expect:\n- Crying is their primary form of communication\n- They will grab, pull, and put things in their mouths (this is exploration, not misbehavior)\n- They may pull hair or scratch (they do not understand cause and effect yet)\n\nYour role:\n- Respond to cries promptly. An infant who learns their cries are heard develops trust.\n- Redirect gently. Remove objects that are not safe. Move the infant to a different activity.\n- Use a calm, soothing voice at all times.\n- Never say 'no' to an infant as a behavioral correction. They do not understand the concept.\n\n[callout-tip]When an infant pulls your hair, gently unwrap their fingers and say, 'Gentle touch,' while stroking their hand softly. This is not discipline. It is teaching.[/callout-tip]"},{"type":"content","title":"Age-Appropriate Expectations: Toddlers (12-35 months)","body":"Toddlers are developing independence, which means they will test boundaries. This is healthy and normal.\n\nWhat to expect:\n- Frequent use of the word 'no' and 'mine'\n- Difficulty sharing (they are not developmentally ready for true sharing until around age 3-4)\n- Tantrums when overwhelmed, frustrated, or unable to communicate\n- Biting, hitting, and pushing (more on this in a later slide)\n- Short attention spans\n\nYour role:\n- Offer two choices instead of open-ended instructions: 'Do you want the red cup or the blue cup?'\n- Use simple, short sentences: 'Gentle hands. We do not hit.'\n- Redirect, redirect, redirect. Move the child to a new activity.\n- Validate their feelings even when correcting behavior: 'I know you want that toy. It is hard to wait. Let us find something else while we wait.'\n\n[callout-info]Toddlers are not being 'bad' when they test limits. They are doing exactly what their developmental stage requires: figuring out where the boundaries are. Your job is to hold the boundary, calmly and consistently.[/callout-info]"},{"type":"content","title":"Age-Appropriate Expectations: Preschoolers (3-5 years)","body":"Preschoolers are developing social skills, self-regulation, and early empathy. They can begin to understand rules, take turns, and recognize the impact of their actions on others.\n\nWhat to expect:\n- Imaginative play that sometimes includes conflict\n- Tattling (they are learning the rules and want to make sure everyone follows them)\n- Occasional regression under stress (a child who has been potty-trained may have accidents)\n- Testing boundaries with negotiation: 'But why?'\n- Difficulty with impulse control (they know the rule but cannot always follow it in the moment)\n\nYour role:\n- Explain the 'why' behind rules: 'We walk inside because running can hurt someone.'\n- Teach conflict resolution: 'Can you tell Marcus how that made you feel?'\n- Use 'when/then' statements: 'When you clean up your blocks, then we can go outside.'\n- Praise specific behaviors: 'I love how you shared the crayons with Amir. That was very kind.'\n\n[callout-tip]Avoid vague praise like 'good job.' Instead, name the specific behavior: 'You waited patiently for your turn. That shows great self-control.' This teaches children exactly what they did well.[/callout-tip]"},{"type":"selfcheck","title":"Quick Check","q":"A toddler grabs a toy from another child. What is the BEST response?","opts":["Say 'No! We do not grab.'","Take the toy away as punishment","Redirect: 'When Marcus is done, you can have a turn. Let us find something else while we wait.'","Ignore it"],"ans":2,"explanation":"Redirection with validation is the best approach for toddlers. Validate their desire, set the boundary, and offer an alternative."},{"type":"content","title":"Age-Appropriate Expectations: School-Age (5-12 years)","body":"School-age children are developing a sense of identity, social belonging, and moral reasoning. They are capable of understanding consequences, but they still need guidance.\n\nWhat to expect:\n- Peer influence becomes very important\n- They may challenge authority more directly\n- Social conflicts (cliques, exclusion, rumors)\n- Desire for autonomy and responsibility\n- Academic and social pressure\n\nYour role:\n- Involve them in setting group rules and expectations\n- Use logical consequences that are connected to the behavior: 'You threw the ball at the window. You need to take a break from the ball for the rest of recess.'\n- Encourage problem-solving: 'What could you do differently next time?'\n- Respect their growing independence while maintaining clear boundaries\n- Listen more than you talk\n\n[callout-info]School-age children at BHA participate in an enrichment-based program, not a traditional classroom. Activities emphasize leadership, teamwork, and creative problem-solving.[/callout-info]"},{"type":"content","title":"Positive Guidance Strategies: Redirection","body":"Redirection is your most-used tool. It means guiding a child away from an undesirable behavior toward an appropriate one.\n\nExamples:\n- A toddler is about to throw a block: 'Blocks are for building. Let us see how high we can stack them!'\n- A preschooler is running inside: 'Walking feet inside! We can run fast when we go outside.'\n- Two children are fighting over a toy: 'There are two trucks on the shelf. Let us each pick one.'\n\nKeys to effective redirection:\n- Act quickly, before the behavior escalates\n- Use an enthusiastic tone. Make the alternative appealing.\n- Do not just say 'no.' Always provide a substitute behavior or activity.\n- Follow up with praise when the child engages in the redirected behavior.\n\n[callout-tip]Redirection works best when the alternative is at least as interesting as what the child was doing. Telling a child to stop banging a drum and sit quietly is not effective redirection. Offering them a different instrument or a sensory bin is.[/callout-tip]"},{"type":"content","title":"Positive Guidance Strategies: Natural and Logical Consequences","body":"Natural consequences happen on their own. Logical consequences are set by the adult and connected to the behavior.\n\nNatural consequence: A child refuses to put on their jacket. They go outside and feel cold. (Within safety limits.)\n\nLogical consequence: A child deliberately spills their water. They help clean it up.\n\nRules for logical consequences:\n- Related: The consequence must be connected to the behavior.\n- Respectful: Delivered without shame, anger, or sarcasm.\n- Reasonable: Proportional to the behavior. A child who throws one crayon does not lose art time for the week.\n\n[callout-warn]Natural consequences should never put a child's safety at risk. If a toddler runs toward the street, you do not let the 'natural consequence' teach the lesson. You physically intervene. Safety always comes first.[/callout-warn]"},{"type":"content","title":"Positive Guidance Strategies: Positive Reinforcement","body":"Positive reinforcement means acknowledging and encouraging desired behavior. Research consistently shows that positive reinforcement is more effective than punishment at changing behavior.\n\nEffective positive reinforcement:\n- Be specific: 'You used your words to ask for a turn instead of grabbing. Great job!'\n- Be immediate: Praise the behavior as soon as you see it.\n- Be genuine: Children can tell when you are being fake.\n- Use a variety of methods: verbal praise, high-fives, stickers (for older children), extra story time\n\nWhat NOT to do:\n- Do not use food as a reward\n- Do not compare children: 'Why can't you sit nicely like Sarah?' This is shaming, not reinforcement.\n- Do not over-praise to the point where it loses meaning\n\n[callout-tip]Try a 'caught you being kind' board in your classroom. When you notice a child doing something kind, helpful, or brave, write it on a sticky note and add it to the board. Read them at circle time.[/callout-tip]"},{"type":"content","title":"Biting: Why It Happens","body":"Biting is one of the most common and distressing behaviors in early childhood settings. It is also one of the most misunderstood.\n\nWhy children bite:\n- Teething pain (infants and young toddlers)\n- Frustration or inability to communicate (toddlers who do not yet have words)\n- Overstimulation or sensory overload\n- Experimenting with cause and effect: 'What happens when I bite?'\n- Seeking attention\n- Feeling threatened or scared\n\n[callout-info]Biting is developmentally normal in children under age 3. It is not a sign of aggression, a personality problem, or bad parenting. It is a phase that most children outgrow with proper guidance.[/callout-info]"},{"type":"content","title":"Biting: BHA's Response Protocol","body":"When a bite happens, follow this exact protocol:\n\n1. Attend to the bitten child first. Clean the wound, apply a cold compress, and comfort them.\n2. Calmly address the child who bit. Get on their level. Say firmly but without anger: 'Biting hurts. I cannot let you bite. Gentle touches only.'\n3. Separate the children briefly. The child who bit may go to the calm-down corner.\n4. Document the incident in Brightwheel for both children's parents.\n5. Notify both parents at pickup. Be factual: 'There was a biting incident today. [Child's name] was [bitten/the one who bit]. Here is what happened and what we did.'\n\n[callout-warn]NEVER identify the other child by name to either parent. Say 'another child,' not 'Tommy bit your son.' Confidentiality applies even (especially) during incident reports.[/callout-warn]\n[reveal=Click for the step-by-step biting response]1. Attend to the bitten child first (clean, cold compress, comfort). 2. Calmly address the child who bit at their level. 3. Separate briefly. 4. Document in Brightwheel for both families. 5. Notify both parents at pickup without identifying the other child.[/reveal]"},{"type":"content","title":"Biting: Prevention Strategies","body":"Prevention is always better than response. If a child is biting frequently:\n\n1. Observe patterns. When does it happen? Where? With whom? Is the child tired, hungry, or overstimulated?\n2. Increase supervision around the child who bites. Stay close during high-risk times (transitions, free play).\n3. Provide appropriate sensory outlets: teething rings, chewy toys, crunchy snacks.\n4. Teach the child replacement behaviors: 'When you are mad, stomp your feet!' or 'Use your words: I do not like that.'\n5. If biting persists, the director will work with the family to develop an individualized plan.\n\n[callout-info]Most biting phases resolve within a few weeks to a couple of months with consistent redirection and increased supervision. Patience is essential.[/callout-info]"},{"type":"selfcheck","title":"Quick Check","q":"A child bites another child. What do you do FIRST?","opts":["Scold the child who bit","Attend to the bitten child first","Call both parents immediately","Send the child who bit home"],"ans":1,"explanation":"Always attend to the injured child first. Clean the wound, apply a cold compress, and comfort them. Then calmly address the child who bit."},{"type":"content","title":"Handling Aggression","body":"When a child hits, pushes, throws objects, or shows other aggressive behavior:\n\n1. Intervene immediately to prevent harm. Position yourself between children if needed.\n2. Use a calm, firm voice: 'I cannot let you hurt other people. Hitting is not okay.'\n3. Regulate first, talk later. If the child is still dysregulated, help them calm down before trying to process the incident.\n4. Once calm, help them repair: 'You pushed Ella and she fell down. She is crying. Can you check on her?'\n5. Document the incident.\n\n[callout-warn]Do not force a child to apologize. A forced apology teaches compliance, not empathy. Instead, model what repair looks like: 'I see Ella is upset. I wonder if there is something we could do to help her feel better.' Let the child come up with the idea, even if it takes time.[/callout-warn]"},{"type":"content","title":"The Regulate-Before-Redirect Approach","body":"A child in the middle of a meltdown cannot learn. Their thinking brain is offline. Trying to reason with a dysregulated child is like trying to teach algebra during a fire alarm.\n\nStep 1: Regulate\n- Co-regulate with your presence and calm voice\n- Offer deep breaths, a calm-down corner, or sensory tools\n- Wait until the child's body is calm (shoulders drop, breathing slows, crying stops)\n\nStep 2: Relate\n- Connect before you correct: 'That was really hard. I am glad you are calming down.'\n- Validate their feeling: 'You were really angry that the game was over.'\n\nStep 3: Redirect\n- Now teach: 'Next time you feel that angry, what could you do instead?'\n- Help them practice the replacement behavior\n\n[keypoint]Regulate. Relate. Redirect. In that order. Every time.[/keypoint]\n[flip=What is the correct order?]Regulate first (help them calm down), Relate second (connect and validate), Redirect third (teach the replacement behavior). Always in that order.[/flip]"},{"type":"content","title":"Documenting Behavior","body":"Accurate behavior documentation serves multiple purposes: tracking patterns, communicating with families, and protecting you and BHA if questions arise.\n\nWhat to write:\n- Date, time, and location\n- What happened (objective facts only)\n- What led up to the behavior (antecedent)\n- How you responded\n- How the child responded to your intervention\n- Who was notified\n\nWhat NOT to write:\n- Opinions: 'He was being a bully' (instead: 'He pushed two children during free play')\n- Diagnoses: 'She clearly has ADHD' (you are not qualified to diagnose)\n- Blame: 'This happened because his mother does not set limits at home'\n- Other children's names in reports going to a specific family\n\n[callout-tip]Write incident reports as though a judge will read them. Be factual, be complete, and be neutral.[/callout-tip]"},{"type":"content","title":"Talking to Parents About Behavior","body":"Conversations with parents about challenging behavior can be difficult. Here is how to approach them:\n\n1. Start with the positive. Always. 'Marcus had a great morning during art time. He was so focused on his painting.'\n2. Be factual, not emotional. 'During outdoor play, Marcus pushed another child off the tricycle. I intervened, helped him calm down, and we talked about taking turns.'\n3. Share what you are doing. 'We are working on using words to ask for a turn instead of pushing.'\n4. Ask for partnership. 'Is there anything happening at home that might be affecting Marcus? We want to support him.'\n5. Never blame the parent. Even if you suspect the home environment is a factor.\n\n[callout-warn]These conversations should happen at pickup or via Brightwheel, not in front of other families or children. Respect the family's privacy.[/callout-warn]"},{"type":"content","title":"BHA's Character Development Framework","body":"Each month, BHA highlights a specific character trait. The monthly trait is woven into classroom activities, stories, and recognition.\n\nExample monthly traits:\n- September: Kindness\n- October: Courage\n- November: Gratitude\n- December: Generosity\n- January: Perseverance\n- February: Friendship\n- March: Responsibility\n- April: Honesty\n\nHow it works:\n- The monthly trait is introduced at morning circle\n- Stories and activities are selected to reinforce the trait\n- Staff 'catch' children demonstrating the trait and recognize them\n- At the end of the month, each classroom celebrates children who showed the trait consistently\n\n[callout-tip]Look for quiet examples, not just obvious ones. The child who picks up a friend's spilled crayons without being asked is showing kindness just as much as the child who shares their snack.[/callout-tip]\n[accordion=Example monthly character traits]September: Kindness. October: Courage. November: Gratitude. December: Generosity. January: Perseverance. February: Friendship. March: Responsibility. April: Honesty. Staff \"catch\" children demonstrating the trait and recognize them throughout the month.[/accordion]"},{"type":"content","title":"The Daily Social-Emotional Check-In","body":"As covered in Module 3, every BHA classroom begins the day with a social-emotional check-in. Here is a deeper look at how it supports positive guidance:\n\nThe check-in allows you to:\n- Identify children who are arriving in a heightened emotional state\n- Proactively offer support before behavior escalates\n- Build a classroom culture where feelings are normalized and respected\n- Track emotional patterns over time (is a child consistently arriving sad or angry?)\n\n[scenario]During morning check-in, 3-year-old Nia points to the 'scared' face on the feelings board. She says, 'Scared.' You say, 'Thank you for sharing, Nia. I am glad you told me. After circle, I will sit with you and we can talk about it.' After circle, you learn that Nia's dog got out of the yard last night and her family was worried. You validate her feelings: 'That sounds really scary. I hope your dog comes home safe. I am glad you are here and you are safe.'\n\nResult: Nia's anxiety is addressed early. Without the check-in, she might have had a meltdown during a transition later, and you would not have understood why.[/scenario]"},{"type":"content","title":"Relationship-Building Circles","body":"Relationship-building circles are a structured time for children to practice social skills in a group setting.\n\nFormat:\n- Children sit in a circle\n- The teacher introduces a prompt or activity\n- Each child has a turn to participate (or pass)\n\nExample prompts:\n- 'Tell us one thing that makes you happy.'\n- 'Who is someone you are thankful for?'\n- 'What is something kind you saw today?'\n- 'If you could have any superpower, what would it be?'\n\nRules of the circle:\n- One person talks at a time\n- We listen with our ears and our hearts\n- It is okay to pass\n- What is shared in the circle stays in the circle\n\n[callout-info]Circles build empathy, active listening, and a sense of community. Even toddlers can participate in simplified versions ('Show me a happy face! Show me a silly face!').[/callout-info]"},{"type":"selfcheck","title":"Quick Check","q":"A child is in the middle of a meltdown. What is the correct order?","opts":["Redirect, Regulate, Relate","Regulate, Relate, Redirect","Relate, Redirect, Regulate","Redirect, Relate, Regulate"],"ans":1,"explanation":"Regulate first (help them calm down), Relate second (connect and validate), Redirect third (teach the replacement behavior). In that order, every time."},{"type":"content","title":"Family Connection Practice","body":"BHA's third unique differentiator is our family connection practice. We honor every family structure and build bridges between home and school.\n\nExamples:\n- 'All About My Family' projects where children share their family through drawings, photos, or stories\n- Classroom displays that celebrate diverse family structures (single parents, grandparents, two moms, two dads, blended families, extended family households)\n- Family events that are inclusive and accessible (varied times, no cost to families, multilingual when possible)\n\n[callout-warn]Never assume a child's family structure. Do not ask 'What does your mom think?' if you do not know whether the child has a mom. Instead, ask open-ended questions: 'Who do you live with?' or 'Tell me about your family.'[/callout-warn]"},{"type":"content","title":"When Guidance Is Not Enough","body":"Sometimes, despite consistent positive guidance, a child's behavior does not improve or escalates to a level that affects the safety of other children.\n\nWhen this happens:\n1. Document patterns over at least 2 weeks. The director needs data to act.\n2. Meet with the director to develop an individualized behavior support plan.\n3. Meet with the family to share observations (facts, not judgments) and create a partnership.\n4. Consider whether external support is needed (developmental screening, occupational therapy, counseling).\n5. BHA will provide referrals. We do not diagnose or prescribe, but we connect families to professionals who can.\n\n[callout-info]Behavior is communication. If a child's behavior is not improving, it means we have not yet figured out what they are trying to tell us. Keep observing. Keep asking. Keep trying.[/callout-info]"},{"type":"content","title":"Taking Care of Yourself","body":"Dealing with challenging behavior all day is exhausting. If you are not taking care of yourself, your patience will run out and your guidance will suffer.\n\nReminders:\n- Take your breaks. Step out of the classroom. Breathe.\n- It is okay to ask the director or floater to take over when you feel your frustration rising.\n- Do not take children's behavior personally. A toddler who hits you is not attacking your character.\n- Talk to your team. Debrief after difficult days.\n- Celebrate your wins. Did you stay calm during a meltdown? That is a win.\n\n[callout-tip]If you are ever in a situation where you feel you might lose your composure, step back and ask for help. There is no shame in tagging out. It is a sign of professional maturity.[/callout-tip]"},{"type":"content","title":"Scenario: Applying Positive Guidance","body":"[scenario]You are in Classroom 4 with 3-year-olds. It is free play time and two children, Jayden and Sofia, are fighting over the same fire truck. Jayden grabs it out of Sofia's hands and pushes her. She falls down and starts crying.\n\nStep 1 (Safety): Move to Jayden and Sofia quickly. Position yourself between them.\n\nStep 2 (Attend to the hurt child): Kneel next to Sofia. 'Are you okay? Let me see. You fell down. That must have hurt.' Check for injury.\n\nStep 3 (Regulate the other child): Turn to Jayden, who is clutching the truck and looks defiant. Get on his level. Use a firm but calm voice: 'Jayden, pushing hurts. I cannot let you push Sofia.'\n\nStep 4 (Wait for calm): If Jayden is still agitated, wait. Do not try to reason yet.\n\nStep 5 (Teach): Once he is calm: 'You really wanted that fire truck. I understand. When someone has something you want, you can say, Can I have a turn when you are done? Let us practice.'\n\nStep 6 (Repair): 'Sofia fell down when you pushed her. She is sad. Is there something you could do to help her feel better?' Let him decide. Maybe he offers the truck. Maybe he says sorry. Maybe he just sits near her.\n\nStep 7 (Document): Log the incident in Brightwheel for both families. Do not include the other child's name in either report.[/scenario]"},{"type": "scenario-branch", "title": "Interactive Scenario: Biting Incident", "scenarioId": "m4_biting"},{"type":"content","title":"Module 4 Summary","body":"Here is what you should take away from this module:\n\n[keypoint]Every behavior is communication. Your job is to guide, teach, and model, never to punish, shame, or control.[/keypoint]\n\n- BHA uses positive guidance. Physical, verbal, and emotional punishment are prohibited without exception.\n- Expectations must match the child's developmental stage.\n- Redirection, natural and logical consequences, and positive reinforcement are your primary tools.\n- Biting is developmentally normal. Follow the protocol. Stay calm.\n- Use the Regulate-Before-Redirect approach: regulate first, relate second, redirect third.\n- Document behavior factually and without judgment.\n- Partner with families respectfully and privately.\n- BHA's character development framework, daily check-in, and family connection practices reinforce positive guidance.\n- Take care of yourself so you can take care of them.\n\nYou are now ready for the Module 4 quiz."}];
const M4_QUIZ=[{"q":"What is BHA's core belief about children's behavior?","opts":["Misbehavior should be corrected immediately with consequences","Every behavior is communication","Some children are naturally more difficult","Children must learn to obey authority"],"ans":1},{"q":"Which of the following is NEVER permitted at BHA?","opts":["Offering a child a choice between two activities","Using a firm but calm voice","Withholding food as a consequence for behavior","Using the calm-down corner as a voluntary option"],"ans":2},{"q":"At what age is biting considered developmentally normal?","opts":["Under 1 year only","Under 3 years","Under 5 years","It is never normal"],"ans":1},{"q":"What is the correct order of the Regulate-Before-Redirect approach?","opts":["Redirect, Regulate, Relate","Relate, Redirect, Regulate","Regulate, Relate, Redirect","Redirect, Relate, Regulate"],"ans":2},{"q":"When documenting a biting incident for a parent, what should you NOT include?","opts":["The time and location of the incident","What happened and how you responded","The name of the other child involved","How the child responded to your intervention"],"ans":2},{"q":"What should you do before trying to reason with a dysregulated child?","opts":["Send them to the director's office","Wait until they are calm (regulated) first","Give them a stern warning","Call their parent immediately"],"ans":1},{"q":"A child refuses to apologize after pushing a classmate. What should you do?","opts":["Force the apology so the hurt child feels better","Send them home for the day","Do not force it; model repair and let the child decide how to make it right","Withhold recess until they apologize"],"ans":2}];
const M5_SLIDES=[{"type":"title","title":"Module 5: Health, Safety, and Emergency Procedures","sub":"Protecting children through preparedness, prevention, and proper response. This module covers fire safety, severe weather, lockdowns, first aid, medication, illness policies, and safe sleep."},{"type":"content","title":"Emergency Preparedness Overview","body":"BHA maintains a comprehensive Emergency Preparedness Plan that covers every type of emergency you may encounter. This plan is posted in every classroom and in the director's office.\n\nTypes of emergencies covered:\n- Fire\n- Severe weather (tornado, severe thunderstorm)\n- Lockdown (intruder, nearby threat)\n- Medical emergency\n- Gas leak or chemical spill\n- Power outage\n- Missing child\n- Natural disaster\n\nYour responsibilities:\n1. Know the emergency procedures for your classroom\n2. Know the evacuation routes and shelter-in-place locations\n3. Keep the emergency binder, attendance roster, and first aid kit accessible at all times\n4. Participate in all drills\n\n[callout-warn]During any emergency, your first priority is always the children. Account for every child in your care. Count them. Count them again.[/callout-warn]"},{"type":"content","title":"Fire Procedures: R.A.C.E.","body":"If you discover a fire or the fire alarm sounds, follow R.A.C.E.:\n\nR - Rescue: Remove any children or staff from immediate danger. If a child is near the fire, move them away.\n\nA - Alert: Pull the nearest fire alarm if it has not already been activated. Call 911.\n\nC - Contain: Close doors behind you as you evacuate. This slows the spread of fire and smoke.\n\nE - Evacuate: Follow the posted evacuation route to the designated assembly point (the far end of the parking lot, away from the building).\n\n[callout-danger]Never go back into the building for any reason, including personal belongings, until the fire department gives the all-clear.[/callout-danger]\n[flip=What does R.A.C.E. stand for?]Rescue (remove from danger), Alert (pull alarm, call 911), Contain (close doors), Evacuate (follow route to assembly point).[/flip]"},{"type":"content","title":"Fire Evacuation: Step by Step","body":"1. When the alarm sounds, stop whatever you are doing.\n2. Grab the attendance roster/clipboard and emergency binder.\n3. Line children up quickly. Assign older children a buddy.\n4. Walk (do not run) to the nearest exit following the posted route.\n5. Close the classroom door behind you (do not lock it).\n6. Proceed to the assembly point.\n7. Count children immediately. Compare to your attendance roster.\n8. Report your count to the director: 'Classroom 3, all 11 children accounted for' or 'Classroom 3, one child unaccounted for.'\n9. Keep children calm and together. Do not let them wander.\n10. Wait for the all-clear from the fire department.\n\n[callout-info]For infants: Use the evacuation crib (a rolling crib designed for quick transport). Place multiple infants in the crib and wheel it out. Know where your evacuation crib is before an emergency happens.[/callout-info]"},{"type":"content","title":"Fire Drills","body":"BHA conducts fire drills monthly, as required by TAC 746.\n\nDrill expectations:\n- All children and staff present must participate\n- Evacuation must be completed within 3 minutes\n- The director documents: date, time started, time evacuation completed, total number of participants, and any issues observed\n\nAfter each drill, the director reviews results with staff:\n- Did everyone follow the route?\n- Were all children accounted for?\n- Were there any bottlenecks or delays?\n- What can we improve?\n\n[callout-tip]Treat every drill as though it is real. The habits you build during drills are the habits that will save lives during an actual emergency.[/callout-tip]"},{"type":"selfcheck","title":"Quick Check","q":"What does the 'C' in R.A.C.E. stand for?","opts":["Call","Count","Contain","Coordinate"],"ans":2,"explanation":"R.A.C.E. = Rescue, Alert, Contain, Evacuate. Contain means closing doors behind you to slow the spread of fire and smoke."},{"type":"content","title":"Severe Weather: Tornado Procedures","body":"When a tornado warning is issued for Ellis County or the severe weather alarm sounds:\n\n1. Move all children to the designated tornado safe room immediately.\n2. Close all doors.\n3. Have children sit on the floor, facing the wall, with their heads covered by their arms.\n4. Place infants in a crib in the safe room and cover the crib with a blanket to protect from debris.\n5. Count children.\n6. Stay in the safe room until the director or emergency services gives the all-clear.\n\n[keypoint]BHA's designated tornado safe room is the hallway between Classrooms 2 and 3. This hallway has no windows and is surrounded by interior walls, which is what makes it the safest spot in the building. Memorize this location.[/keypoint]\n\n[callout-warn]Do not rely on your phone for weather alerts during a tornado. The building's severe weather alarm and the director's announcement are your signals. Act immediately.[/callout-warn]"},{"type":"content","title":"Severe Weather Drills","body":"BHA conducts severe weather drills quarterly, as required by TAC 746.\n\nDrill process:\n1. The director announces the drill over the intercom or in person.\n2. Each classroom moves to the designated safe room.\n3. Staff count children and report to the director.\n4. The drill ends when all classrooms have checked in and the director gives the all-clear.\n\nDrill documentation includes: date, time, number of participants, and time to complete.\n\n[callout-info]Severe weather drills should vary in timing. Some should happen during meals, some during outdoor play, some during nap time. Children need to practice responding no matter what they are doing when the alarm sounds.[/callout-info]"},{"type":"content","title":"Lockdown Procedures","body":"A lockdown is initiated when there is a threat inside or near the building (intruder, active shooter, dangerous person nearby).\n\nWhen a lockdown is announced:\n1. Lock your classroom door immediately.\n2. Move children away from windows and doors.\n3. Turn off lights.\n4. Keep children quiet and calm. For young children, this may mean reading a whispered story or singing softly.\n5. Do not open the door for anyone. The director or law enforcement will unlock it.\n6. Count children.\n7. If you have a phone, text (do not call) the director to confirm your room is secure and all children are accounted for.\n\n[callout-danger]During a lockdown, do not open the door even if someone knocks and says they are a parent, staff member, or delivery person. Wait for official all-clear from the director or law enforcement.[/callout-danger]\n[accordion=What do I do during a lockdown?]Lock the door. Move children away from windows and doors. Turn off lights. Keep children quiet and calm. Do not open the door for anyone. Count children. Text (do not call) the director. Wait for official all-clear.[/accordion]"},{"type":"content","title":"Medical Emergencies","body":"If a child has a medical emergency (seizure, severe allergic reaction, choking, serious fall, loss of consciousness):\n\n1. Call 911 immediately. Do not wait for permission from the director.\n2. Begin first aid if you are trained (CPR, rescue breathing, EpiPen administration if authorized).\n3. Do not move a seriously injured child unless they are in immediate danger.\n4. Send another staff member to notify the director.\n5. Have someone bring the child's emergency contact information and medical file to you.\n6. Stay with the child until emergency services arrive.\n7. A staff member (not the one providing care) must call the child's emergency contact.\n\n[callout-warn]If a child stops breathing or their heart stops, begin CPR immediately. Do not wait for 911 to arrive. Seconds matter.[/callout-warn]"},{"type":"content","title":"First Aid Basics","body":"Every BHA classroom has a fully stocked first aid kit. Know where yours is.\n\nFirst aid kit contents include:\n- Adhesive bandages (various sizes)\n- Sterile gauze pads and tape\n- Disposable gloves\n- Cold packs (instant)\n- Antiseptic wipes\n- Scissors and tweezers\n- CPR breathing barrier\n- First aid manual\n\nCommon first aid responses:\n- Minor cuts and scrapes: Clean with soap and water, apply antiseptic, cover with bandage.\n- Bumps and bruises: Apply cold compress for 15 minutes.\n- Nosebleeds: Have the child lean forward (not back), pinch the soft part of the nose for 10 minutes.\n- Splinters: Use tweezers to remove if visible. Clean area. Notify parent.\n\n[callout-info]All first aid administered must be documented in Brightwheel. Even a small bandage on a scraped knee should be logged and the parent notified.[/callout-info]"},{"type":"content","title":"Choking Response","body":"Choking is one of the most common life-threatening emergencies in child care. Know the response for each age group:\n\nInfants (under 1 year):\n- 5 back blows (heel of hand between shoulder blades)\n- 5 chest thrusts (two fingers on breastbone)\n- Alternate until object is dislodged or infant loses consciousness\n- If unconscious, begin infant CPR and call 911\n\nChildren (over 1 year):\n- Encourage coughing if the child can still breathe and cough\n- If the child cannot breathe, cough, or speak: perform abdominal thrusts (Heimlich maneuver)\n- Continue until object is dislodged or child loses consciousness\n- If unconscious, begin CPR and call 911\n\n[callout-danger]Never perform abdominal thrusts on an infant. The technique is different for children under 1 year. If you have not been trained, get CPR/First Aid certified immediately.[/callout-danger]\n[reveal=Click for infant vs. child choking response]Infants (under 1): 5 back blows, 5 chest thrusts, alternate until cleared. Never do abdominal thrusts on an infant. Children (over 1): Encourage coughing if they can breathe. If not, perform abdominal thrusts (Heimlich). If unconscious, begin CPR and call 911.[/reveal]"},{"type":"selfcheck","title":"Quick Check","q":"A child has a fever of 100.4 F. What do you do?","opts":["Monitor them for an hour to see if it goes down","Give them children's Tylenol","Isolate them, notify the parent, and document in Brightwheel","Send them outside for fresh air"],"ans":2,"explanation":"A fever of 100.4 F or higher requires the child to be excluded from care. Isolate, notify the parent, and document."},{"type":"content","title":"Illness Policies","body":"Children who are ill must be excluded from care to protect other children and staff.\n\nA child must be sent home or excluded from care if they have:\n- Fever of 100.4 degrees F or higher\n- Vomiting (2 or more episodes in 24 hours)\n- Diarrhea (2 or more loose stools in 24 hours)\n- Undiagnosed rash\n- Pink eye (conjunctivitis) until treated for 24 hours\n- Head lice (until treated)\n- Any communicable disease (chickenpox, hand-foot-mouth, strep throat, etc.)\n\nThe child may return when:\n- They have been symptom-free for 24 hours without medication, OR\n- They have a doctor's note clearing them to return\n\n[callout-info]If a child develops symptoms during the day, isolate them in a supervised area, notify the parent immediately, and document the symptoms in Brightwheel.[/callout-info]"},{"type":"content","title":"Medication Administration Review","body":"Medication administration was introduced in Module 1. Here is a deeper review:\n\nWho may administer medication? Only staff who have been designated and trained by the director.\n\nRequirements:\n1. Written parental consent (BHA Medication Authorization Form, signed and dated)\n2. Medication in original, labeled container with child's name\n3. Clear dosage instructions from the parent and/or physician\n4. Medication stored in locked cabinet or refrigerator as required\n\nAdministration steps:\n1. Verify the child's name on the form matches the medication label.\n2. Verify the dosage and time.\n3. Administer the medication.\n4. Document on the Medication Administration Log: child's name, medication name, dosage, time, and your signature.\n5. Return medication to locked storage.\n\n[callout-danger]Never administer a medication that is expired. Never administer a dosage different from what is authorized. If you have any doubt, do not administer. Contact the director.[/callout-danger]"},{"type":"content","title":"Safe Sleep Review","body":"Safe sleep was covered in Module 1. Here is a reinforcement of the critical points for Nursery staff:\n\n1. Back to sleep. Always. No exceptions.\n2. Firm, flat mattress with a fitted sheet only. Nothing else in the crib.\n3. No swaddling. Not even if the parent requests it.\n4. Visual checks every 15 minutes, documented on the Safe Sleep Log.\n5. Each infant has their own crib. No bed-sharing, no car seats for sleeping, no swings for extended naps.\n\n[callout-danger]If you find an infant face-down in the crib and they cannot roll independently, gently reposition them onto their back. Document the repositioning.[/callout-danger]"},{"type":"content","title":"Handwashing and Sanitation Review","body":"Proper handwashing and sanitation are your primary tools for preventing the spread of illness.\n\nSanitizing schedule:\n- Tables: Before and after meals, after art activities\n- Diaper changing surfaces: After every diaper change\n- Toys: Daily for infant/toddler rooms; weekly for preschool and school-age (immediately if mouthed)\n- Doorknobs and light switches: Twice daily\n- Bathrooms: After each use by staff; deep clean daily\n\nBleach solution ratio for general sanitizing: 1 tablespoon of bleach per 1 gallon of water. Solution must be mixed fresh daily.\n\n[callout-warn]Allow sanitized surfaces to air dry. The drying process is what kills germs. Wiping a surface dry with a towel after applying sanitizer defeats the purpose.[/callout-warn]"},{"type":"content","title":"Hazardous Materials Review","body":"All hazardous materials must be stored in a locked cabinet, out of children's reach. This includes:\n- Cleaning supplies (bleach, disinfectant sprays, all-purpose cleaners)\n- Sanitizing solutions\n- Hand sanitizer (alcohol-based: keep out of children's reach)\n- Art supplies that are toxic (certain paints, glues)\n- Pest control products\n- Personal items containing alcohol or medication\n\n[callout-danger]If a child ingests a hazardous substance, call Poison Control immediately at 1-800-222-1222. Follow their instructions. Call 911 if the child loses consciousness, has difficulty breathing, or seizes. Do not induce vomiting unless directed by Poison Control.[/callout-danger]"},{"type":"content","title":"Outdoor Safety","body":"Outdoor play is essential for children's development, but it introduces additional hazards.\n\nBefore outdoor play:\n- Inspect the play area for hazards (broken glass, animal waste, standing water, damaged equipment, fire ants)\n- Verify the temperature is safe (heat index below 108 degrees F; wind chill above 13 degrees F per guidelines)\n- Ensure sunscreen is applied if children will be in direct sun for more than 15 minutes (with parent authorization)\n- Bring water for hydration\n\nDuring outdoor play:\n- Maintain required ratios\n- Position staff in zones to cover the entire area\n- Count children every 5 minutes\n- Monitor climbing equipment closely\n- Watch for children near the fence or gate\n\n[callout-warn]If the heat index exceeds 108 degrees F, outdoor play must be limited to 15 minutes or moved to a shaded area. Water must be available at all times.[/callout-warn]"},{"type":"content","title":"Building Security","body":"BHA's building security measures include:\n- Keypad entry at the main door (code provided to authorized staff and parents only)\n- Visitor log: Every visitor must sign in, show ID, and be escorted\n- Security cameras in common areas and exterior\n- Classroom doors that lock from the inside\n- Emergency exit doors with alarms\n\nYour responsibilities:\n- Never share the door code with anyone who is not authorized\n- Never prop open exterior doors\n- Always verify the identity of visitors\n- Report any broken locks, malfunctioning cameras, or security concerns to the director immediately\n\n[callout-warn]If you see an unfamiliar person inside the building without a visitor badge, approach them and ask if they need help. If they cannot explain why they are there, notify the director immediately.[/callout-warn]"},{"type":"selfcheck","title":"Quick Check","q":"You cannot find a child during a head count. How long do you search before calling 911?","opts":["2 minutes","5 minutes","10 minutes","15 minutes"],"ans":1,"explanation":"Five minutes is the maximum search time before calling 911. A missing child is always an emergency."},{"type":"content","title":"Missing Child Procedure","body":"A missing child is the most urgent emergency in child care.\n\nIf you cannot account for a child:\n1. Stay calm. Recount all children.\n2. Search your immediate area: bathroom, closets, under tables, quiet corners.\n3. Notify the director immediately.\n4. The director initiates a building-wide search. All available staff search assigned zones.\n5. Check all exits, parking lots, and the outdoor play area.\n6. If the child is not found within 5 minutes, call 911.\n7. Notify the parents.\n\n[callout-danger]A missing child is always an emergency, even if you think you know where they went. Five minutes is the maximum search time before calling 911. Do not wait longer because you think they will turn up.[/callout-danger]\n[flip=How long do you search before calling 911?]5 minutes maximum. A missing child is always an emergency. Do not wait longer because you think they will turn up.[/flip]"},{"type":"content","title":"CPR and First Aid Certification","body":"All BHA caregivers must maintain current CPR and First Aid certification. BHA offers in-house certification through our HSI-authorized training center.\n\nYour certification must include:\n- Adult CPR\n- Child CPR\n- Infant CPR\n- Choking response (adult, child, and infant)\n- AED use\n- Basic first aid\n\nCertification is valid for 2 years. BHA tracks your renewal date and will remind you when it is time to recertify.\n\n[callout-info]If your certification is expired or you have never been certified, notify the director immediately. We will help you find a class. You cannot be counted in ratio until your certification is current.[/callout-info]"},{"type":"content","title":"Preventing SIDS (Sudden Infant Death Syndrome)","body":"SIDS is the leading cause of death in infants between 1 month and 1 year. While the exact cause is unknown, the following practices significantly reduce the risk:\n\n1. Always place infants on their backs to sleep\n2. Use a firm, flat sleep surface\n3. Keep the crib free of soft objects, loose bedding, and bumper pads\n4. Keep the room at a comfortable temperature (68-72 degrees F). Avoid overheating.\n5. Offer a pacifier at nap time (do not force it, and do not reattach if it falls out)\n6. Do not use sleep positioners, wedges, or infant-specific chairs for sleeping\n\n[callout-info]If a parent provides a blanket, lovey, or stuffed animal for nap time, store it in the child's cubby. Explain the safe sleep policy warmly: 'We keep cribs clear at BHA to make sure every baby sleeps safely.'[/callout-info]"},{"type":"content","title":"Reporting Safety Concerns","body":"If you see something unsafe, say something. Report the following to the director immediately:\n\n- Broken or damaged equipment (indoors or outdoors)\n- Water leaks, standing water, or flooding\n- Broken windows, locks, or doors\n- Pest sightings (roaches, rodents, ants)\n- Temperature problems (too hot, too cold, no AC)\n- Missing or expired items in the first aid kit\n- Anything that makes you feel the building is not safe\n\n[callout-tip]Do not assume someone else has already reported it. If you see it, report it. It takes 30 seconds and could prevent an injury.[/callout-tip]"},{"type":"content","title":"Scenario: Emergency Response","body":"[scenario]You are in Classroom 2 (18-23 month toddlers) with 8 children and one floater or another staff member. The fire alarm goes off. One child is on the changing table mid-diaper change. Two children are asleep on cots.\n\nWhat do you do?\n\n1. Another staff member grabs the attendance clipboard and begins gathering the awake children near the door.\n2. You quickly and safely secure the child on the changing table (fasten their diaper, pick them up). Do not leave them on the table.\n3. Wake the sleeping children. Pick them up if needed.\n4. Exit through the posted evacuation route.\n5. Close the classroom door behind you.\n6. Proceed to the assembly point.\n7. Count children: 8 total. Compare to the roster.\n8. Report to the director: 'Classroom 2, all 8 children accounted for.'\n\nKey point: The changing table child and sleeping children create complexity, but the protocol does not change. Rescue, Alert, Contain, Evacuate. Every time.[/scenario]"},{"type": "scenario-branch", "title": "Interactive Scenario: Fire During Lunch", "scenarioId": "m5_fire"},{"type":"content","title":"Module 5 Summary","body":"Here is what you should take away from this module:\n\n[keypoint]Emergencies happen without warning. Your preparedness, not your panic, determines the outcome. Know the plan. Practice the plan. Trust the plan.[/keypoint]\n\n- Know R.A.C.E. for fire emergencies\n- Know the tornado safe room location and procedure\n- Know the lockdown protocol (lock, move, lights off, silence)\n- Medical emergencies: call 911 first, then begin first aid\n- Medication administration requires written consent, proper storage, and documentation\n- Illness exclusion: 100.4 F fever, vomiting, diarrhea, rash, pink eye, lice\n- Safe sleep: back to sleep, bare crib, no swaddling, checks every 15 minutes\n- Missing child: recount, search, call 911 within 5 minutes\n- Report all safety concerns immediately\n\nYou are now ready for the Module 5 quiz."}];
const M5_QUIZ=[{"q":"What does R.A.C.E. stand for in fire emergency response?","opts":["Run And Call Everyone","Rescue, Alert, Contain, Evacuate","Report, Assess, Control, Exit","React, Alarm, Close, Escape"],"ans":1},{"q":"Where is BHA's designated tornado safe room?","opts":["The gymnasium","The parking lot","The hallway between Classrooms 2 and 3 (no windows, interior walls)","The front lobby"],"ans":2},{"q":"During a lockdown, when should you open the classroom door?","opts":["When a parent knocks and identifies themselves","When another staff member asks you to","Only when the director or law enforcement gives the all-clear","After 15 minutes of silence"],"ans":2},{"q":"At what temperature must a child be excluded from care?","opts":["99.0 F","99.9 F","100.4 F","101.0 F"],"ans":2},{"q":"How long should you search for a missing child before calling 911?","opts":["2 minutes","5 minutes","10 minutes","15 minutes"],"ans":1},{"q":"What is the proper bleach-to-water ratio for general sanitizing?","opts":["1 teaspoon per gallon","1 tablespoon per gallon","1/4 cup per gallon","1/2 cup per gallon"],"ans":1},{"q":"Which statement about medication administration is correct?","opts":["Any staff member can administer medication in an emergency","Expired medication can be used if nothing else is available","Only designated and trained staff may administer medication with written consent","Verbal phone consent from a parent is sufficient"],"ans":2},{"q":"What number should you call if a child ingests a hazardous substance?","opts":["911 only","Poison Control at 1-800-222-1222","The child's pediatrician","The director's cell phone"],"ans":1}];
