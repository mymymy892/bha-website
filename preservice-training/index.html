// ======== Form content helpers ========
// Build a structured payload describing the form content so admin.html can
// re-render it with full visual formatting (logo, headings, bullets, etc.)
// matching what the staff member saw on screen.

// For agreement forms (the read-and-sign type), serialize the sections array
// directly. Admin reads this and reconstructs the on-screen layout.
function buildAgreementPayload(form){
  return JSON.stringify({
    kind: "agreement",
    title: form.title,
    icon: form.icon || "",
    tacRef: form.tacRef || "",
    sections: form.sections || []
  });
}

// For fillable forms, serialize the field structure plus the user's values
// so admin can re-render the form layout with values filled in.
function buildFillablePayload(form, values){
  return JSON.stringify({
    kind: "fillable",
    title: form.title,
    icon: form.icon || "",
    tacRef: form.tacRef || "",
    fields: form.fields || [],
    values: values || {}
  });
}

// Legacy plain-text flatteners kept for backward compatibility with older
// records in Jotform that did not capture structured payloads.
function flattenAgreementSections(sections){
  if(!sections||!sections.length)return "";
  var out = [];
  sections.forEach(function(s){
    if(s.heading)    out.push(s.heading.toUpperCase());
    if(s.subheading) out.push(s.subheading);
    if(s.intro)      out.push(s.intro);
    if(s.items&&s.items.length){
      s.items.forEach(function(it){ out.push("- " + it); });
    }
    out.push("");
  });
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

function formatFilledForm(fields, values){
  if(!fields||!fields.length)return "";
  var out = [];
  fields.forEach(function(section){
    if(section.section){
      out.push("");
      out.push("=== " + section.section.toUpperCase() + " ===");
    }
    if(section.rows){
      section.rows.forEach(function(row){
        row.forEach(function(field){
          if(field.label && field.name){
            var v = values && values[field.name];
            if(v==null||v==="") v = "(not provided)";
            out.push(field.label + ": " + v);
          }
        });
      });
    }
  });
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

// ======== Text Parser ========
// Helper: split a multi-paragraph text block into structured sub-parts
// (paragraphs, ordered lists, unordered lists). Used for scenario contents.
function parseInner(text){
  if(!text)return [];
  const out=[];
  const lines=text.split("\n");
  let buf=[];
  function flush(){if(buf.length){out.push({type:"p",text:buf.join(" ").trim()});buf=[]}}
  for(const ln of lines){
    if(ln.match(/^\d+\./)){flush();out.push({type:"oli",text:ln});continue}
    if(ln.startsWith("- ")){flush();out.push({type:"uli",text:ln.slice(2)});continue}
    if(ln.trim()===""){flush();continue}
    buf.push(ln);
  }
  flush();
  // Group consecutive list items
  const grouped=[];
  for(const p of out){
    if(p.type==="oli"||p.type==="uli"){
      const last=grouped[grouped.length-1];
      const listType=p.type+"_list";
      if(last&&last.type===listType){last.items.push(p.text.replace(/^\d+\.\s*/,"").replace(/^- /,""))}
      else{grouped.push({type:listType,items:[p.text.replace(/^\d+\.\s*/,"").replace(/^- /,"")]})}
    }else{grouped.push(p)}
  }
  return grouped;
}

function parseBody(text){
  if(!text)return null;
  // Use placeholder substitution for multi-line blocks so we can keep them intact
  // through line-by-line parsing without losing internal structure.
  const blocks=[];
  function stash(kind,payload){
    const id=blocks.length;
    blocks.push({kind:kind,payload:payload});
    return "\n@@BLOCK"+id+"@@\n";
  }
  // Scenarios: preserve full content for structured rendering
  text=text.replace(/\[scenario\]([\s\S]*?)\[\/scenario\]/g,function(m,c){
    return stash("scenario",c.trim());
  });
  // Callouts: preserve full content (may contain line breaks, lists)
  text=text.replace(/\[callout-(warn|danger|tip|info)\]([\s\S]*?)\[\/callout-\w+\]/g,function(m,t,c){
    return stash("callout:"+t,c.trim());
  });
  // Keypoints
  text=text.replace(/\[keypoint\]([\s\S]*?)\[\/keypoint\]/g,function(m,c){
    return stash("keypoint",c.trim());
  });
  // Accordions, flips, reveals: single-line constructs
  text=text.replace(/\[accordion=([^\]]+)\]([\s\S]*?)\[\/accordion\]/g,function(m,t,c){
    return stash("accordion",{title:t.trim(),text:c.trim()});
  });
  text=text.replace(/\[flip=([^\]]+)\]([\s\S]*?)\[\/flip\]/g,function(m,f,b){
    return stash("flip",{front:f.trim(),back:b.trim()});
  });
  text=text.replace(/\[reveal=([^\]]+)\]([\s\S]*?)\[\/reveal\]/g,function(m,l,c){
    return stash("reveal",{label:l.trim(),text:c.trim()});
  });

  // Now line-by-line parse remaining text
  const parts=[];
  const lines=text.split("\n");
  let buf=[];
  function flush(){if(buf.length){parts.push({type:"p",text:buf.join(" ").trim()});buf=[]}}
  for(const line of lines){
    const blockMatch=line.match(/^@@BLOCK(\d+)@@$/);
    if(blockMatch){
      flush();
      const b=blocks[parseInt(blockMatch[1],10)];
      if(b.kind==="scenario"){
        parts.push({type:"scenario",inner:parseInner(b.payload)});
      }else if(b.kind.indexOf("callout:")===0){
        parts.push({type:"callout",variant:b.kind.split(":")[1],inner:parseInner(b.payload)});
      }else if(b.kind==="keypoint"){
        parts.push({type:"keypoint",text:b.payload});
      }else if(b.kind==="accordion"){
        parts.push({type:"accordion",title:b.payload.title,inner:parseInner(b.payload.text)});
      }else if(b.kind==="flip"){
        parts.push({type:"flip",front:b.payload.front,back:b.payload.back});
      }else if(b.kind==="reveal"){
        parts.push({type:"reveal",label:b.payload.label,inner:parseInner(b.payload.text)});
      }
      continue;
    }
    if(line.match(/^\d+\./)){flush();parts.push({type:"oli",text:line});continue}
    if(line.startsWith("- ")){flush();parts.push({type:"uli",text:line.slice(2)});continue}
    if(line.trim()===""){flush();continue}
    buf.push(line);
  }
  flush();
  // Group consecutive list items at top level
  const grouped=[];
  for(const p of parts){
    if(p.type==="oli"||p.type==="uli"){
      const last=grouped[grouped.length-1];
      const listType=p.type+"_list";
      if(last&&last.type===listType){last.items.push(p.text.replace(/^\d+\.\s*/,"").replace(/^- /,""))}
      else{grouped.push({type:listType,items:[p.text.replace(/^\d+\.\s*/,"").replace(/^- /,"")]})}
    }else{grouped.push(p)}
  }
  return grouped;
}

// Render structured inner content (used inside scenarios, callouts, accordions, reveals)
function renderInner(inner){
  if(!inner||!inner.length)return null;
  return inner.map(function(p,i){
    if(p.type==="p")return React.createElement("p",{key:i,style:{marginBottom:8},dangerouslySetInnerHTML:{__html:bold(p.text)}});
    if(p.type==="oli_list")return React.createElement("ol",{key:i,style:{margin:"6px 0 8px 22px"}},p.items.map(function(it,j){return React.createElement("li",{key:j,style:{marginBottom:4},dangerouslySetInnerHTML:{__html:bold(it)}})}));
    if(p.type==="uli_list")return React.createElement("ul",{key:i,style:{margin:"6px 0 8px 22px"}},p.items.map(function(it,j){return React.createElement("li",{key:j,style:{marginBottom:4},dangerouslySetInnerHTML:{__html:bold(it)}})}));
    return null;
  });
}

function RenderBody({parts}){
  if(!parts)return null;
  return parts.map(function(p,i){
    if(p.type==="p")return React.createElement("p",{key:i,dangerouslySetInnerHTML:{__html:bold(p.text)}});
    if(p.type==="callout")return React.createElement("div",{key:i,className:"callout callout-"+p.variant},renderInner(p.inner));
    if(p.type==="scenario")return React.createElement("div",{key:i,className:"scenario-box"},renderInner(p.inner));
    if(p.type==="keypoint")return React.createElement("div",{key:i,className:"keypoint-box",dangerouslySetInnerHTML:{__html:bold(p.text)}});
    if(p.type==="accordion")return React.createElement(Accordion,{key:i,title:p.title},renderInner(p.inner));

    if(p.type==="oli_list")return React.createElement("ol",{key:i},p.items.map(function(it,j){return React.createElement("li",{key:j,dangerouslySetInnerHTML:{__html:bold(it)}})}));
    if(p.type==="uli_list")return React.createElement("ul",{key:i},p.items.map(function(it,j){return React.createElement("li",{key:j,dangerouslySetInnerHTML:{__html:bold(it)}})}));
    return null;
  });
}

// ======== Read Aloud (Natural female voice with quality preference) ========
//
// iOS Safari quirk: speechSynthesis.getVoices() returns an empty array on
// initial page load, then populates a few moments later (or after the first
// user gesture). If we pick a voice while the list is empty, we get the
// system default which on iOS is robotic. To avoid this:
//   1. We wait for voices to populate before speaking
//   2. We re-pick on every speak() call, never cache
//   3. We prioritize iOS-specific known-good voice names
//   4. We log voice lists in dev (useful if Tanya needs to debug)

// Module-level cache of voices, refreshed by onvoiceschanged
let _cachedVoices = [];
function refreshVoiceCache(){
  if(typeof window==="undefined"||!window.speechSynthesis)return;
  const v=window.speechSynthesis.getVoices();
  if(v&&v.length)_cachedVoices=v;
}

function pickBestVoice(){
  if(typeof window==="undefined"||!window.speechSynthesis)return null;
  // Always check fresh (in case voices loaded since cache)
  let voices=window.speechSynthesis.getVoices();
  if(!voices||!voices.length)voices=_cachedVoices;
  if(!voices||!voices.length)return null;

  // Tiered preferences. First match wins.
  const tieredPrefs=[
    // Tier 1: Apple Premium voices on iOS (these are the actually-good ones)
    // Apple labels enhanced voices with "(Enhanced)" or "Premium" in the name.
    [/samantha.*enhanced/i,/samantha.*premium/i,/ava.*enhanced/i,/ava.*premium/i,/allison.*enhanced/i,/allison.*premium/i,/susan.*enhanced/i,/zoe.*premium/i,/karen.*enhanced/i],
    // Tier 2: Premium neural voices on Chrome/Edge desktop and Android
    [/google\s*us\s*english/i,/google\s*uk\s*english\s*female/i,/microsoft\s*aria/i,/microsoft\s*jenny/i,/microsoft\s*sonia/i,/microsoft\s*natasha/i,/natural/i,/neural/i,/online.*female/i],
    // Tier 3: Apple/iOS standard female voices (decent quality)
    [/^samantha/i,/^karen/i,/^moira/i,/^tessa/i,/^serena/i,/^allison/i,/^ava/i,/^susan/i,/^victoria/i,/^fiona/i,/^zoe/i,/^nicky/i],
    // Tier 4: Microsoft/Windows female voices
    [/zira/i,/hazel/i,/eva/i,/heera/i,/catherine/i],
    // Tier 5: Other female voices
    [/jenny/i,/aria/i,/sara/i,/joanna/i,/salli/i,/kimberly/i,/kendra/i,/ivy/i,/female/i]
  ];

  function pickByLang(matches){
    return matches.find(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en-us")===0})
      ||matches.find(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0})
      ||matches[0];
  }

  for(let t=0;t<tieredPrefs.length;t++){
    const tier=tieredPrefs[t];
    const matches=voices.filter(function(v){return tier.some(function(re){return re.test(v.name)})});
    if(matches.length){
      const picked=pickByLang(matches);
      if(picked)return picked;
    }
  }

  // Last resort: any English voice that does NOT match obviously male names
  const maleNames=/^(male|david|james|mark|daniel|alex|fred|tom|george|paul|guy|ryan|brian|aaron|matthew|kevin|aaron|nathan|oliver)/i;
  const enFallback=voices.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0&&!maleNames.test(v.name)});
  if(enFallback.length)return pickByLang(enFallback);
  return voices.find(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0})||voices[0];
}

// Wait for voices to populate (iOS specifically). Returns a Promise.
function waitForVoices(maxWaitMs){
  maxWaitMs=maxWaitMs||1500;
  return new Promise(function(resolve){
    if(typeof window==="undefined"||!window.speechSynthesis){resolve([]);return}
    let voices=window.speechSynthesis.getVoices();
    if(voices&&voices.length){_cachedVoices=voices;resolve(voices);return}
    let resolved=false;
    function done(){
      if(resolved)return;
      resolved=true;
      const v=window.speechSynthesis.getVoices();
      if(v&&v.length)_cachedVoices=v;
      resolve(v||_cachedVoices||[]);
    }
    // Listen for the voices-changed event
    const onChange=function(){done()};
    window.speechSynthesis.addEventListener?
      window.speechSynthesis.addEventListener("voiceschanged",onChange):
      (window.speechSynthesis.onvoiceschanged=onChange);
    // Also poll because some browsers do not fire the event
    const start=Date.now();
    const poll=setInterval(function(){
      const v=window.speechSynthesis.getVoices();
      if((v&&v.length)||Date.now()-start>maxWaitMs){
        clearInterval(poll);
        done();
      }
    },100);
  });
}

function useReadAloud(){
  const [reading,setReading]=useState(false);
  const speak=useCallback(function(text){
    if(typeof window==="undefined"||!window.speechSynthesis)return;
    // Cancel any in-progress speech first
    try{window.speechSynthesis.cancel()}catch(e){}
    const plain=text.replace(/\[.*?\]/g,"").replace(/\*\*/g,"").replace(/<[^>]+>/g,"");
    if(!plain.trim())return;

    function actuallySpeak(){
      const u=new SpeechSynthesisUtterance(plain);
      // Natural, warm pacing for an inviting human-sounding voice
      u.rate=0.95;
      u.pitch=1.05;
      u.volume=1;
      const voice=pickBestVoice();
      if(voice){
        u.voice=voice;
        if(voice.lang)u.lang=voice.lang;
      }else{
        u.lang="en-US";
      }
      u.onend=function(){setReading(false)};
      u.onerror=function(){setReading(false)};
      setReading(true);
      try{window.speechSynthesis.speak(u)}catch(e){setReading(false)}
    }

    // If voices have not loaded yet (common on iOS first-load), wait briefly
    const voices=window.speechSynthesis.getVoices();
    if(!voices||!voices.length){
      waitForVoices(1200).then(actuallySpeak);
    }else{
      // Tiny delay helps mobile Safari/Chrome reliably play
      setTimeout(actuallySpeak,50);
    }
  },[]);
  const stop=useCallback(function(){
    if(typeof window!=="undefined"&&window.speechSynthesis){
      try{window.speechSynthesis.cancel()}catch(e){}
    }
    setReading(false);
  },[]);
  return{reading:reading,speak:speak,stop:stop};
}

// Preload voices (browsers populate the list asynchronously, especially iOS)
if(typeof window!=="undefined"&&window.speechSynthesis){
  refreshVoiceCache();
  if(window.speechSynthesis.addEventListener){
    window.speechSynthesis.addEventListener("voiceschanged",refreshVoiceCache);
  }else{
    window.speechSynthesis.onvoiceschanged=refreshVoiceCache;
  }
  // iOS sometimes needs a poke to start loading
  setTimeout(refreshVoiceCache,500);
  setTimeout(refreshVoiceCache,1500);
}

// ======== Touch Swipe Support ========
// Very strict swipe detection: requires deliberate horizontal motion, low
// vertical drift, and a tight time window. Accidental taps with tiny finger
// drift (especially on the Next button) must NOT be misread as swipes.
function useSwipe(onLeft, onRight) {
  const touchStart = useRef(null);
  const touchEnd = useRef(null);
  const touchStartY = useRef(null);
  const touchEndY = useRef(null);
  const touchStartTime = useRef(0);
  const MIN_SWIPE = 80;        // horizontal distance must exceed this
  const MAX_VERTICAL = 60;     // vertical drift must stay under this
  const MAX_DURATION = 600;    // gesture must complete within this many ms
  function onTouchStart(e) {
    touchEnd.current = null;
    touchEndY.current = null;
    touchStart.current = e.targetTouches[0].clientX;
    touchStartY.current = e.targetTouches[0].clientY;
    touchStartTime.current = Date.now();
  }
  function onTouchMove(e) {
    touchEnd.current = e.targetTouches[0].clientX;
    touchEndY.current = e.targetTouches[0].clientY;
  }
  function onTouchEnd() {
    if (touchStart.current == null || touchEnd.current == null) return;
    const dx = touchStart.current - touchEnd.current;
    const dy = Math.abs((touchEndY.current || 0) - (touchStartY.current || 0));
    const duration = Date.now() - touchStartTime.current;
    if (Math.abs(dx) < MIN_SWIPE) return;     // not enough horizontal motion
    if (dy > MAX_VERTICAL) return;            // too much vertical drift = not a swipe
    if (duration > MAX_DURATION) return;      // too slow = probably a drag/tap
    if (Math.abs(dx) < dy * 1.5) return;      // not horizontal-dominant
    if (dx > 0 && onLeft) onLeft();
    if (dx < 0 && onRight) onRight();
  }
  return { onTouchStart, onTouchMove, onTouchEnd };
}

// ======== Slide Viewer (with timer and self-checks) ========
function SlideViewer({mod,onBack}){
  const [idx,setIdx]=useState(()=>{const p=getProgress()[mod.id];return p?.lastSlide||0});
  const [showQuiz,setShowQuiz]=useState(false);
  const {reading,speak,stop}=useReadAloud();
  const [timerDone,setTimerDone]=useState(false);
  const [timerPct,setTimerPct]=useState(0);
  const timerRef=useRef(null);
  const slide=mod.slides[idx];
  const total=mod.slides.length;
  const contentSlides=mod.slides.filter(s=>s.type!=="selfcheck").length;

  // Timer logic - reset on slide change
  useEffect(()=>{
    if(slide.type==="selfcheck"||slide.type==="title"||slide.type==="scenario-branch"){setTimerDone(true);setTimerPct(100);return}
    setTimerDone(false);setTimerPct(0);
    const start=Date.now();
    const dur=SLIDE_MIN_SECONDS*1000;
    const tick=()=>{
      const elapsed=Date.now()-start;
      const pct=Math.min(100,elapsed/dur*100);
      setTimerPct(pct);
      if(elapsed>=dur){setTimerDone(true)}
      else{timerRef.current=requestAnimationFrame(tick)}
    };
    timerRef.current=requestAnimationFrame(tick);
    return()=>{if(timerRef.current)cancelAnimationFrame(timerRef.current)};
  },[idx]);

  useEffect(()=>{
    setProgress(mod.id,{lastSlide:idx,slidesSeen:Math.max(idx+1,getProgress()[mod.id]?.slidesSeen||0)});
    // Auto-play read aloud on each content slide
    const s=mod.slides[idx];
    if(s&&s.type==="content"&&s.body){
      const timer=setTimeout(()=>speak(s.body||""),500);
      return()=>clearTimeout(timer);
    }
  },[idx]);

  // Stop speech when this component unmounts (user clicks "All Modules",
  // navigates back, or otherwise leaves the slide viewer). Without this,
  // the female voice keeps narrating the previous slide on the new screen.
  useEffect(function(){
    return function(){
      if(typeof window!=="undefined"&&window.speechSynthesis){
        try{window.speechSynthesis.cancel()}catch(e){}
      }
    };
  },[]);

  // Wrap onBack so it always stops speech first
  const handleBack=function(){
    if(typeof window!=="undefined"&&window.speechSynthesis){
      try{window.speechSynthesis.cancel()}catch(e){}
    }
    if(onBack)onBack();
  };

  const swipeHandlers = useSwipe(
    function(){ if(timerDone && idx < total-1){stop();setIdx(idx+1)} },
    function(){ if(idx > 0){stop();setIdx(idx-1)} }
  );
  if(showQuiz)return React.createElement(QuizView,{mod,onBack:handleBack});

  // Self-check slide
  if(slide.type==="selfcheck"){
    return React.createElement("div",{className:"sv-wrap"},
      React.createElement("div",{className:"sv-breadcrumb no-print",onClick:handleBack},"\u2190 Back to Modules"),
      React.createElement("div",{className:"sv-progress"},React.createElement("div",{className:"sv-prog-fill",style:{width:((idx+1)/total*100)+"%"}})),
      React.createElement("div",{className:"sv-read no-print"},
        React.createElement("span",{className:"sv-counter"},"Item "+(idx+1)+" of "+total)),
      React.createElement(SelfCheck,{slide:slide,onContinue:()=>{stop();if(idx===total-1)setShowQuiz(true);else setIdx(idx+1)}})
    );
  }

  const parsedBody=slide.body?parseBody(slide.body):null;
  const plainText=slide.body||slide.sub||"";

  return React.createElement("div",{className:"sv-wrap"},
    React.createElement("div",{className:"sv-breadcrumb no-print",onClick:handleBack},"\u2190 Back to Modules"),
    React.createElement("div",{className:"sv-progress"},React.createElement("div",{className:"sv-prog-fill",style:{width:((idx+1)/total*100)+"%"}})),
    !timerDone&&slide.type!=="title"&&React.createElement("div",null,
      React.createElement("div",{className:"sv-timer-label"},"Please read this slide ("+(SLIDE_MIN_SECONDS - Math.floor(timerPct/100*SLIDE_MIN_SECONDS))+"s remaining)"),
      React.createElement("div",{className:"sv-timer"},React.createElement("div",{className:"sv-timer-fill",style:{width:timerPct+"%"}}))),
    React.createElement("div",{className:"sv-read no-print"},
      React.createElement("button",{className:"sv-read-btn"+(reading?" active":""),onClick:()=>reading?stop():speak(plainText)},reading?"\u23f9 Stop":"\ud83d\udd0a Read Aloud"),
      React.createElement("span",{className:"sv-counter"},"Slide "+(idx+1)+" of "+total)
    ),
    React.createElement("div",Object.assign({className:"sv-card"},swipeHandlers),
      slide.type==="scenario-branch"?
        React.createElement("div",{style:{padding:"8px 0"}},
          React.createElement(ScenarioBranch,{data:SCENARIO_BRANCHES[slide.scenarioId]})
        ):
      slide.type==="title"?
        React.createElement("div",{className:"sv-title-slide"},
          React.createElement("img",{src:LOGO,style:{height:64,margin:"0 auto 16px",display:"block"}}),
          React.createElement("h2",null,slide.title),
          React.createElement("p",null,slide.sub)
        ):
        React.createElement("div",{className:"sv-content"},
          React.createElement("h3",null,slide.title),
          React.createElement("div",{className:"sv-body"},React.createElement(RenderBody,{parts:parsedBody}))
        )
    ),
    React.createElement("div",{className:"sv-nav no-print"},
      React.createElement("button",{className:"sv-nav-btn",disabled:idx===0,onClick:()=>{stop();setIdx(idx-1)}},"\u2190 Previous"),
      idx===total-1?
        React.createElement("button",{className:"sv-nav-btn gold",onClick:()=>setShowQuiz(true)},"Take Quiz \u2192"):
        React.createElement("button",{className:"sv-nav-btn",disabled:!timerDone,onClick:()=>{stop();setIdx(idx+1)}},timerDone?"Next \u2192":"Please wait...")
    )
  );
}

        "I will not make jokes, comments, or gestures of a sexual, racial, ethnic, religious, or otherwise discriminatory nature.",
        "I will speak about children, families, and coworkers with the same care and professionalism whether they are present or not.",
        "I will follow the chain of command and address concerns through appropriate channels."
      ]},
      {subheading: "INTERACTIONS WITH CHILDREN", items: [
        "I will use only the approved guidance techniques described in BHA's Discipline and Guidance Policy.",
        "I will never strike, push, grab, shake, restrain, or use any form of physical force as discipline.",
        "I will not yell, scream, threaten, shame, or use profanity around children.",
        "I will not make derogatory comments about a child's family, behavior, body, or development within their hearing.",
        "I will maintain professional physical contact only: brief hugs, holding a child who needs comfort, hand-holding for safety, diapering and toileting assistance, and routine caregiving. I will not engage in tickling, lap-sitting beyond brief comfort, or any contact that could be misinterpreted.",
        "I will never be alone with a single child in a closed room. I will keep classroom doors open or follow the line-of-sight rule at all times.",
        "I will never transport a child in a personal vehicle, take a child to my home, or take a child off-property except as part of an approved BHA activity.",
        "I will not communicate with children outside of BHA programming, including by text, social media, phone, or in-person contact, unless they are my own family member."
      ]},
      {subheading: "INTERACTIONS WITH FAMILIES", items: [
        "I will greet families warmly at arrival and departure, communicate clearly through Brightwheel and in person, and follow BHA's established communication channels.",
        "I will never accept gifts, money, loans, or favors from families that could create a conflict of interest. Small holiday or birthday tokens are acceptable.",
        "I will not engage in personal financial transactions with families (selling items, soliciting business, asking for child care outside BHA).",
        "I will not babysit BHA children outside of work hours unless approved in advance by the Executive Director, and only when a written waiver acknowledging that BHA bears no liability for outside care is on file.",
        "I will never form a relationship with a parent or guardian (romantic, financial, or otherwise) that compromises my ability to provide impartial care to their child."
      ]},
      {subheading: "INTERACTIONS WITH COWORKERS", items: [
        "I will support my coworkers, share workload fairly, communicate respectfully, and resolve conflicts directly and privately.",
        "I will not gossip, spread rumors, or speak negatively about coworkers to other staff, parents, or children.",
        "I will follow the chain of command. If I have a concern about a coworker, I will speak with them directly first; if unresolved, I will bring it to my immediate supervisor.",
        "I will not date, pursue romantic relationships with, or engage in sexual conduct with subordinates I directly supervise.",
        "I will not bring personal disputes, drama, or unrelated grievances into the workplace."
      ]},
      {subheading: "PROFESSIONAL APPEARANCE AND DEMEANOR", items: [
        "I will follow BHA's Dress Code at all times, presenting a clean, professional appearance.",
        "I will arrive on time, prepared to work, and remain attentive throughout my shift.",
        "I will not work under the influence of alcohol, illegal drugs, marijuana, or any substance that impairs my judgment, reflexes, or ability to supervise children safely.",
        "I will not bring alcohol, tobacco products, vapes, or recreational drugs onto BHA property.",
        "I will not use profanity, vulgar language, or discuss inappropriate topics within hearing of children, families, or coworkers."
      ]},
      {subheading: "USE OF BHA PROPERTY AND TIME", items: [
        "I will use BHA property, supplies, devices, and equipment only for BHA business.",
        "I will not use BHA's name, logo, or representation for personal gain, side businesses, or unauthorized fundraising.",
        "I will not conduct personal business, side jobs, or non-BHA work during paid work hours.",
        "I will accurately record my own work hours and not record hours for any other employee."
      ]},
      {subheading: "REPORTING OBLIGATIONS", intro: "Every BHA employee shares responsibility for protecting the integrity of the center and the safety of the children we serve. I will:", items: [
        "Report any suspected child abuse or neglect to DFPS (1-800-252-5400) as required by Texas law as a mandatory reporter.",
        "Report any violation of this Code of Conduct by myself or any coworker to the Primary Director or Executive Director.",
        "Cooperate fully with any internal investigation, licensing investigation, or law enforcement inquiry.",
        "Understand that retaliation against any person who reports a concern in good faith is itself a violation of this Code and grounds for termination."
      ]},
      {subheading: "CONSEQUENCES", intro: "Violations of this Code of Conduct will result in corrective action up to and including immediate termination of employment. Some violations (such as child abuse, falsification of records, theft, intoxication on duty, or sexual misconduct) will result in immediate termination and may also result in licensing reports, denial of future employment in regulated child care, and criminal prosecution."},
      {intro: "I have read and understand the BHA Code of Conduct in its entirety. I commit to upholding these standards in every interaction at Benevolent House Academy. I understand that violations will result in corrective action up to and including termination. I understand that my conduct reflects on the children, families, and reputation of BHA."}
    ]
  },
  {
    id: "discipline",
    title: "Discipline and Guidance Policy Acknowledgment",
    icon: "\u2764\ufe0f",
    desc: "Read and sign the Discipline and Guidance Policy. Full policy with philosophy, all 9 approved techniques, all 9 prohibited methods, and reporting obligations.",
    tag: "Signature Required",
    tagClass: "sign",
    tacRef: "TAC 746.901(8)",
    sections: [
      {heading: "DISCIPLINE AND GUIDANCE POLICY AND ACKNOWLEDGMENT", subheading: "Read the Entire Policy Below, Then Sign at the Bottom | TAC 746.901(8)"},
      {subheading: "PHILOSOPHY", intro: "Benevolent House Academy uses a trauma-informed, relationship-based approach to child guidance. We believe that behavior is communication. When a child engages in challenging behavior, our first response is to ask: \"What is this child trying to tell us?\" and \"What does this child need?\" We respond with empathy, consistency, and respect for the child's dignity at all times."},
      {subheading: "APPROVED GUIDANCE TECHNIQUES", intro: "The following are the ONLY guidance techniques approved for use at Benevolent House Academy:", items: [
        "Positive reinforcement and encouragement: acknowledging and praising appropriate behavior and effort.",
        "Redirection: calmly guiding a child from an inappropriate activity to an appropriate one.",
        "Offering age-appropriate choices: giving children a sense of control by offering two acceptable options (for example, \"Would you like to use the red crayon or the blue crayon?\").",
        "Setting clear, consistent limits: stating expectations in positive terms (\"Walk, please\" instead of \"Don't run\").",
        "Natural and logical consequences: allowing children to experience the natural result of their choices when safe to do so (for example, if a child refuses to wear a jacket, they may feel cold outside for a brief time).",
        "Modeling appropriate behavior: demonstrating the behavior you want to see. Children learn more from what you do than what you say.",
        "Emotion coaching: helping children identify, name, and manage their feelings using the four-step process: notice the emotion, name it, validate it, and help the child cope.",
        "Co-regulation: a caregiver remaining calm and present to help a dysregulated child return to a state of calm. Your calm is contagious.",
        "Brief supervised separation: removing a child from a situation for a short period to help them calm down. The maximum duration is 1 minute per year of the child's age (for example, 3 minutes for a 3-year-old). The child must remain within sight and hearing of a caregiver at all times during separation."
      ]},
      {subheading: "PROHIBITED METHODS", intro: "The following methods are STRICTLY PROHIBITED at Benevolent House Academy. Use of any prohibited method will result in immediate corrective action, up to and including termination of employment:", items: [
        "Corporal punishment of any kind, including but not limited to: spanking, hitting, slapping, pinching, shaking, biting, pulling hair, grabbing, or any other form of physical punishment or physical force used as discipline.",
        "Verbal abuse, including but not limited to: yelling, screaming, threatening, intimidating, humiliating, shaming, using profanity, making derogatory or belittling remarks, name-calling, or using sarcasm directed at a child.",
        "Punishment associated with food: withholding meals or snacks as a consequence, forcing a child to eat, or using food as a reward for behavior.",
        "Punishment associated with rest or sleep: forcing a child to stay on their cot as punishment, waking a child as punishment, or denying rest.",
        "Punishment associated with toileting: shaming a child for toileting accidents, forcing a child to sit on the toilet, or denying access to the restroom.",
        "Placing a child in a dark room, closet, locked room, or any confined space.",
        "Requiring physical exercise as punishment (push-ups, running laps, standing in a corner for extended periods).",
        "Comparing children to each other in a negative way (\"Why can't you be good like Sarah?\").",
        "Any other form of discipline that is frightening, humiliating, or demeaning to a child."
      ]},
      {subheading: "REPORTING OBLIGATION", intro: "If you witness another employee using a prohibited discipline method, you are required to report it to the Primary Director (Haddie Mashburn) or the Executive Director (Tanya Orr) immediately. Failure to report a known violation is itself a violation of this policy. If the prohibited method rises to the level of child abuse, you are also required to report it to DFPS (1-800-252-5400) as a mandatory reporter."},
      {intro: "I have read and understand the entire Discipline and Guidance Policy above. I agree to use only approved guidance techniques. I understand that use of any prohibited method will result in immediate corrective action, up to and including termination. I understand my obligation to report violations by other employees."}
    ]
  },
  {
    id: "cell_phone",
    title: "Cell Phone Policy Acknowledgment",
    icon: "\ud83d\udcf1",
    desc: "Read and sign the Cell Phone Policy. Personal phone storage, no photos of children on personal devices, Brightwheel-only documentation, and consequences of violations.",
    tag: "Signature Required",
    tagClass: "sign",
    tacRef: "TAC 746.901(8)",
    sections: [
      {heading: "CELL PHONE POLICY", subheading: "Read the Entire Policy Below, Then Sign at the Bottom | TAC 746.901(8)"},
      {subheading: "PURPOSE", intro: "Active supervision is the most important responsibility of every BHA employee. A staff member looking at a phone is not actively supervising. Personal phones also create privacy risks for children and families. This policy establishes how phones are handled at BHA so that supervision and privacy remain protected at all times."},
      {subheading: "PERSONAL CELL PHONE USE DURING WORK HOURS", items: [
        "Personal cell phones are not permitted in any classroom, on the playground, in the kitchen during food preparation, or anywhere children are present.",
        "Personal phones must be stored in the staff lockers, the office, or another designated secure location during all working hours.",
        "Personal phones may only be used during scheduled breaks, in the staff break area or outside the building, and only when no children are present.",
        "If you are expecting an emergency call (medical, family emergency), notify the Primary Director or designee at the start of your shift. The director will hold your phone and bring it to you immediately if a call comes in.",
        "Calls to and from family members during the workday should be routed through the BHA office line at (469) 807-1221.",
        "Texting, social media use, gaming, streaming, and personal browsing on any device are prohibited during work hours."
      ]},
      {subheading: "PHOTOS AND VIDEO OF CHILDREN", intro: "All photos, videos, and digital documentation of children at BHA must be taken exclusively through the Brightwheel app on a BHA-issued device.", items: [
        "I will not photograph or video record any child at BHA on my personal cell phone, personal tablet, personal camera, or any other personal device under any circumstance.",
        "I will not screenshot, save, forward, or download any photo or video of a BHA child from Brightwheel onto my personal device.",
        "I will not post, share, repost, or message any photo, video, or identifying information about a BHA child or family on any social media platform, including Facebook, Instagram, TikTok, Snapchat, X (formerly Twitter), YouTube, Threads, or any other platform.",
        "This rule applies even if I blur faces, do not include names, or believe the post is private. The fact that a child attends BHA is itself confidential.",
        "This rule applies even outside of work hours. Once a child is enrolled at BHA, I do not photograph that child or post about them, ever."
      ]},
      {subheading: "BHA-ISSUED DEVICES", items: [
        "BHA tablets and devices are for BHA use only. They are not to be taken home, used for personal browsing, or used for personal communication.",
        "BHA-issued devices remain on BHA property at all times unless approved in advance by the Executive Director (for example, for an off-site activity).",
        "Photos and videos taken on BHA devices are the property of BHA and the families of the children pictured. They may only be used through Brightwheel for the families authorized to view them."
      ]},
      {subheading: "EMERGENCY EXCEPTIONS", intro: "Personal phones may be used during work hours only in the following limited situations:", items: [
        "To call 911 in a true emergency.",
        "To call BHA leadership when no other phone is accessible (for example, during an off-site emergency).",
        "When directed by the Executive Director or Primary Director for a specific work-related task."
      ]},
      {subheading: "VIOLATIONS AND CONSEQUENCES", intro: "Violations of this Cell Phone Policy will result in:", items: [
        "First violation: verbal warning and documented coaching with the Primary Director.",
        "Second violation: written warning placed in the employee's personnel file.",
        "Third violation: termination of employment.",
        "Posting any photo, video, or identifying information about a BHA child on social media is grounds for IMMEDIATE termination on the first occurrence and will be reported to licensing.",
        "Photographing a child on a personal device is grounds for IMMEDIATE termination on the first occurrence and will be reported to licensing as a child privacy and supervision violation."
      ]},
      {intro: "I have read and understand the BHA Cell Phone Policy in its entirety. I will store my personal phone in the designated location during work hours. I will use only Brightwheel through a BHA-issued device for any photo or video of children. I understand that violations of this policy will result in disciplinary action up to and including immediate termination and a licensing report."}
    ]
  },
  {
    id: "emergency",
    title: "Emergency Procedures Acknowledgment",
    icon: "\ud83d\udea8",
    desc: "Read and sign the Emergency Procedures Policy. Full policy covering fire, severe weather, lockdown, medical emergencies, safe sleep, transportation, and more.",
    tag: "Signature Required",
    tagClass: "sign",
    tacRef: "TAC 746.901(9)",
    sections: [
      {heading: "EMERGENCY PROCEDURES POLICY AND ACKNOWLEDGMENT", subheading: "Read the Entire Policy Below, Then Sign at the Bottom | TAC 746.901(9)"},
      {subheading: "PURPOSE", intro: "Benevolent House Academy maintains a comprehensive Emergency Preparedness and Drill Practices Plan in compliance with TAC 746.5201 through 746.5207. This document summarizes the key procedures. The full Emergency Preparedness Plan is available at the center for your review at any time."},
      {subheading: "FIRE AND EVACUATION", intro: "When you hear the fire alarm, smell smoke, or are directed to evacuate: take your classroom roster and lead children out of the building using the posted evacuation route. If the primary route is blocked, use the alternate route. Infants are transported in evacuation cribs or carried (one infant per arm maximum; two caregivers for the nursery). Proceed to the outdoor assembly point: the front parking lot, away from the building, driveways, and fire lanes. Conduct a head count by name using your roster. Report your count to the Primary Director. Do NOT re-enter the building for any reason until cleared by the fire department. Fire drills are conducted monthly and documented."},
      {subheading: "FIRE EXTINGUISHERS AND FIRST AID", intro: "Fire extinguishers are mounted in the kitchen, the main hallway, and near each classroom exit. Use the PASS method: Pull the pin, Aim at the base of the fire, Squeeze the handle, Sweep side to side. Only attempt to extinguish a fire if it is small, contained, and you have a clear exit behind you. If in doubt, evacuate. First aid kits are located in the front office, each classroom, the kitchen, and the outdoor play area. Know where they are."},
      {subheading: "SEVERE WEATHER (TORNADO/STORM)", intro: "Move children to the interior hallway and interior rooms away from exterior windows. Have children sit on the floor, cover their heads. Take your classroom roster and conduct a head count. Remain in the shelter area until the all-clear is given. Severe weather drills are conducted quarterly."},
      {subheading: "LOCKDOWN", intro: "If there is a threat on or near the premises: secure all exterior doors, lock your classroom door, turn off lights, move children away from windows and doors, have children sit on the floor against an interior wall, verify your head count, call 911 if not already done, remain silent and in lockdown until cleared by law enforcement. Lockdown drills are conducted quarterly."},
      {subheading: "MEDICAL EMERGENCIES", intro: "Administer first aid as needed. Call 911 for life-threatening situations. Do not move a child if a spinal injury is suspected. Notify parents immediately. Complete a written incident report for every injury and illness."},
      {subheading: "RELOCATION", intro: "If the building cannot be reoccupied after an evacuation, all children and staff will relocate to Oaks Church, 777 S I-35E, Red Oak, TX 75154. During after-hours (6:00 PM to 6:00 AM), if Oaks Church is not accessible, children and staff will relocate to Red Oak Fire Department, 111 Live Oak Street, Red Oak, TX 75154. Parents are notified immediately of the relocation address through Brightwheel and phone calls."},
      {subheading: "MEDICATION ADMINISTRATION (TAC 746.3803)", intro: "Medication is administered only with written parental authorization and only as directed on the label or by a physician. Verify the five rights before every dose: right child, right medication, right dosage, right time, right route. Log every dose administered. Store medication in the original labeled container with the child's name."},
      {subheading: "ALLERGIES AND ALLERGIC REACTIONS", intro: "Food allergies are documented at enrollment and posted in the kitchen (first name only). Verify the allergy list before every meal and snack. Signs of anaphylaxis: hives, swelling (especially face/throat), difficulty breathing, vomiting, dizziness. If a child shows signs of severe allergic reaction: call 911 immediately, administer the child's EpiPen if on file and you are trained, lay the child flat, keep them calm."},
      {subheading: "BUILDING SAFETY AND HAZARDOUS MATERIALS", intro: "Electrical outlets in areas accessible to children have safety covers. Children are escorted by a caregiver in the parking area and never walk unattended in the parking lot. All cleaning products, chemicals, and hazardous materials are stored in a locked cabinet out of children's reach per TAC 746.3425. Use gloves when handling chemicals. Follow label instructions. Never mix chemicals."},
      {subheading: "SAFE SLEEP (INFANTS)", intro: "All infants are placed on their back to sleep, every time. Bare cribs only: firm mattress with fitted sheet, no blankets, pillows, bumper pads, stuffed animals, or loose items. Infants are never left to sleep in swings, bouncers, or car seats. Check on sleeping infants visually at least every 15 minutes."},
      {subheading: "TRANSPORTATION PRECAUTIONS", intro: "All children must be secured in age-appropriate safety restraints. Head counts are conducted before departure and upon arrival. After all children exit the vehicle, the driver visually checks the entire vehicle interior (under seats, behind seats, in the back) every time. No child is ever left unattended in a vehicle. These precautions apply to all children, with special attention to children whose chronological or developmental age is younger than nine years."},
      {intro: "I have read and understand the entire Emergency Procedures Policy above. I confirm that I have been shown the evacuation routes, shelter areas, fire extinguisher locations, first aid kit locations, and relocation sites. I understand my role and responsibilities during any emergency."}
    ]
  },
  {
    id: "safe_sleep",
    title: "Safe Sleep Acknowledgment",
    icon: "\ud83d\udecf\ufe0f",
    desc: "Read and sign the Safe Sleep Policy. ABC's of safe sleep, infant supervision requirements, prohibited items in cribs, and immediate response protocols.",
    tag: "Signature Required",
    tagClass: "sign",
    tacRef: "TAC 746.2427",
    sections: [
      {heading: "SAFE SLEEP POLICY ACKNOWLEDGMENT", subheading: "Read the Entire Policy Below, Then Sign at the Bottom | TAC 746.2427"},
      {subheading: "PURPOSE", intro: "Sudden Unexpected Infant Death (SUID), including Sudden Infant Death Syndrome (SIDS), is one of the leading causes of death for infants under one year of age. Following safe sleep practices reduces the risk dramatically. Texas Administrative Code 746.2427 requires every staff member who works with children under 12 months to be trained on and to follow safe sleep practices. This policy describes the practices every BHA employee will follow, every nap, every time, without exception."},
      {subheading: "THE ABC'S OF SAFE SLEEP", intro: "Every infant under 12 months of age sleeps:", items: [
        "ALONE - One infant per crib. No other infants, children, adults, pillows, blankets, stuffed animals, bumpers, positioners, wedges, or any other items in the crib with the baby.",
        "On their BACK - Always place infants on their back to sleep, for naps and night sleep. If an infant rolls to their stomach on their own after being placed on their back, they may remain in the position they choose, but they must be initially placed on their back every time.",
        "In a CRIB - A safety-approved crib with a firm, tight-fitting mattress and a fitted sheet only. No bassinets, swings, car seats, bouncers, couches, adult beds, or floor mats are acceptable for sleep."
      ]},
      {subheading: "REQUIRED INFANT SUPERVISION DURING SLEEP", items: [
        "An assigned caregiver must be in the sleep room with infants at all times. Infants are never left unsupervised.",
        "The caregiver must be able to see every infant's face, head, and breathing without obstruction.",
        "The caregiver will conduct visual checks of every infant at least every 15 minutes, observing for skin color, breathing, position, and signs of distress.",
        "Lights in the sleep room must be sufficient to clearly observe each infant's color and breathing. Total darkness is not permitted during sleep periods.",
        "The caregiver will not engage in activities that distract from supervision, including but not limited to: using a personal phone, reading, watching media, sleeping, or leaving the room."
      ]},
      {subheading: "ITEMS PROHIBITED IN INFANT CRIBS", intro: "The following items are NEVER permitted in a crib with a sleeping infant. Their presence creates suffocation, strangulation, and SUID risks:", items: [
        "Pillows, cushions, sleep positioners, wedges, or any soft sleep surfaces.",
        "Blankets, comforters, quilts, or loose bedding of any kind. Use a sleep sack or wearable blanket if additional warmth is needed.",
        "Bumper pads (mesh, padded, vertical, or any kind).",
        "Stuffed animals, toys, mobiles, or decorative items.",
        "Pacifier clips, attached strings, or any cord, ribbon, or tie.",
        "Hats, hooded clothing, bibs, or any item that could cover the face.",
        "Other infants or children. One infant per crib, every time."
      ]},
      {subheading: "PROHIBITED SLEEP PRACTICES", items: [
        "Placing an infant to sleep on their stomach or side. Always place on the back.",
        "Allowing an infant to sleep in a swing, bouncer, car seat, stroller, infant carrier, or any seated device. If an infant falls asleep in such a device, transfer them to a crib promptly.",
        "Allowing an infant to sleep on a couch, adult bed, mat on the floor, or any soft or unsafe surface.",
        "Co-sleeping with an infant or allowing two children to share a crib.",
        "Covering an infant's face, head, or stroller with a blanket, cloth, or sunshade that creates a closed environment.",
        "Holding an infant who has fallen asleep for the entire nap rather than transferring to a crib (occasional brief comfort holding for a child transitioning to sleep is acceptable, but the child must be transferred to a crib once asleep).",
        "Swaddling infants who are old enough to roll (typically 8 weeks or showing signs of rolling). Once rolling begins, swaddling is prohibited."
      ]},
      {subheading: "IMMEDIATE RESPONSE PROTOCOL", intro: "If you discover an infant who is unresponsive, not breathing, blue or gray in color, or otherwise in distress:", items: [
        "Call 911 immediately. Do not delay to call leadership first.",
        "Begin infant CPR if you are trained and the infant is not breathing.",
        "Send another staff member to alert the Primary Director and to retrieve the emergency bag and first aid kit.",
        "Do not move the infant from the crib unless beginning CPR.",
        "Document the time of last visual check, the time of discovery, and every action taken from the moment of discovery forward.",
        "Notify the parent immediately after 911 has been called and emergency response is in motion.",
        "Notify DFPS Licensing within the required reporting timeframe (CCL is notified of any serious incident or death of a child in care)."
      ]},
      {subheading: "TRAINING AND ANNUAL REVIEW", intro: "Every BHA employee who works with infants under 12 months will complete safe sleep training before their first shift caring for infants. This training will be repeated annually. New research and updated guidelines will be incorporated into the policy and re-acknowledged by all staff."},
      {intro: "I have read and understand the BHA Safe Sleep Policy in its entirety. I commit to following the ABC's of safe sleep (Alone, on the Back, in a Crib) on every nap, every infant, every time. I understand the items prohibited in cribs and the practices prohibited at BHA. I understand my supervision obligations during infant sleep periods. I understand the immediate response protocol if an infant is found in distress. I understand that violations of this policy may result in immediate termination and a licensing report."}
    ]
  },
  {
    id: "transportation",
    title: "Transportation Policy Acknowledgment",
    icon: "\ud83d\ude90",
    desc: "Read and sign the Transportation Policy. When transportation is permitted, vehicle and driver requirements, child safety restraints, and prohibited transportation practices.",
    tag: "Signature Required",
    tagClass: "sign",
    tacRef: "TAC 746 Subchapter R",
    sections: [
      {heading: "TRANSPORTATION POLICY ACKNOWLEDGMENT", subheading: "Read the Entire Policy Below, Then Sign at the Bottom | TAC 746 Subchapter R"},
      {subheading: "PURPOSE", intro: "Benevolent House Academy does not routinely transport children in BHA vehicles. However, certain situations may require transportation, including approved field trips, medical emergencies, or emergency relocation. This policy establishes the strict requirements that apply any time a BHA employee transports a child in care, ensuring the safety of every child every time."},
      {subheading: "ROUTINE TRANSPORTATION", intro: "BHA does not provide routine pick-up or drop-off transportation. Parents and guardians are responsible for transporting their child to and from BHA. Children may not leave BHA property in a BHA vehicle for routine reasons."},
      {subheading: "AUTHORIZED TRANSPORTATION SITUATIONS", intro: "Children may be transported by a BHA employee only in the following limited circumstances:", items: [
        "Approved field trips with prior written parental consent for each individual trip.",
        "Medical emergencies when 911 has been called and emergency medical services are en route or have arrived. In a true medical emergency, BHA may transport only at the direction of EMS.",
        "Emergency evacuation due to fire, severe weather, hazardous material release, or other immediate life-safety threat to BHA property, when sheltering in place is not safe.",
        "Pre-arranged transportation that has been individually authorized in writing by the Executive Director and the parent."
      ]},
      {subheading: "STAFF AUTHORIZED TO TRANSPORT", intro: "Only employees who meet ALL of the following may transport children:", items: [
        "Possess a valid Texas driver license with a clean driving record on file at BHA.",
        "Are listed on BHA's auto insurance or have provided proof of personal auto insurance with adequate liability coverage.",
        "Have completed BHA's transportation training and signed this acknowledgment.",
        "Are at least 21 years of age.",
        "Have been individually approved by the Executive Director to transport children."
      ]},
      {subheading: "VEHICLE REQUIREMENTS", items: [
        "All vehicles used to transport BHA children must be in good working order, currently registered, and currently inspected.",
        "All vehicles must carry valid liability insurance with minimum coverage that meets or exceeds Texas state requirements.",
        "All vehicles must contain a fully stocked first aid kit, a charged cell phone or two-way radio, and emergency contact information for every child being transported.",
        "All vehicles must contain a working seat belt for every passenger and a child safety restraint appropriate for each child's age, weight, and height.",
        "Vehicle interiors must be clean, free of hazards, and at a comfortable temperature before transporting children."
      ]},
      {subheading: "CHILD SAFETY RESTRAINTS", intro: "Texas law requires the following restraints, and BHA strictly enforces them:", items: [
        "Children under 2 years and under 30 pounds: rear-facing car seat.",
        "Children 2 years to 4 years OR under 40 pounds: forward-facing car seat with five-point harness.",
        "Children 4 years to 8 years OR under 4 feet 9 inches tall: booster seat with the vehicle's seat belt.",
        "Children 8 years and older AND at least 4 feet 9 inches tall: vehicle seat belt only.",
        "No child may ride in the front seat of a vehicle equipped with passenger-side airbags.",
        "Every child must be properly restrained before the vehicle moves, and must remain restrained until the vehicle has stopped at the destination."
      ]},
      {subheading: "RATIO AND SUPERVISION DURING TRANSPORTATION", items: [
        "Required staff-to-child ratios apply during transportation just as they do in the classroom.",
        "Two adults must be present in any vehicle transporting children, except in true medical or evacuation emergencies when only one adult is available.",
        "A roster of all children being transported must be created before departure and verified at every stop.",
        "A face-to-name count must be conducted: when children board the vehicle, when they exit at the destination, when they re-board to return, and when they exit at BHA.",
        "Children must never be left unattended in a vehicle, even for a brief moment, even with the engine running, even with windows cracked. This is true regardless of weather."
      ]},
      {subheading: "PROHIBITED PRACTICES", intro: "The following are STRICTLY PROHIBITED during any transportation of BHA children:", items: [
        "Leaving any child alone in a vehicle for any length of time, for any reason.",

      {subheading: "ATTENDANCE AND SCHEDULING", intro: "Arrive on time for every scheduled shift. If you will be late or absent, contact the Primary Director as early as possible. Chronic lateness or unexcused absences will result in corrective action. Staffing must maintain child-to-caregiver ratios at all times; your absence directly affects whether the center can meet ratio requirements."},
      {subheading: "DRESS CODE", intro: "Required: BHA-branded navy blue shirt with logo (two short-sleeve and two long-sleeve shirts will be provided during onboarding); black or blue pants or non-tight-fitting jeans in black or blue; closed-toe shoes (tennis shoes are fine); hair pulled back and secured during food service and infant care; natural hair colors only; fingernails clean and well-maintained, kept at a length that will not scratch a child (acrylic, gel, and press-on nails are permitted as long as they remain clean, professional, and free of chips). Not permitted: shorts of any length; leggings, yoga pants, joggers, or athletic wear; tight-fitting jeans, jeggings, or skinny jeans; Crocs, sandals, flip-flops, open-toe shoes, or heels; holes, rips, or tears in any clothing; graphic designs or text on bottoms; clothing with offensive language, imagery, or political messaging; unnatural hair colors (such as pink, blue, green, or purple); excessive or dangling jewelry (long necklaces, large hoop earrings, dangling bracelets); visible tattoos depicting offensive imagery or language must be covered; extreme facial or body piercings beyond small ear piercings; strong fragrances or perfumes."},
      {subheading: "CELL PHONE POLICY", intro: "Personal cell phones must be stored in your personal belongings during all classroom and supervision time. You may not use your personal phone while supervising children for any purpose, including texting, calling, browsing, or social media. You may use your phone during your scheduled break in the break area only. If you have a personal emergency, notify the director so coverage can be arranged. Violation of this policy will result in corrective action."},

// ======== Signature Pad Component ========
function SignaturePad({onSign, onClear}) {
  const canvasRef = useRef(null);
  const [drawing, setDrawing] = useState(false);
  const [hasSig, setHasSig] = useState(false);

  function getPos(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return {x: touch.clientX - rect.left, y: touch.clientY - rect.top};
  }

  function startDraw(e) {
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    setDrawing(true);
  }

  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const pos = getPos(e);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#052F59";
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    setHasSig(true);
  }

  function stopDraw() {
    setDrawing(false);
    if (hasSig && onSign) onSign(canvasRef.current.toDataURL());
  }

  function clearSig() {
    const ctx = canvasRef.current.getContext("2d");
    ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
    setHasSig(false);
    if (onClear) onClear();
  }

  useEffect(() => {
    const c = canvasRef.current;
    if (c) {
      c.width = c.offsetWidth;
      c.height = 120;
    }
  }, []);

  return React.createElement("div", {className: "sig-wrap"},
    React.createElement("div", {className: "sig-label"}, "Signature (draw with mouse or finger):"),

      {text: "Check her ID and release the child if the ID matches the last name of the child's family.", correct: false, partial: true, outcome: "Checking ID shows good instincts, but a matching last name is not the same as being on the authorized list. Family members are not automatically authorized. The parent must explicitly add someone to the pickup list. You need to contact the parent before releasing the child."},
      {text: "Do not release the child. Politely explain you need parent authorization. Call the parent to either add the aunt in Brightwheel or provide verbal confirmation to the director.", correct: true, outcome: "This is the correct response. You do not release the child. You politely explain the policy, call the parent, and let them authorize the pickup through Brightwheel or verbal confirmation to the director, who documents it. The child's safety comes first, even if it creates an awkward moment."}

  },

      {text: "Put the phone away. Use the walkie talkie to ask the director to send coverage so you can step out and handle the call.", correct: true, outcome: "This is the correct response. You secure coverage FIRST, then handle your personal matter. The walkie talkie is the communication tool during classroom hours. Once another staff member or the floater arrives, you step out to handle the call. Your children's safety and your own child's needs are both addressed."},
      {text: "Step into the hallway for 30 seconds to make a quick call while keeping the door open.", correct: false, outcome: "Leaving 8 toddlers unsupervised for even 30 seconds is a ratio violation and a supervision lapse. Children can be injured in seconds. An open door does not constitute supervision. You must have another qualified adult physically present in the room before you step out. **No exceptions.**"}

      {text: "Tell the inspector to ask the director instead.", correct: false, partial: true, outcome: "While the director can certainly help, the inspector asked YOU because you are the caregiver in the room. You should be able to account for every child in your care at all times. Redirecting the question entirely makes it look like you do not know your own classroom. Give your honest answer first, then offer to involve the director if needed."}

  "m5_fire": {
    prompt: "The fire alarm goes off during lunch. You are in Classroom 2 with 8 toddlers. Food is on the table, one child is in a high chair, and another staff member just stepped out to use the restroom. What do you do?",
    choices: [
      {text: "Wait for the other staff member to come back so you have help evacuating.", correct: false, outcome: "You do not wait. The fire alarm means evacuate NOW. Every second counts. The other staff member will hear the alarm and evacuate from wherever they are. You are responsible for the children in your room right now. Waiting could be the difference between a safe evacuation and a tragedy."},
      {text: "Leave the food. Get the child out of the high chair. Grab the attendance roster. Lead all children to the exit following the posted route. Close the door behind you.", correct: true, outcome: "This is exactly right. **Leave the food.** Get the high chair child first (safety priority). Grab the roster. Follow R.A.C.E.: Rescue (high chair child), Alert (alarm is already sounding), Contain (close the door behind you), Evacuate (follow the posted route to the assembly point). Count children at the assembly point and report to the director."},
      {text: "Grab your phone, the Brightwheel tablet, and the emergency binder, then start evacuating children.", correct: false, partial: true, outcome: "The attendance roster and emergency binder are important, but your phone and the tablet are not evacuation priorities. The child in the high chair is your first priority. Do not waste time gathering electronics. Get the children out. The roster is critical for the head count at the assembly point. Everything else can be replaced."}
    ]
  },
  "m6_disclosure": {
    prompt: "Three-year-old Mia says to you during circle time: 'Daddy hit me with a belt last night. It hurt really bad.' She is holding her left arm and crying. What do you do?",
    choices: [
      {text: "Ask Mia detailed questions to find out exactly what happened: 'Where did he hit you? How many times? Did your mommy see it?'", correct: false, outcome: "Do NOT investigate. You are not a detective. Asking leading or detailed questions can contaminate the child's testimony if the case goes to court. It can also re-traumatize the child. Your role is to listen, believe, document the child's exact words, and report. The investigation is DFPS's responsibility."},
      {text: "Tell Mia: 'I am sure Daddy did not mean it. Sometimes parents get frustrated.' Then mention it to the director at the end of the day.", correct: false, outcome: "This is dangerous on multiple levels. You are dismissing a child's disclosure, minimizing potential abuse, and delaying a legally required report. Never tell a child that abuse is normal or excusable. Never wait to report. You must report to the Texas Abuse Hotline within 48 hours. A child told you they were hit with a belt. That is a disclosure, and you are a mandatory reporter."},
      {text: "Listen calmly. Say: 'Thank you for telling me, Mia. I want to help you be safe.' Document her exact words immediately. Report to the Texas Abuse Hotline at 1-800-252-5400. Notify the director.", correct: true, outcome: "This is the correct response. **Listen. Believe. Document. Report.** You validated Mia's courage in telling you. You did not promise secrecy (which you cannot do). You documented her exact words. You reported to the hotline AND notified the director. You are protecting this child. This is exactly why mandatory reporting laws exist."}
    ]
  },
  "m7_meal_log": {
    prompt: "It is 10:30 AM and you suddenly realize you forgot to log breakfast in Brightwheel. Breakfast was served at 8:00 AM. What do you do?",
    choices: [
      {text: "Skip it. One missed log is not a big deal.", correct: false, outcome: "CACFP documentation is audited by the USDA. Missing meal logs can result in loss of federal funding for the center. Every meal must be documented for every child present. Skipping a log is not a minor oversight. It is a compliance failure that affects BHA's ability to receive meal reimbursement."},
      {text: "Log it now with the correct breakfast time (8:00 AM), not the current time.", correct: true, outcome: "This is correct. Log it now with the accurate time the meal was served. CACFP requires every meal to be documented. Logging late is better than not logging at all. Going forward, make it a habit to log meals immediately as they are served. Real-time documentation is accurate documentation."},
      {text: "Ask the director to log it since you forgot.", correct: false, partial: true, outcome: "You can ask the director for help if you are locked out of Brightwheel, but the responsibility is yours. The director was not in your classroom and does not know exactly what was served and which children were present. Log it yourself with accurate information. Own the mistake and fix it."}
    ]
  },
  "m8_social_media": {
    prompt: "After a great day at BHA, you post on your personal Instagram: 'Had the best day with my little ones today! One of them said the funniest thing during circle time \ud83d\ude02 I love my job!' You did not name any children or the center. Is this a problem?",
    choices: [
      {text: "No, it is fine. You did not name anyone or post photos.", correct: false, outcome: "This IS a problem. Your friends and family know where you work. 'My little ones' identifies them as children in your care. 'During circle time' identifies a childcare setting. If anyone can figure out who you are talking about or where you work, you have violated confidentiality. Parents who see this post may wonder what else you are sharing. **A single social media post can result in immediate termination.**"},
      {text: "It is borderline. Delete it to be safe, but it probably would not get you in trouble.", correct: false, partial: true, outcome: "Deleting it is the right instinct, but calling it 'borderline' underestimates the risk. BHA's social media policy is absolute: you may not post about children, families, or workplace situations on personal social media. Even vague posts create risk. If a parent sees it and complains, it becomes a confidentiality investigation. Do not post. Period."},
      {text: "Yes, this is a violation. Delete it immediately and do not post about work on personal social media.", correct: true, outcome: "Correct. Even without names or photos, this post references children in your care and a specific activity. Your social network knows where you work. This violates BHA's social media and confidentiality policies. Delete it immediately. Going forward, the rule is simple: **do not post about children, families, or anything that happens at BHA on your personal social media. Ever.**"}
    ]
  }
};

// ======== Scenario Branching Component ========
function ScenarioBranch({data}) {
  const [chosen, setChosen] = useState(null);
  function handleChoice(idx) {
    if (chosen !== null) return;
    setChosen(idx);
  }
  return React.createElement("div", {className: "sb-wrap"},
    React.createElement("div", {className: "sb-badge"}, "\ud83c\udfad Interactive Scenario"),
    React.createElement("div", {className: "sb-prompt", dangerouslySetInnerHTML: {__html: bold(data.prompt)}}),
    data.choices.map(function(c, i) {
      var cls = "sb-choice";
      if (chosen !== null) {
        if (i === chosen) cls += c.correct ? " correct" : " wrong";
        else if (c.correct) cls += " correct";
        else cls += " dimmed";
      }
      return React.createElement("button", {key: i, className: cls, onClick: function(){handleChoice(i)}},
        String.fromCharCode(65 + i) + ") " + c.text
      );
    }),
    chosen !== null && React.createElement("div", {
      className: "sb-outcome show " + (data.choices[chosen].correct ? "good" : data.choices[chosen].partial ? "ok" : "bad")
    },
      React.createElement("div", {className: "sb-outcome-title"},
        data.choices[chosen].correct ? "\u2705 Correct!" : data.choices[chosen].partial ? "\u26a0\ufe0f Partially Correct" : "\u274c Not the Best Choice"
      ),
      React.createElement("div", {dangerouslySetInnerHTML: {__html: bold(data.choices[chosen].outcome)}})
    )
  );
}

  const [tempName,setTempName]=useState("");

          React.createElement("p",{style:{fontWeight:700,marginBottom:6,color:"#052F59"}},"Welcome to your preservice orientation training."),
          React.createElement("p",{style:{marginBottom:6}},"This portal contains two sections:"),
          React.createElement("p",{style:{marginBottom:4,paddingLeft:12}},React.createElement("span",null,"\ud83d\udcda "),React.createElement("strong",null,"Training Modules:"),React.createElement("span",null," 8 modules covering 10 clock hours of instruction. Each module includes narrated slides, interactive self-check questions, in-person facilitation, and a graded quiz (70% required to pass).")),
          React.createElement("p",{style:{marginBottom:6,paddingLeft:12}},React.createElement("span",null,"\ud83d\udcc4 "),React.createElement("strong",null,"Documents and Forms:"),React.createElement("span",null," All required agreement forms, fillable employment forms, and reference documents. Scroll below the training modules to find them.")),
          React.createElement("p",{style:{marginBottom:6}},"These 10 hours count toward preservice training requirements under TAC 746.1301. Caregivers will complete an additional 16 hours within 90 days of employment. Directors will complete an additional 22 hours annually. CPR/First Aid certification is also required. BHA offers in-house certification through our HSI-authorized training center. If you do not currently hold a valid certification, we will assist you. BHA will provide guidance on approved training options and scheduling throughout the preservice period."),
          React.createElement("p",{style:{fontWeight:600,color:"#052F59"}},"Upon passing each module, you will receive a printable certificate for your employee file.\n\nYou do not need to complete all 8 modules in one day. Complete them at your own pace across multiple sessions. Your progress is saved automatically, and you can return where you left off at any time.")
        ),
        React.createElement("div",{style:{background:"#FFF8E1",borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:12,color:"#4A3A00",display:"flex",gap:12,alignItems:"flex-start"}},
          React.createElement("span",{style:{fontSize:18}},"\u23f1"),
          React.createElement("div",null,
            React.createElement("strong",null,"8 Modules | 10 Hours | "+MODULES.reduce(function(a,m){return a+m.quiz.length},0)+" Quiz Questions"))
        ),
        React.createElement("p",{style:{fontSize:13,color:"#333",marginBottom:8,fontWeight:600}},"Enter your full name and email below."),
        React.createElement("p",{style:{fontSize:12,color:"#5a6f82",marginBottom:12,fontStyle:"italic"}},"Your name will appear on all certificates. Your email is used to confirm your training completions for your employee file."),

          React.createElement("input",{className:"email-banner-input",type:"email",placeholder:"your@email.com",value:bannerEmail,onChange:function(e){setBannerEmail(e.target.value);if(bannerError)setBannerError("")},onKeyDown:function(e){return e.key==="Enter"&&handleBannerEmailSubmit()}}),
