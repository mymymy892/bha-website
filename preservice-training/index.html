<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benevolent House Academy Staff Training Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#FAF8F4;color:#1B3A5C;line-height:1.6}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#e8e5de}::-webkit-scrollbar-thumb{background:#1B3A5C;border-radius:3px}
@media print{.no-print{display:none!important}.print-only{display:block!important}body{background:#fff}}
.print-only{display:none}
/* Header - matched to logo blue #052F59 */
.hdr{background:linear-gradient(135deg,#031D38 0%,#052F59 40%,#0A3A6B 100%);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.hdr-logo{height:48px;width:48px;object-fit:contain;flex-shrink:0}
.hdr-logo-clickable{cursor:pointer;transition:transform .15s,opacity .15s;border-radius:8px}
.hdr-logo-clickable:hover{transform:scale(1.06);opacity:.9}
.hdr-logo-clickable:focus{outline:2px solid #C5960C;outline-offset:2px}
.hdr h1{font-size:18px;font-weight:700;letter-spacing:.3px}.hdr-sub{font-size:11px;opacity:.7;display:block;margin-top:1px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.hdr-name{font-size:13px;color:#E3B332}
.hdr-btn{background:#C5960C;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s}
.hdr-btn:hover{background:#a67e09;transform:translateY(-1px)}
/* Returning-user email banner */
.email-banner{background:#FFF8E1;border-bottom:2px solid #C5960C;padding:12px 20px}
.email-banner-inner{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.email-banner-msg{flex:1;min-width:240px;font-size:13px;color:#4A3A00;line-height:1.5}
.email-banner-msg strong{color:#052F59}
.email-banner-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.email-banner-input{padding:8px 12px;border:2px solid #C5960C;border-radius:6px;font-size:14px;min-width:220px;outline:none}
.email-banner-input:focus{border-color:#052F59}
.email-banner-btn{background:#C5960C;color:#fff;border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
.email-banner-btn:hover:not(:disabled){background:#a67e09}
.email-banner-btn:disabled{opacity:.5;cursor:not-allowed}
.email-banner-skip{background:transparent;color:#5a6f82;border:none;padding:8px 12px;font-size:12px;cursor:pointer;text-decoration:underline}
.email-banner-err{color:#C62828;font-size:12px;margin-top:6px;width:100%}
/* Module Grid */
.grid-wrap{max-width:1100px;margin:0 auto;padding:32px 20px}
.grid-title{font-size:28px;font-weight:700;color:#052F59;margin-bottom:4px}
.grid-sub{color:#5a6f82;margin-bottom:24px;font-size:15px}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mod-card{background:#fff;border-radius:12px;border:1px solid #ddd;padding:20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.mod-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(5,47,89,.15);border-color:#C5960C}
.mod-card.complete{border-left:4px solid #2E7D32}
.mc-num{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#C5960C;font-weight:700;margin-bottom:4px}
.mc-title{font-size:16px;font-weight:700;color:#052F59;margin-bottom:8px;line-height:1.3}
.mc-meta{font-size:12px;color:#5a6f82;display:flex;gap:12px;margin-bottom:8px}
.mc-bar{height:4px;background:#e8e5de;border-radius:2px;overflow:hidden;margin-top:8px}
.mc-fill{height:100%;background:linear-gradient(90deg,#C5960C,#E3B332);border-radius:2px;transition:width .4s}
.mc-badge{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.mc-badge.pass{background:#2E7D32;color:#fff}.mc-badge.fail{background:#C62828;color:#fff}
.mc-score{font-size:11px;color:#5a6f82;margin-top:4px}
/* Slide Viewer */
.sv-wrap{max-width:900px;margin:0 auto;padding:20px}
.sv-breadcrumb{font-size:12px;color:#5a6f82;margin-bottom:12px;cursor:pointer}
.sv-breadcrumb:hover{color:#C5960C}
.sv-card{background:#fff;border-radius:12px;border:1px solid #ddd;padding:32px;min-height:400px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sv-title-slide{text-align:center;padding:60px 20px}
.sv-title-slide h2{font-size:28px;color:#052F59;margin-bottom:12px;line-height:1.3}
.sv-title-slide p{font-size:16px;color:#5a6f82;max-width:600px;margin:0 auto}
.sv-content h3{font-size:22px;color:#052F59;margin-bottom:16px;border-bottom:2px solid #E3B332;padding-bottom:8px}
.sv-body{font-size:15px;line-height:1.75;color:#2a3d52}
.sv-body p{margin-bottom:12px}
.sv-body ol,.sv-body ul{margin:8px 0 12px 20px}.sv-body li{margin-bottom:4px}
.sv-body strong{color:#052F59}
/* Callout boxes */
.callout{padding:14px 16px;border-radius:8px;margin:12px 0;font-size:14px;line-height:1.6;border-left:4px solid}
.callout-warn{background:#FFF3E0;border-color:#E65100;color:#4E2700}
.callout-danger{background:#FFEBEE;border-color:#C62828;color:#4A0E0E}
.callout-tip{background:#E8F5E9;border-color:#2E7D32;color:#1B3A1E}
.callout-info{background:#E3F2FD;border-color:#1565C0;color:#0D2B4E}
.callout-warn::before{content:"\26a0\fe0f "}.callout-danger::before{content:"\1f6ab "}.callout-tip::before{content:"\1f4a1 "}.callout-info::before{content:"\2139\fe0f "}
.scenario-box{background:#F3E5F5;border:1px solid #9C27B0;border-radius:8px;padding:16px;margin:12px 0;font-size:14px;line-height:1.65;color:#3A1546}
.scenario-box::before{content:"\1f4cb Scenario";display:block;font-weight:700;margin-bottom:6px;color:#6A1B9A}
.scenario-box p{margin-bottom:8px}.scenario-box p:last-child{margin-bottom:0}
.scenario-box ol,.scenario-box ul{margin:6px 0 8px 22px}.scenario-box li{margin-bottom:4px}
.callout p{margin-bottom:6px}.callout p:last-child{margin-bottom:0}
.callout ol,.callout ul{margin:4px 0 6px 22px}.callout li{margin-bottom:3px}
.keypoint-box{background:#FFF8E1;border:2px solid #C5960C;border-radius:8px;padding:14px 16px;margin:12px 0;font-size:15px;font-weight:600;color:#052F59;text-align:center}
.keypoint-box::before{content:"\1f511 Key Point";display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#C5960C;margin-bottom:4px;font-weight:700}
/* Self-check question */
.sc-wrap{background:#F0F7FF;border:2px solid #1565C0;border-radius:12px;padding:24px;margin:0}
.sc-badge{display:inline-block;background:#1565C0;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
.sc-q{font-size:17px;font-weight:700;color:#052F59;margin-bottom:16px}
.sc-opt{display:block;padding:12px 16px;margin:8px 0;border:2px solid #ccc;border-radius:8px;cursor:pointer;font-size:14px;transition:all .15s;background:#fff}
.sc-opt:hover{border-color:#1565C0;background:#F0F7FF}
.sc-opt.selected{border-color:#1565C0;background:#E3F2FD;font-weight:600}
.sc-opt.correct{border-color:#2E7D32;background:#E8F5E9}.sc-opt.wrong{border-color:#C62828;background:#FFEBEE}
.sc-explain{margin-top:16px;padding:12px;background:#E8F5E9;border-radius:8px;font-size:14px;color:#1B3A1E;display:none}
.sc-explain.show{display:block}
.sc-note{text-align:center;font-size:12px;color:#5a6f82;margin-top:8px;font-style:italic}
/* Slide timer bar */
.sv-timer{height:3px;background:#e8e5de;border-radius:2px;margin-bottom:8px;overflow:hidden;position:relative}
.sv-timer-fill{height:100%;background:#C5960C;border-radius:2px;transition:width .1s linear}
.sv-timer-label{font-size:11px;color:#999;text-align:right;margin-bottom:4px}
/* Navigation */
.sv-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.sv-nav-btn{background:#052F59;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:6px}
.sv-nav-btn:hover{background:#031D38}.sv-nav-btn:disabled{opacity:.4;cursor:default}
.sv-nav-btn.gold{background:#C5960C}.sv-nav-btn.gold:hover{background:#a67e09}
.sv-counter{font-size:13px;color:#5a6f82;font-weight:600}
.sv-progress{height:3px;background:#e8e5de;border-radius:2px;margin-top:8px;overflow:hidden}
.sv-prog-fill{height:100%;background:#C5960C;border-radius:2px;transition:width .3s}
.sv-read{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sv-read-btn{background:none;border:1px solid #052F59;color:#052F59;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;transition:all .2s}
.sv-read-btn:hover{background:#052F59;color:#fff}.sv-read-btn.active{background:#C5960C;border-color:#C5960C;color:#fff}
/* Interactive expand/reveal */
.reveal-box{border:1px solid #C5960C;border-radius:8px;margin:12px 0;overflow:hidden}
.reveal-header{background:#FFF8E1;padding:12px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:600;color:#052F59;font-size:14px}
.reveal-header:hover{background:#FFF3CD}
.reveal-arrow{transition:transform .2s;font-size:18px}
.reveal-arrow.open{transform:rotate(180deg)}
.reveal-content{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .3s,padding .3s;font-size:14px}
.reveal-content.open{max-height:2000px;padding:12px 16px}
/* Quiz */
.quiz-q{background:#fff;border:1px solid #ddd;border-radius:10px;padding:20px;margin-bottom:16px}
.quiz-q h4{font-size:15px;color:#052F59;margin-bottom:12px;font-weight:600}
.quiz-opt{display:block;padding:10px 14px;margin:6px 0;border:1px solid #ccc;border-radius:8px;cursor:pointer;font-size:14px;transition:all .15s;background:#fff}
.quiz-opt:hover{border-color:#C5960C;background:#FFFDF6}
.quiz-opt.selected{border-color:#052F59;background:#E8EEF4;font-weight:600}
.quiz-opt.correct{border-color:#2E7D32;background:#E8F5E9}.quiz-opt.wrong{border-color:#C62828;background:#FFEBEE}
.quiz-submit{text-align:center;margin-top:20px}
.quiz-result{text-align:center;padding:32px;background:#fff;border-radius:12px;border:1px solid #ddd;margin-top:16px}
.quiz-result h3{font-size:24px;margin-bottom:8px}.quiz-result.pass h3{color:#2E7D32}.quiz-result.fail h3{color:#C62828}
/* Certificate */
.cert{border:3px solid #C5960C;padding:40px;text-align:center;background:#fff;margin:20px auto;max-width:700px;position:relative}
.cert::before{content:"";position:absolute;inset:8px;border:1px solid #E3B332;pointer-events:none}
.cert h2{font-size:26px;color:#052F59;margin-bottom:4px}.cert h3{color:#C5960C;font-size:18px;margin:16px 0 8px}
.cert p{font-size:14px;color:#5a6f82;margin:4px 0}
.cert-name{font-size:24px;color:#052F59;font-weight:700;margin:20px 0;border-bottom:2px solid #E3B332;display:inline-block;padding-bottom:4px}
/* Name entry */
.name-overlay{position:fixed;inset:0;background:rgba(5,47,89,.9);display:flex;align-items:flex-start;justify-content:center;z-index:200;overflow-y:auto;padding:20px 0}
.name-box{background:#fff;border-radius:16px;padding:40px;text-align:center;max-width:420px;width:90%;margin:40px auto}
.name-box h2{font-size:22px;color:#052F59;margin-bottom:4px}.name-box p{font-size:14px;color:#5a6f82;margin-bottom:20px}
.name-input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px;text-align:center;outline:none;transition:border .2s}
.name-input:focus{border-color:#C5960C}
.name-submit{margin-top:16px;background:#C5960C;color:#fff;border:none;padding:12px 32px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s}
.name-submit:hover{background:#a67e09}
/* mobile styles moved to comprehensive block */

/* Interactive: Accordion */
.accordion{border:1px solid #C5960C;border-radius:8px;margin:12px 0;overflow:hidden}
.accordion-hdr{background:#FFF8E1;padding:12px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:600;color:#052F59;font-size:14px;user-select:none;transition:background .2s}
.accordion-hdr:hover{background:#FFF3CD}
.accordion-arrow{transition:transform .3s;font-size:16px;color:#C5960C}
.accordion-arrow.open{transform:rotate(90deg)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .4s ease;padding:0 16px;font-size:14px;line-height:1.6;color:#2a3d52}
.accordion-body.open{max-height:2000px;padding:12px 16px}
/* Interactive: Flip Card */
.flip-card{perspective:1000px;margin:12px 0;height:auto;min-height:120px}
.flip-card-inner{position:relative;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.flip-card-inner.flipped{transform:rotateY(180deg)}
.flip-card-front,.flip-card-back{backface-visibility:hidden;border-radius:8px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px}
.flip-card-front{background:linear-gradient(135deg,#052F59,#0A3A6B);color:#fff;font-size:15px;font-weight:600}
.flip-card-front::after{content:"\1f449 Tap to reveal";display:block;font-size:11px;opacity:.7;margin-top:8px;font-weight:400}
.flip-card-back{background:#E8F5E9;border:2px solid #2E7D32;color:#1B3A1E;font-size:14px;position:absolute;top:0;left:0;right:0;transform:rotateY(180deg)}
.flip-card-back::before{content:"\2705 Answer";display:block;font-size:11px;font-weight:700;color:#2E7D32;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
/* Interactive: Reveal Box (click + to expand) */
.reveal-btn{display:inline-flex;align-items:center;gap:8px;background:#F0F7FF;border:1px solid #1565C0;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#1565C0;margin:6px 0;transition:all .2s;user-select:none}
.reveal-btn:hover{background:#E3F2FD}
.reveal-btn .plus{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#1565C0;color:#fff;font-size:14px;font-weight:700;transition:transform .3s}
.reveal-btn .plus.open{transform:rotate(45deg)}
.reveal-content{max-height:0;overflow:hidden;transition:max-height .4s ease;font-size:14px;line-height:1.6;color:#2a3d52;padding:0 12px;margin-left:28px}
.reveal-content.open{max-height:2000px;padding:8px 12px}

/* Documents & Forms Section */
.docs-section{max-width:1100px;margin:0 auto;padding:0 20px 32px}
.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
.doc-card{background:#fff;border-radius:12px;border:1px solid #ddd;padding:20px;transition:all .25s;cursor:pointer;position:relative}
.doc-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(5,47,89,.12);border-color:#C5960C}
.doc-card-icon{font-size:28px;margin-bottom:8px}
.doc-card-title{font-size:15px;font-weight:700;color:#052F59;margin-bottom:4px}
.doc-card-desc{font-size:12px;color:#5a6f82;line-height:1.5}
.doc-tag{display:inline-block;background:#E3F2FD;color:#1565C0;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;margin-top:8px;text-transform:uppercase;letter-spacing:.5px}
.doc-tag.sign{background:#FFF3E0;color:#E65100}
.doc-tag.download{background:#E8F5E9;color:#2E7D32}
/* Form Viewer */
.form-wrap{max-width:800px;margin:0 auto;padding:20px}
.form-card{background:#fff;border-radius:12px;border:1px solid #ddd;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.form-card h2{font-size:22px;color:#052F59;margin-bottom:4px;text-align:center}
.form-card h3{font-size:16px;color:#052F59;margin:20px 0 8px;border-bottom:2px solid #E3B332;padding-bottom:6px}
.form-card p,.form-card li{font-size:14px;line-height:1.7;color:#2a3d52;margin-bottom:8px}
.form-card ol,.form-card ul{margin-left:20px;margin-bottom:12px}
.form-label{display:block;font-size:13px;font-weight:600;color:#052F59;margin:12px 0 4px}
.form-input{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;margin-bottom:8px;outline:none;transition:border .2s}
.form-input:focus{border-color:#C5960C}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-divider{border:none;border-top:2px solid #E3B332;margin:24px 0}
/* Signature Pad */
.sig-wrap{margin:16px 0}
.sig-label{font-size:13px;font-weight:600;color:#052F59;margin-bottom:6px}
.sig-canvas{border:2px dashed #C5960C;border-radius:8px;width:100%;height:120px;cursor:crosshair;touch-action:none;background:#FFFDF6}
.sig-canvas.signed{border-style:solid;border-color:#2E7D32;background:#F9FFF9}
.sig-actions{display:flex;gap:8px;margin-top:6px}
.sig-btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid #ccc;background:#fff;cursor:pointer;transition:all .2s}
.sig-btn:hover{background:#f5f5f5}
.sig-btn.submit{background:#C5960C;color:#fff;border-color:#C5960C}
.sig-btn.submit:hover{background:#a67e09}
.sig-btn.submit:disabled{opacity:.5;cursor:default}
.form-success{text-align:center;padding:40px;background:#E8F5E9;border-radius:12px;margin:20px 0}
.form-success h3{color:#2E7D32;font-size:20px;margin-bottom:8px;border:none}
.form-success p{color:#1B3A1E;font-size:14px}
/* Section divider on module grid */
.section-divider{border:none;border-top:2px solid #E3B332;margin:32px 0 24px;max-width:1100px;margin-left:auto;margin-right:auto;padding:0 20px}
.section-title{font-size:20px;font-weight:700;color:#052F59;margin-bottom:4px;max-width:1100px;margin-left:auto;margin-right:auto;padding:0 20px}
.section-sub{font-size:13px;color:#5a6f82;max-width:1100px;margin-left:auto;margin-right:auto;padding:0 20px;margin-bottom:8px}
/* Mobile optimization improvements */
@media(max-width:600px){
  .form-row{grid-template-columns:1fr}
  .docs-grid{grid-template-columns:1fr}
  .sv-card{padding:16px}
  .sv-title-slide{padding:30px 12px}
  .sv-title-slide h2{font-size:20px}
  .hdr{padding:8px 12px}
  .hdr h1{font-size:14px}
  .hdr-sub{display:none}
  .hdr-logo{height:36px;width:36px}
  .hdr-right{gap:6px}
  .hdr-btn{padding:5px 10px;font-size:11px}
  .grid-wrap{padding:16px 12px}
  .grid-title{font-size:20px}
  .grid-sub{font-size:13px}
  .mod-grid{grid-template-columns:1fr}
  .mod-card{padding:16px}
  .sv-nav{flex-wrap:wrap;gap:8px}
  .sv-nav-btn{padding:8px 14px;font-size:13px;flex:1;justify-content:center}
  .form-card{padding:20px 16px}
  .cert{padding:24px 16px}
  .name-box{padding:24px 16px;max-width:95%}
  .name-box h2{font-size:18px}
  .sc-wrap{padding:16px}
  .sc-q{font-size:15px}
  .quiz-q{padding:14px}
  .quiz-q h4{font-size:14px}
  .callout,.scenario-box{padding:12px;font-size:13px}
  body{font-size:15px}
}
@media(max-width:400px){
  .hdr h1{font-size:12px}
  .hdr-name{display:none}
  .grid-title{font-size:18px}
}

/* Scenario Branching */
.sb-wrap{background:#F3E5F5;border:2px solid #9C27B0;border-radius:12px;padding:20px;margin:12px 0}
.sb-badge{display:inline-block;background:#9C27B0;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.sb-prompt{font-size:15px;font-weight:600;color:#3A1546;margin-bottom:14px;line-height:1.6}
.sb-choice{display:block;padding:12px 16px;margin:8px 0;border:2px solid #CE93D8;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s;background:#fff;color:#3A1546;text-align:left;width:100%;font-family:inherit;line-height:1.5}
.sb-choice:hover{border-color:#9C27B0;background:#F8F0FA;transform:translateX(4px)}
.sb-choice.correct{border-color:#2E7D32;background:#E8F5E9;color:#1B3A1E}
.sb-choice.wrong{border-color:#C62828;background:#FFEBEE;color:#4A0E0E}
.sb-choice.dimmed{opacity:.5;cursor:default;transform:none}

const CENTER_INFO={"name":"Benevolent House Academy","tagline":"Where Foundations Become Futures","address":"508 N State Hwy 342, Red Oak, TX 75154","phone":"(469) 807-1221","operation":"#1832672","capacity":52,"infantCapacity":9};
const ROOMS=[{"name":"Nursery","ages":"0 - 11 months","cap":4,"ratio":"1:4","stateRatio":"1:4"},{"name":"Classroom 1","ages":"12 - 17 months","cap":5,"ratio":"1:5","stateRatio":"1:5"},{"name":"Classroom 2","ages":"18 months - 2 years","cap":9,"ratio":"1:9","stateRatio":"1:9"},{"name":"Classroom 3","ages":"3 years","cap":10,"ratio":"1:15","stateRatio":"1:15"},{"name":"Classroom 4","ages":"4 years","cap":10,"ratio":"1:18","stateRatio":"1:18"},{"name":"Classroom 5","ages":"5 - 13 years","cap":14,"ratio":"1:22","stateRatio":"1:26"}];
const M1_SLIDES=[{"type":"title","title":"Module 1: Welcome and Center Overview","sub":"Your introduction to Benevolent House Academy, our mission, our team, and how we operate every day."},{"type":"content","title":"Welcome to BHA","body":"Welcome to Benevolent House Academy. We are glad you are here. This orientation will prepare you to serve the children and families who depend on us every day.\n\nBenevolent House Academy is a licensed 24-hour child care center located at 508 N State Hwy 342, Red Oak, TX 75154. Our HHSC Operation Number is #1832672. We are licensed for up to 52 children, including 9 infants.\n\nOur tagline is: Where Foundations Become Futures. That is not just a slogan. It is a commitment. Every interaction you have with a child in this building shapes who they become."},{"type":"content","title":"Our Story","body":"Benevolent House Academy was founded by Tanya and Christopher Orr, parents of nine children. Through their work with Benevolent House, a licensed child-placing agency serving children and families across Texas, they witnessed a deeper need than schedules alone.\n\nToo many children were arriving in classrooms and child care centers that were not equipped to meet them where they were. Children who needed patience, connection, and skilled support to thrive. Children who learned best when adults responded with understanding rather than reaction. These children were often misunderstood, mislabeled, or sent home. Their families were left with limited options.\n\nAt the same time, families working nontraditional hours, early mornings, late evenings, weekends, and overnight shifts, had very few places to turn for safe, high-quality care that operated on their schedule.\n\nBHA was built to answer both needs at once. We provide developmentally rich, social-emotionally grounded, attuned care for every child who walks through our doors, on a schedule that works for the families who depend on us. Parents should not have to worry about their child while they are away. They should feel confident that their child is seen, supported, and growing.\n\n[callout-tip]You are not just an employee here. You are part of a mission that grew from years of serving families and children through Benevolent House. BHA is the next chapter of that work, and you are helping write it.[/callout-tip]"},{"type":"content","title":"Our Mission and Values","body":"Our mission is to provide a safe, nurturing, and developmentally enriching environment where every child can thrive, regardless of their family's schedule or circumstances.\n\nOur core values drive every decision we make:\n\n1. Safety First: Nothing is more important than the physical and emotional safety of every child in our care.\n2. Respect for Families: We honor every family structure, every background, and every schedule.\n3. Whole-Child Development: We nurture the social, emotional, cognitive, and physical growth of each child.\n4. Professional Excellence: We hold ourselves to the highest standards of care, compliance, and continuous improvement.\n5. Team Culture: We support each other, communicate openly, and grow together.\n[flip=What is BHA's tagline?]Where Foundations Become Futures. It is not just a slogan. It is a commitment.[/flip]"},{"type":"content","title":"Leadership Team","body":"You should know the people who lead this center:\n\n**Tanya Orr, Founder and Executive Director:** Tanya oversees all strategic, compliance, and operational decisions for BHA. She brings years of experience in child welfare, education, and organizational leadership.\n\n**Christopher Orr, Co-Founder and COO:** Christopher manages day-to-day facility operations, vendor relationships, and logistics. He ensures the building runs smoothly so you can focus on the children.\n\n**Haddie Mashburn, Primary Director (LCPAA):** Haddie is your direct point of contact for licensing compliance, classroom operations, and daily scheduling questions. If you need something during the day, Haddie is your go-to.\n\n**Tonya Dixon, Assistant Director:** Tonya supports classroom oversight, parent communication, and staff coordination.\n\n[callout-info]If you are ever unsure who to go to with a question, start with the director. Haddie or Tonya can help with most day-to-day questions. For facility or building issues, go to Christopher.[/callout-info]\n[accordion=Who do I go to with questions?]Start with the director (Haddie or Tonya) for day-to-day questions. For facility or building issues, go to Christopher Orr (COO). For policy decisions or escalated concerns, go to Tanya Orr (Executive Director).[/accordion]"},{"type":"content","title":"Licensing and Regulation","body":"BHA is licensed by the Texas Health and Human Services Commission (HHSC) through the Child Care Regulation (CCR) division. Our license is governed by the Texas Administrative Code, Chapter 746: Minimum Standards for Child-Care Centers.\n\nWhat does this mean for you? It means everything we do is regulated. The way we supervise children, the way we store food, the way we document incidents, the way we maintain our building. All of it must meet or exceed state standards.\n\nYour compliance is not optional. A single violation can trigger an inspection, a corrective action plan, or in severe cases, a suspension of our license. You are the front line of compliance.\n\n[callout-warn]Licensing inspectors can arrive at any time, unannounced. You should always operate as though an inspector is watching, because one day, they will be.[/callout-warn]"},{"type":"selfcheck","title":"Quick Check","q":"What is BHA's HHSC Operation Number?","opts":["#1832672","#1662194","#806468793","#1832672-12571"],"ans":0,"explanation":"BHA's HHSC Operation Number is #1832672. You should know this number."},{"type":"content","title":"Hours of Operation","body":"BHA is licensed for 24-hour child care. Here is when we are open:\n\nBHA operates 24 hours a day, 7 days a week, year-round. We are open every day, including weekends, to serve families who work nontraditional schedules.\n\n**Drop-Off Cutoff:** All children must be dropped off by 9:00 AM. After 9:00 AM, we should have a clear picture of who is in the building for the day.\n\nOvernight care is available by arrangement for families who work night shifts. Families must enroll for overnight services in advance.\n\n**Holidays (Closed):**\n- New Year's Day\n- New Year's Eve\n- Martin Luther King Jr. Day\n- Memorial Day\n- Juneteenth\n- Independence Day (July 4th)\n- Labor Day\n- Thanksgiving Day and the day after\n- Christmas Eve\n- Christmas Day\n\n[callout-info]Overnight care operates on a reservation basis. Families must enroll for overnight services in advance. You will learn more about overnight procedures in Module 7.[/callout-info]\n[flip=What is the drop-off cutoff time?]9:00 AM. After this time, we should have a clear picture of who is in the building for the day.[/flip]"},{"type":"content","title":"BHA's Classroom Structure","body":"Our center is organized into age-specific classrooms. Each room has a designated capacity and staff-to-child ratio that meets or exceeds state requirements.\n\n[callout-tip]BHA ratios are tighter than the state requires in several rooms. This is intentional. Smaller groups mean more individual attention for every child.[/callout-tip]\n\nHere are the BHA-specific ratios (these are our internal standards, not the state minimums):\n\n- Nursery (0 to 11 months): Capacity 4, BHA Ratio 1:4\n- Classroom 1 (12 to 17 months): Capacity 5, BHA Ratio 1:5\n- Classroom 2 (18 months to 2 years): Capacity 9, BHA Ratio 1:9\n- Classroom 3 (3 years): Capacity 10, BHA Ratio 1:15\n- Classroom 4 (4 years): Capacity 10, BHA Ratio 1:18\n- Classroom 5 (5 to 13 years): Capacity 14, BHA Ratio 1:22"},{"type":"content","title":"Know Your Classroom","body":"As a teacher at BHA, you are responsible for knowing critical information about every child in your classroom. This is not optional. It is a safety and care requirement.\n\n**For every child in your room, you must know:**\n- Their full name and how to pronounce it correctly\n- Their age (for children under 2, you must know their age in months)\n- All food allergies and the location of their emergency plan\n- Any medications they take and when\n- For infants: whether they can roll over, sit up, pull to stand, or crawl\n- Their authorized pickup contacts\n- Any special instructions from the parent\n\n[callout-warn]On your first day in a classroom, the director will review this information with you. Before you are alone with children, you must be able to identify every child by name and know their allergies. A missed allergy can be life-threatening.[/callout-warn]\n\n[callout-tip]Keep a quick-reference card in your pocket or posted on the wall (out of parent view) with each child's name, age, and allergy information. Update it whenever a child enrolls or information changes.[/callout-tip]"},{"type":"content","title":"State Minimum Ratios (TAC 746)","body":"For comparison, here are the state minimum standards for staff-to-child ratios under TAC Chapter 746. BHA meets or exceeds every one of these.\n\n- 0 to 11 months: State Minimum 1:4\n- 12 to 17 months: State Minimum 1:5\n- 18 to 23 months: State Minimum 1:9\n- 2 years: State Minimum 1:11\n- 3 years: State Minimum 1:15\n- 4 years: State Minimum 1:18\n- 5 to 8 years: State Minimum 1:22\n- 9 to 13 years: State Minimum 1:26\n\n[callout-warn]You must never exceed these ratios. If someone leaves the room and you are now over ratio, you must immediately notify the director. Do not wait. Do not assume someone will come back. Act immediately.[/callout-warn]"},{"type":"content","title":"What Happens When You Are Over Ratio","body":"Being over ratio is one of the most common and most serious compliance violations in child care. Here is what you do:\n\n1. Stop accepting additional children into the classroom immediately.\n2. Notify the director right away using the walkie talkie or walkie.\n3. Stay in the room and maintain active supervision until relief arrives.\n4. Document the situation, including the time, the number of children, and who you notified.\n\n[scenario]You are alone in Classroom 3 with 11 two-year-olds. Another staff member who was helping in your room steps out for a bathroom break and has been gone for 8 minutes. What do you do?\n\nAnswer: You are at ratio (1:11), but only barely. Use the walkie talkie or walkie to ask the director to send a floater to cover. Do not leave the room. Do not allow another child to enter until your relief arrives or a floater comes.[/scenario]"},{"type":"content","title":"Active Supervision","body":"Active supervision is not a suggestion. It is a regulatory requirement under TAC 746.1205. You must be able to see and hear every child in your care at all times.\n\nActive supervision means:\n- Positioning yourself where you can see the entire room or outdoor area\n- Scanning the environment continuously, not just glancing up occasionally\n- Counting children frequently, especially during transitions\n- Listening for sounds of distress, conflict, or unusual silence\n- Moving around the space rather than staying in one spot\n\n[callout-danger]You may never leave children unsupervised for any reason. If you must leave the room, another qualified caregiver must take your place before you step out. No exceptions.[/callout-danger]\n[accordion=What does active supervision look like in practice?]Position yourself to see the entire room. Scan continuously. Count children during every transition. Listen for distress or unusual silence. Move around the space. Never sit in one spot with your back to part of the room.[/accordion]"},{"type":"selfcheck","title":"Quick Check","q":"What is the BHA ratio for Classroom 3 (3-year-olds)?","opts":["1:11","1:13","1:15","1:18"],"ans":2,"explanation":"The BHA ratio for 3-year-olds in Classroom 4 is 1:15. The state minimum is also 1:15 for this age group."},{"type":"content","title":"Active Supervision: Outdoor Play","body":"Outdoor supervision requires extra vigilance. Children move faster, spread out more, and face additional hazards (gates, climbing equipment, insects, weather).\n\nBefore going outside:\n- Inspect the play area for hazards (standing water, broken equipment, animal waste, sharp objects)\n- Count children before leaving the building\n- Bring a first aid kit, emergency contact binder, and your phone or walkie\n- Ensure the gate is secured\n\nWhile outside:\n- Position staff at different zones so every area is covered\n- Count children every 5 minutes\n- Monitor climbing equipment closely; children under 2 should not use equipment designed for older children\n\n[callout-tip]If a child is near the fence or gate, move toward them. Do not call out from across the yard. Close the distance.[/callout-tip]"},{"type":"content","title":"Arrival and Departure Procedures","body":"Every arrival and every departure must be documented. This is non-negotiable.\n\nArrival:\n1. Greet the parent and child warmly.\n2. Check the child in on Brightwheel. Record the exact time.\n3. Verify the authorized drop-off person matches the enrollment record.\n4. Conduct a visual health check. Look for signs of illness, injury, or distress.\n5. Note any parent instructions (medication, early pickup, mood concerns).\n\nDeparture:\n1. Verify the pickup person is on the authorized list. Check their ID if you do not recognize them.\n2. Check the child out on Brightwheel. Record the exact time.\n3. Never release a child to an unauthorized person, even if the child recognizes them.\n4. Never release a child to a person who appears intoxicated.\n\n[callout-danger]If someone who is not authorized attempts to pick up a child, do not release the child. Contact the parent immediately. If the person becomes aggressive, contact the director and call 911 if necessary.[/callout-danger]\n[reveal=Click to see the full check-in steps]1. Greet the parent and child warmly. 2. Check the child in on Brightwheel (exact time). 3. Verify the authorized drop-off person. 4. Conduct a visual health check. 5. Note any parent instructions.[/reveal]"},{"type":"content","title":"ID Verification at Pickup","body":"You must verify the identity of anyone picking up a child if you do not personally recognize them.\n\nSteps:\n1. Ask for a government-issued photo ID (driver's license, state ID, military ID, passport).\n2. Compare the name on the ID to the authorized pickup list in Brightwheel.\n3. If the name matches and the photo matches the person, release the child.\n4. If the name is not on the list, do not release the child. Contact the parent.\n\n[scenario]A woman arrives and says she is the child's aunt. The child runs to her and says 'Auntie!' You check Brightwheel and the woman's name is not on the authorized list. What do you do?\n\nAnswer: You do not release the child. Politely explain that you need the parent's authorization. Call the parent and ask them to either add the aunt to Brightwheel or provide verbal confirmation to the director, who will document it. The child's excitement does not override the policy.[/scenario]"},{"type":"content","title":"Brightwheel Overview","body":"Brightwheel is BHA's digital platform for attendance, parent communication, daily reports, billing, and documentation. You will use it every day.\n\nWhat you will use Brightwheel for:\n- Checking children in and out (attendance)\n- Logging meals and snacks\n- Logging diaper changes and nap times\n- Sending photos and activity updates to parents\n- Recording incidents\n- Messaging parents\n\n**Brightwheel is accessed on BHA classroom tablets only.** You will not use your personal phone for Brightwheel. Each classroom has a dedicated BHA tablet for all Brightwheel logging.\n\nYou will receive a staff login during your first week. The director will walk you through the system hands-on.\n\n[callout-tip]Parents love seeing photos and updates during the day. Aim to send at least one photo per child per day using the classroom tablet. It builds trust and shows families that their child is engaged and happy.[/callout-tip]"},{"type":"content","title":"Communication with Parents","body":"Communication with parents should always be:\n\nWarm: Start with something positive about the child's day.\nHonest: If there was an issue, share it factually and without blame.\nProfessional: Use Brightwheel or face-to-face conversations. Never use personal text messages or social media.\nTimely: Do not wait until pickup to share something the parent needs to know now.\n\nWhat to communicate:\n- Daily summaries (meals, naps, activities, milestones)\n- Incidents (falls, bites, conflicts) with factual descriptions\n- Supply needs (diapers, change of clothes, formula)\n\nWhat NOT to communicate:\n- Other children's names in incident reports (say 'another child,' not 'Tommy bit your son')\n- Your personal opinions about a family's parenting choices\n- Anything on social media, ever\n\n[callout-warn]Never discuss one family's business with another family. Confidentiality is not optional.[/callout-warn]"},{"type":"content","title":"Dress Code","body":"Your appearance communicates professionalism and safety. BHA's dress code is designed to be practical for working with children while maintaining a clean, professional image.\n\n**Required:**\n- BHA-branded navy blue shirt with logo (two short-sleeve and two long-sleeve shirts will be provided during onboarding)\n- Black or blue pants, or non-tight-fitting jeans in black or blue\n- Closed-toe shoes (tennis shoes are fine)\n- Hair pulled back and secured during food service and infant care\n- Natural hair colors only\n- Fingernails clean and well-maintained, kept at a length that will not scratch a child. Acrylic, gel, and press-on nails are permitted as long as they remain clean, professional, and free of chips.\n\n**Not Permitted:**\n- Shorts of any length\n- Leggings, yoga pants, joggers, or athletic wear\n- Tight-fitting jeans, jeggings, or skinny jeans\n- Crocs, sandals, flip-flops, open-toe shoes, or heels\n- Holes, rips, or tears in any clothing\n- Graphic designs or text on bottoms\n- Clothing with offensive language, imagery, or political messaging\n- Unnatural hair colors (such as pink, blue, green, or purple)\n- Excessive or dangling jewelry (long necklaces, large hoop earrings, dangling bracelets)\n- Visible tattoos depicting offensive imagery or language must be covered\n- Extreme facial or body piercings beyond small ear piercings\n- Strong fragrances or perfumes\n\n[callout-info]The goal is a clean, professional look every day. If you are unsure whether something is appropriate, ask before wearing it. It is better to check than to be sent home to change.[/callout-info]"},{"type":"selfcheck","title":"Quick Check","q":"A parent calls and says to give their child Tylenol. You have no written form on file. What do you do?","opts":["Give the medication since the parent gave verbal consent","Do not give it. Written consent is required before any medication.","Ask another teacher what to do","Give half the dose to be safe"],"ans":1,"explanation":"Verbal authorization is never sufficient for medication. Written consent on the BHA Medication Authorization Form must be on file before administering anything."},{"type":"content","title":"Cell Phone Policy","body":"Cell phones are a common source of distraction-related incidents in child care. BHA's policy is clear:\n\n**During classroom hours:**\n- Personal cell phones must be stored in your bag or in the front office, out of sight.\n- You may not use your personal phone for any reason while supervising children.\n- This includes Brightwheel. All Brightwheel logging is done on the BHA classroom tablet.\n- If you need to make an emergency call, ask another staff member or the director to cover your supervision duties first.\n\n**During breaks:**\n- You may use your phone in the break room only.\n\n**There are no exceptions.** Personal phones are never used for work purposes in the classroom.\n\n**Violation consequences (3-strike policy):**\n- First offense: Written warning\n- Second offense: One-day suspension\n- Third offense: Termination\n\n[callout-danger]A child can be injured, leave the room, or choke in the seconds it takes to check a text message. Phone-related distraction is one of the leading causes of supervision lapses in child care.[/callout-danger]"},{"type":"content","title":"Confidentiality","body":"Everything you see, hear, and learn about the children and families at BHA is confidential. This includes:\n\n- Children's medical conditions, allergies, and medications\n- Family structures, custody arrangements, and home situations\n- Behavioral reports and incident documentation\n- Enrollment and billing information\n- Anything shared by a parent in conversation\n\nYou may share confidential information only with:\n- BHA leadership (director, assistant director)\n- The child's assigned classroom team (only what is relevant to care)\n- Licensing inspectors or CPS investigators (when legally required)\n\n[callout-danger]Posting about children, families, or workplace situations on social media is a terminable offense. This includes vague posts that do not name names. If someone can figure out who you are talking about, you have violated confidentiality.[/callout-danger]"},{"type":"content","title":"Meals and Nutrition","body":"BHA participates in the Child and Adult Care Food Program (CACFP). This means we receive federal reimbursement for meals and snacks, and in return, we must follow USDA meal pattern requirements.\n\nDaily meal schedule:\nBreakfast: 8:00 AM\nMorning Snack: 10:00 AM\nLunch: 12:00 PM\nAfternoon Snack: 3:00 PM\nDinner (for extended care): 6:00 PM\n\nYour responsibilities:\n- Serve meals at the scheduled times\n- Log every meal and snack in Brightwheel\n- Sit with the children during meals (family-style dining)\n- Never use food as a reward or punishment\n- Check allergy lists before serving anything\n\n[callout-warn]Allergy lists are posted in every classroom and in the kitchen. Review them every morning and every time a new child enrolls. A missed allergy can be life-threatening.[/callout-warn]"},{"type":"content","title":"Allergy Management","body":"BHA takes allergies seriously. Every child with a known allergy has:\n\n1. A Food Allergy Emergency Plan on file (signed by the parent and physician)\n2. A red allergy alert tag in Brightwheel\n3. Their name and allergy posted on the classroom allergy board\n4. An individualized action plan that every staff member in the room must know\n\nIf a child has an epinephrine auto-injector (EpiPen), it must be stored in the classroom, labeled, and accessible. Never lock it in a cabinet.\n\n[scenario]A parent brings cupcakes for their child's birthday. One child in the class has a severe dairy allergy. What do you do?\n\nAnswer: Check the ingredient list. If the cupcakes contain dairy (most do), that child cannot have one. Offer the child an alternative treat from the classroom supply. Never make the child feel excluded. Say something like, 'We have a special treat just for you!' Notify the parent of the allergic child at pickup.[/scenario]"},{"type":"content","title":"Safe Sleep (Infants)","body":"If you work in the Nursery, you must follow safe sleep practices without exception. These rules save lives.\n\n**The ABCs of Safe Sleep: Alone, on their Back, in a Crib.**\n\n1. Always place infants on their backs to sleep. Every time.\n2. Use a firm, flat mattress with a fitted sheet. Nothing else in the crib: no blankets, pillows, stuffed animals, bumper pads, or positioning devices.\n3. Each infant must have their own crib. Bed-sharing is never permitted.\n4. Check sleeping infants every 15 minutes. Document the check.\n5. Swaddling is prohibited at BHA once the child is in our care, even if the parent swaddles at home.\n6. No pacifier clips or cords of any kind may be attached to an infant while sleeping or at any time in the crib. This is a high-weighted violation under Minimum Standards.\n7. Infants may not sleep in car seats, swings, bouncers, or any device that is not a flat crib. If an infant falls asleep in a swing, transfer them to their crib immediately.\n8. Awake infants should not be left in a swing, bouncer, or other confining device for more than 30 minutes at a time.\n9. Never prop a bottle. Bottle propping is a choking hazard and is prohibited.\n\n[callout-danger]Pacifier cords and clips attached to an infant are a strangulation risk and result in a high-weighted licensing violation. Remove all cords and clips before placing an infant in a crib or any sleep environment. If a parent sends one, store it in the child's cubby and explain the policy.[/callout-danger]\n[flip=What are the ABCs of Safe Sleep?]Alone (in their own crib), on their Back (every time), in a Crib (firm, flat, fitted sheet only, nothing else).[/flip]"},{"type":"content","title":"Safe Sleep: Visual Checks","body":"Every 15 minutes, you must visually check each sleeping infant and document the check. Here is what you are looking for:\n\n- Is the infant on their back? If they have rolled onto their stomach and can roll both ways independently, you may leave them. Otherwise, gently reposition them.\n- Is the infant breathing normally? Look for chest rise and fall.\n- Is the infant's face clear of any obstruction?\n- Is the crib free of any items that should not be there?\n\nDocument each check on the Safe Sleep Log posted in the Nursery. Record the time, the infant's initials, their position, and your initials.\n\n[callout-info]The 15-minute check is a minimum. If an infant seems unwell, check more frequently. Trust your instincts.[/callout-info]"},{"type":"selfcheck","title":"Quick Check","q":"What is the drop-off cutoff time at BHA?","opts":["8:00 AM","8:30 AM","9:00 AM","9:30 AM"],"ans":2,"explanation":"All children must be dropped off by 9:00 AM. After that time, we should know who is in the building for the day."},{"type":"content","title":"Infant Care Essentials","body":"Caring for infants requires specialized knowledge. These are not just BHA policies. Many of these are Minimum Standards requirements, and violations carry heavy penalties.\n\n**Feeding:**\n- Never prop a bottle. Hold the infant during feeding, making eye contact and supporting their head.\n- Bottles must be labeled with the child's name, contents, and date.\n- Unused formula or breast milk must be discarded after one hour at room temperature.\n- Breast milk can be refrigerated. Follow the labeling instructions exactly.\n\n**Sleep (review from earlier in this module):**\n- Back to sleep. Flat crib. Nothing in the crib.\n- No pacifier cords or clips. No swaddling. No sleeping in swings or car seats.\n- Visual checks every 15 minutes, documented.\n- Awake infants: no more than 30 minutes in a confining device (swing, bouncer, high chair) at a time.\n\n**Diapering:**\n- Check diapers at least every 2 hours and immediately after bowel movements.\n- Follow the posted diapering procedure step by step every time.\n- One hand on the infant at all times while on the changing table.\n\n**Tummy Time:**\n- All infants who cannot yet roll should have supervised tummy time daily.\n- Stay within arm's reach during tummy time.\n\n**Developmental Awareness:**\n- Know each infant's current abilities (rolling, sitting, crawling, pulling up).\n- This information directly affects how you position them, what equipment is safe for them, and how closely you supervise them.\n\n[callout-danger]Pacifier cords, propped bottles, and infants sleeping in swings or car seats are all high-weighted violations under Minimum Standards. A high-weighted violation means the state considers it a serious risk to children's safety. These are not minor issues.[/callout-danger]\n[accordion=Why are pacifier cords a high-weighted violation?]Pacifier cords and clips are a strangulation risk. Under Minimum Standards, this is classified as a high-weighted violation, meaning the state considers it a serious threat to children's safety. It can result in significant penalties for the center.[/accordion]"},{"type":"content","title":"Diapering and Toileting","body":"Proper diapering prevents the spread of illness and keeps children comfortable.\n\nDiapering procedure:\n1. Gather all supplies before placing the child on the changing table.\n2. Keep one hand on the child at all times.\n3. Clean the diaper area front to back.\n4. Dispose of the diaper in the designated hands-free bin.\n5. Clean and sanitize the changing surface.\n6. Wash the child's hands and then your own.\n7. Log the diaper change in Brightwheel.\n\nToileting (for potty-training children):\n- Accompany children to the restroom\n- Assist as needed without rushing them\n- Help with handwashing\n- Celebrate successes, never shame accidents\n\n[callout-tip]Accidents are normal and expected during potty training. Always have a change of clothes on hand. When an accident happens, say something like, 'No worries, let us get you into something dry.' No sighing, no frustration, no comments about being a 'big kid.'[/callout-tip]"},{"type":"content","title":"Handwashing Requirements","body":"Handwashing is your single most effective defense against the spread of illness. You must wash your hands:\n\n- When you arrive at work\n- Before and after handling food\n- Before and after diapering or assisting with toileting\n- After wiping noses or handling bodily fluids\n- After outdoor play\n- After handling animals or animal waste\n- After taking out trash\n- Before and after administering medication\n\nProper technique:\n1. Wet hands with warm water\n2. Apply soap and lather for at least 20 seconds\n3. Scrub all surfaces including between fingers and under nails\n4. Rinse thoroughly\n5. Dry with a single-use paper towel\n6. Use the paper towel to turn off the faucet\n\n[callout-warn]Gloves are not a substitute for handwashing. You must wash your hands even if you wore gloves.[/callout-warn]"},{"type":"content","title":"Medication Administration","body":"Only designated, trained staff may administer medication. If you are not authorized, do not administer medication under any circumstances.\n\nRequirements:\n- Written parental consent on the BHA Medication Authorization Form\n- Medication must be in its original container with the child's name, dosage, and expiration date\n- All medication must be stored in the locked medication cabinet (or refrigerator if required)\n- Each dose must be logged on the Medication Administration Log: child's name, medication, dose, time, and your signature\n\n[callout-danger]Verbal authorization for medication is never sufficient. Even if a parent calls and says 'give my child their medicine,' you must have the written form on file before administering anything.[/callout-danger]\n[flip=Can you give medication if a parent calls and gives verbal consent?]No. Written consent on the BHA Medication Authorization Form must be on file before administering any medication. Verbal authorization is never sufficient.[/flip]"},{"type":"content","title":"Incident Reporting","body":"Whenever a child is injured, involved in a conflict, or experiences an unusual event, you must document it.\n\nWhat to document:\n- Falls, bumps, or scrapes (even minor ones)\n- Bites (given or received)\n- Allergic reactions\n- Behavioral incidents (hitting, throwing, elopement attempts)\n- Illness symptoms that develop during the day\n\nHow to document:\n1. Complete the incident report in Brightwheel immediately (within 15 minutes).\n2. Include: the child's name, date, time, location, what happened, what you did, and who was notified.\n3. Write factually. Do not include opinions, blame, or guesses.\n4. Notify the parent through Brightwheel and at pickup.\n5. Notify the director if the injury is significant or if the child needs medical attention.\n\n[callout-tip]Good documentation: 'At 10:15 AM during outdoor play, Child A fell from the second step of the climber and bumped their forehead on the ground. Staff applied a cold compress for 5 minutes. A small red mark was visible. Parent notified via Brightwheel at 10:20 AM.' Bad documentation: 'Child got hurt on the playground because they were not listening.'[/callout-tip]"},{"type":"content","title":"Emergency Procedures Overview","body":"You will receive detailed emergency training in Module 5. For now, know the basics:\n\nFire: Follow the posted evacuation route. Grab the attendance clipboard and emergency binder. Evacuate to the designated assembly point. Count children.\n\nSevere Weather (Tornado): Move children to the designated interior safe room. Get low, cover heads. Count children.\n\nLockdown: Lock the classroom door. Move children away from windows and doors. Turn off lights. Stay silent until the all-clear.\n\nMedical Emergency: Call 911 first. Then notify the director. Begin first aid if trained. Do not move a seriously injured child unless they are in immediate danger.\n\n[callout-info]Emergency procedure posters are displayed in every classroom. Know where yours is. If you cannot find it, ask the director today.[/callout-info]"},{"type":"content","title":"Training Requirements","body":"Texas requires child care employees to complete specific training hours:\n\nPreservice Training: 24 hours before you are counted in ratio (or within 90 days with a waiver from your director)\n\nAnnual Training: 24 clock hours per year of ongoing professional development\n\nThis orientation counts toward both your preservice and annual training hours. After completing all 8 modules and passing the quizzes, you will receive certificates documenting your hours.\n\nAdditional required training:\n- CPR and First Aid certification (must be current at all times)\n- Safe sleep training (if working with infants)\n- Transportation safety (if transporting children)\n\n[callout-info]BHA tracks your training hours. Your director will let you know how many hours you have completed and what you still need.[/callout-info]"},{"type":"content","title":"Your First Week","body":"Here is what your first week at BHA will look like:\n\nDay 1: Complete this online orientation (all 8 modules). Tour the facility. Meet your classroom team.\n\nDays 2-3: Shadow an experienced teacher in your assigned classroom. Observe routines, transitions, and how the team communicates.\n\nDays 4-5: Begin participating in classroom activities under the guidance of the director. Practice Brightwheel logging. Get familiar with your children's names, allergies, and routines.\n\nEnd of Week 1: Check in with the director. Ask questions. Share what you have learned and what you still need help with.\n\n[callout-tip]The first week can be overwhelming. That is normal. You do not need to memorize everything today. You need to know where to find the answers and who to ask.[/callout-tip]"},{"type": "scenario-branch", "title": "Interactive Scenario: Phone Emergency", "scenarioId": "m1_phone"},{"type": "scenario-branch", "title": "Interactive Scenario: Unauthorized Pickup", "scenarioId": "m1_pickup"},{"type":"content","title":"Module 1 Summary","body":"Here is what you should take away from this module:\n\n[keypoint]BHA is a licensed, regulated child care center. Everything you do must comply with TAC Chapter 746 and BHA's internal policies.[/keypoint]\n\n- You are part of a mission-driven team founded by Tanya and Christopher Orr.\n- You must maintain proper ratios at all times and practice active supervision.\n- Arrival and departure procedures must be followed exactly. Verify IDs.\n- Use Brightwheel for attendance, meals, incidents, and parent communication.\n- Follow the dress code, cell phone policy, and confidentiality rules.\n- Safe sleep rules for infants are non-negotiable.\n- You will receive detailed training in each of these areas throughout the remaining modules.\n\nYou are now ready for the Module 1 quiz."}];
const M1_QUIZ=[{"q":"What is BHA's licensed capacity for total children?","opts":["26","42","52","64"],"ans":2},{"q":"What should you do if someone not on the authorized pickup list tries to pick up a child?","opts":["Release the child if they know the family name","Ask the child if they know the person","Do not release the child and contact the parent immediately","Call the police immediately"],"ans":2},{"q":"How often must you visually check sleeping infants?","opts":["Every 5 minutes","Every 15 minutes","Every 30 minutes","Every hour"],"ans":1},{"q":"Is swaddling permitted at BHA?","opts":["Yes, if the parent requests it","Yes, for infants under 3 months","No, swaddling is prohibited at BHA","Only during overnight care"],"ans":2},{"q":"What is the BHA ratio for the Nursery (6 weeks to 11 months)?","opts":["1:3","1:4","1:5","1:6"],"ans":1},{"q":"When may you use your personal cell phone while supervising children?","opts":["Only for quick texts","Only for emergencies after getting coverage","Anytime if it is on silent","During nap time only"],"ans":1},{"q":"Which statement about medication administration is correct?","opts":["Verbal parent consent over the phone is sufficient","Any staff member can administer medication","Written consent on the BHA form is required before administering any medication","Medication can be stored in the child's cubby"],"ans":2},{"q":"What is the correct response when you realize you are over ratio in your classroom?","opts":["Wait for your co-teacher to return","Move children to another classroom yourself","Immediately notify your lead or director and maintain supervision","Close the door so no one else enters"],"ans":2},{"q":"What platform does BHA use for attendance, daily reports, and parent communication?","opts":["ProCare","HiMama","Brightwheel","Tadpoles"],"ans":2}];
const M2_SLIDES=[{"type":"title","title":"Module 2: Minimum Standards Overview","sub":"Understanding TAC Chapter 746 and how it governs every aspect of child care operations in Texas."},{"type":"content","title":"What Are Minimum Standards?","body":"The Texas Minimum Standards for Child-Care Centers are a set of rules published in the Texas Administrative Code (TAC), Chapter 746. These rules are enforced by the Texas Health and Human Services Commission (HHSC) through their Child Care Regulation (CCR) division.\n\nMinimum Standards cover:\n- Who can work in a child care center\n- How children must be supervised\n- What the physical environment must look like\n- How emergencies must be handled\n- What records must be maintained\n- How children must be fed, transported, disciplined, and protected\n\n[callout-info]The word 'minimum' is important. These are the floor, not the ceiling. BHA's internal policies often exceed minimum standards.[/callout-info]"},{"type":"content","title":"Why Minimum Standards Matter","body":"Minimum Standards exist for one reason: to protect children. Every rule in Chapter 746 was written because something went wrong somewhere in Texas, and a child was harmed or put at risk.\n\nWhen you follow the standards, you are:\n- Protecting children from harm\n- Protecting families from negligent care\n- Protecting BHA's license to operate\n- Protecting yourself from personal liability\n\n[callout-warn]If you violate a Minimum Standard, it does not matter whether you knew about the rule or not. Ignorance is not a defense. That is why this training exists: so you know the rules before you ever set foot in a classroom.[/callout-warn]"},{"type":"content","title":"How Inspections Work","body":"HHSC licensing inspectors (sometimes called CCR investigators) can visit BHA at any time, without notice.\n\nDuring an inspection, they may:\n- Walk through every classroom and outdoor area\n- Review children's files, staff files, and operational records\n- Observe staff-to-child ratios in real time\n- Interview staff members (including you)\n- Check medication logs, fire drill records, and food service documentation\n- Verify that background checks are current for all staff\n\nIf asked a question by an inspector:\n- Answer honestly\n- Do not guess. If you do not know, say 'I do not know, but I can find out.'\n- Do not volunteer extra information. Answer what is asked.\n- Notify the director that an inspector is on site\n\n[callout-tip]Think of inspectors as allies, not enemies. They are here to make sure children are safe. If you are doing your job correctly, an inspection is just a normal day.[/callout-tip]\n[flip=An inspector asks you something you do not know. What do you say?]\"I do not know, but I can find out.\" Never guess. Answer honestly. Do not volunteer extra information.[/flip]"},{"type":"content","title":"Staff Qualifications","body":"TAC 746 requires that every person who works directly with children meet specific qualifications:\n\nMinimum Age: 18 years old for primary caregivers. Employees ages 16-17 may assist but must be supervised at all times by a qualified caregiver.\n\nBackground Checks: Every employee must clear a HHSC background check, including an FBI fingerprint check, before having unsupervised access to children.\n\nPreservice Training: 24 clock hours within the first 90 days of employment. This orientation counts toward your 24 hours.\n\nCPR and First Aid: Must be current. BHA offers in-house CPR/First Aid certification through our HSI-authorized training center.\n\nHigh School Diploma or GED: Required for all caregiving staff.\n\n[callout-warn]You may not be alone with children until your background check has been fully cleared. If your clearance is pending, you must always be within sight and sound of a cleared employee.[/callout-warn]"},{"type":"selfcheck","title":"Quick Check","q":"An inspector asks you a question you do not know the answer to. What do you say?","opts":["Make your best guess","'I do not know, but I can find out.'","Refer them to a coworker","'No comment.'"],"ans":1,"explanation":"Never guess. Say 'I do not know, but I can find out.' Answer honestly and do not volunteer extra information."},{"type":"content","title":"Background Check Requirements","body":"All BHA employees must complete the following background checks before beginning work:\n\n1. HHSC Central Registry Check (checks for confirmed findings of child abuse or neglect)\n2. FBI Fingerprint Check (national criminal history)\n3. Texas DPS Criminal History Check\n4. Sex Offender Registry Check\n\nThese checks must be renewed every two years. BHA's director tracks renewal dates and will notify you when your checks need to be updated.\n\n[callout-danger]If you are arrested, charged with a crime, or receive a confirmed finding of abuse or neglect after your initial check, you must notify the director within 24 hours. Failure to disclose can result in immediate termination.[/callout-danger]"},{"type":"content","title":"Ratios and Group Sizes","body":"You learned BHA's internal ratios in Module 1. Here is why they matter from a regulatory standpoint:\n\nTAC 746.1601 through 746.1609 establish the maximum number of children one caregiver may supervise based on the age of the youngest child in the group.\n\nKey rules:\n- Ratios must be maintained at all times, including during outdoor play, meals, naps, and field trips\n- If a mixed-age group is present, the ratio for the youngest child applies to the entire group\n- If you are the only adult in the room, you must stay within sight and sound of all children at all times\n\n[callout-warn]Mixed-age grouping is the number one trap for ratio violations. If you have one 12-month-old in a room of 3-year-olds, the entire room operates on the infant ratio (1:5), not the 3-year-old ratio (1:15).[/callout-warn]\n[flip=You have one 12-month-old in a room of 3-year-olds. Which ratio applies?]The 12-month-old ratio (1:5) applies to the ENTIRE room. The youngest child in the group determines the ratio for everyone.[/flip]"},{"type":"content","title":"Record Keeping Requirements","body":"TAC 746.901 requires that BHA maintain extensive records for every child and every employee.\n\nChild Records (must be on file before or on the first day of attendance):\n- Enrollment form with emergency contacts\n- Immunization records\n- Allergy and medical information\n- Authorization for pickup\n- Signed acknowledgment of parent handbook\n\nEmployee Records (must be complete before first day with children):\n- Application and resume\n- Background check clearance\n- Training documentation\n- CPR/First Aid certification\n- Signed acknowledgment of employee handbook and all policies\n\n[callout-info]Records are audited during every inspection. Missing or incomplete records can result in citations, even if the care itself is excellent.[/callout-info]\n[accordion=What must be in a child's file before their first day?]Enrollment form with emergency contacts, immunization records, allergy and medical information, authorization for pickup, and signed acknowledgment of the parent handbook.[/accordion]"},{"type":"content","title":"Physical Environment Standards","body":"The building itself must meet specific requirements:\n\nIndoor Space: A minimum of 30 square feet of usable indoor space per child in each classroom.\n\nOutdoor Space: A minimum of 80 square feet of usable outdoor space per child (or a plan for alternating outdoor access).\n\nTemperature: Indoor temperature must be maintained between 65 and 82 degrees Fahrenheit.\n\nLighting: Adequate lighting in all areas where children are present.\n\nClean and Sanitary: All surfaces must be cleaned and sanitized on a regular schedule. Bathrooms, diapering areas, and food preparation surfaces have the strictest requirements.\n\n[callout-tip]If you notice a maintenance issue (broken window lock, leaking ceiling, pest sighting), report it to the director immediately. Do not assume someone else will notice it.[/callout-tip]"},{"type":"content","title":"Fire Safety and Drills","body":"TAC 746 requires monthly fire drills and quarterly severe weather drills.\n\nFire Drills:\n- Must be conducted once per month\n- Must include all children and staff present\n- Evacuation must be completed within 3 minutes\n- Routes must be posted in every room\n- Results must be documented (date, time, evacuation time, number of participants)\n\nSevere Weather Drills:\n- Must be conducted once per quarter\n- Must include moving all children to the designated interior safe room\n- Results must be documented\n\n[callout-info]You will practice both types of drills during your first month. Your director will tell you when the next drill is scheduled.[/callout-info]"},{"type":"content","title":"Hazardous Materials and Cleaning","body":"Cleaning chemicals, sanitizers, and any hazardous materials must be stored:\n\n- In a locked cabinet or area that is inaccessible to children\n- Separately from food, medication, and children's supplies\n- In their original labeled containers\n\nWhen using cleaning products:\n- Never spray chemicals near children\n- Allow surfaces to air dry when using sanitizer (the drying time is what kills germs)\n- Wear gloves when handling bleach solutions\n- Never mix cleaning products\n\n[callout-danger]Bleach, sanitizer, and cleaning sprays must never be within reach of children. If you set down a spray bottle to answer a question or help a child, pick it up immediately when you are done. Do not leave it on a counter or table.[/callout-danger]"},{"type":"selfcheck","title":"Quick Check","q":"You have one 12-month-old in a room of 3-year-olds. Which ratio applies?","opts":["1:15 (3-year-old ratio)","1:5 (12-month-old ratio)","1:10 (average)","1:11 (2-year-old ratio)"],"ans":1,"explanation":"When a mixed-age group is present, the ratio for the youngest child applies to the entire group. One 12-month-old means the whole room operates at 1:5."},{"type":"content","title":"Water Safety","body":"TAC 746 has specific rules about water activities:\n\n- Children must never be left unattended near any body of water, including wading pools, water tables, sinks, and buckets\n- Standing water must be drained immediately after use\n- If BHA ever conducts a water activity, additional staff must be present to maintain a 1:1 supervision ratio at the water source\n\n[callout-warn]Even 1 inch of water can be a drowning hazard for a young child. If you see standing water anywhere in the facility (a mop bucket, a clogged drain, a leaking toilet), address it immediately or report it.[/callout-warn]"},{"type":"content","title":"Transportation Requirements","body":"If BHA transports children (field trips, school pickup/drop-off), the following rules apply under TAC 746:\n\n- The vehicle must be inspected annually and meet all safety standards\n- A first aid kit and emergency contacts must be in the vehicle at all times\n- Each child must have a car seat or booster appropriate for their age, weight, and height\n- Staff must take attendance before departing, upon arriving, and before leaving any destination\n- The driver must do a final walk-through of the vehicle after every trip to confirm no child is left behind\n\n[callout-danger]The final vehicle walk-through is non-negotiable. Every single time the vehicle is used, the driver must physically walk to the back of the vehicle and visually check every row. Every time.[/callout-danger]"},{"type":"content","title":"Discipline and Guidance Standards","body":"TAC 746 strictly regulates how children may be disciplined in a child care center. You will receive detailed training on this in Module 4. For now, here is the overview:\n\nPermitted:\n- Positive reinforcement and praise\n- Redirection to appropriate behavior\n- Logical and natural consequences\n- Brief supervised separation from the group (not as punishment, but as a calming strategy)\n\nProhibited (under all circumstances):\n- Corporal punishment (hitting, spanking, slapping, pinching, shaking)\n- Verbal abuse, threats, or humiliation\n- Withholding food, water, rest, or bathroom access as punishment\n- Forcing a child to remain in one position for an extended time\n- Any form of physical restraint except to protect the child or others from imminent harm\n\n[callout-danger]Any staff member who uses prohibited discipline will face immediate disciplinary action. BHA has zero tolerance for any form of child maltreatment.[/callout-danger]"},{"type":"content","title":"Reporting Requirements","body":"If you observe, suspect, or are told about child abuse or neglect, you are legally required to report it. This is covered in depth in Module 6, but here is what you need to know now:\n\n- Every employee of a child care center in Texas is a mandatory reporter\n- You must report within 48 hours of suspicion\n- You report to the Texas Abuse Hotline: 1-800-252-5400 or online at txabusehotline.org\n- You do not need to prove abuse. You only need a reasonable suspicion.\n- You are protected by law from retaliation when you make a good-faith report\n\n[callout-danger]You report directly to the state. You do not report to your director and let them decide whether to call. If you suspect abuse, YOU call the hotline. That is the law.[/callout-danger]"},{"type":"content","title":"Notifications to Licensing","body":"BHA must notify HHSC within specific timeframes when certain events occur:\n\nWithin 24 hours:\n- Serious injury to a child\n- Illness requiring hospitalization\n- Death of a child\n- Allegations of abuse or neglect by a staff member\n- Any incident involving law enforcement\n\nWithin 5 days:\n- Changes in the director or key staff\n- Changes to the facility address or capacity\n- Structural changes to the building\n\nYou may not be the person who files the notification, but you must report any of these events to the director immediately so the notification deadline can be met.\n\n[callout-info]If a child needs to go to the hospital, the director handles the notification. Your job is to document what happened and make sure the director knows every detail.[/callout-info]"},{"type":"content","title":"Annual Training Requirements","body":"Under TAC 746.1309, every caregiver must complete at least 24 clock hours of training each year. At least 6 of those hours must cover one or more of the following topics:\n\n- Child growth and development\n- Guidance and discipline\n- Age-appropriate activities\n- Health and safety\n- Special needs\n- Child abuse and neglect\n\nBHA will help you find training opportunities. Many free or low-cost options are available through state-approved training organizations.\n\n[callout-tip]Keep copies of all training certificates. BHA will track your hours, but it is smart to maintain your own records as well. If you ever change jobs, you will need to show your training history to your next employer.[/callout-tip]"},{"type":"selfcheck","title":"Quick Check","q":"How many clock hours of training must you complete each year?","opts":["8 hours","16 hours","24 hours","30 hours"],"ans":2,"explanation":"TAC 746.1309 requires 24 clock hours of training per year for every caregiver."},{"type":"content","title":"What Happens When a Violation Is Found","body":"If a licensing inspector finds a violation during an inspection, the following can happen:\n\n1. Corrective Action: You are given a specific timeframe to fix the issue and demonstrate compliance.\n2. Administrative Penalty: A fine may be assessed for repeated or serious violations.\n3. Probation: The license may be placed on probation with additional monitoring.\n4. Suspension or Revocation: For the most serious violations, the license can be suspended or revoked entirely.\n\nViolations are public record. Any parent can look up BHA's inspection history on the HHSC website. Our reputation depends on a clean record.\n\n[callout-warn]You are not just protecting children when you follow the rules. You are protecting BHA's ability to exist. A revoked license means the center closes, and every family who depends on us loses their child care.[/callout-warn]"},{"type":"content","title":"Your Role in Compliance","body":"You do not need to memorize every section of TAC Chapter 746. That is the director's job. But you do need to:\n\n1. Know the rules that apply directly to your daily work (ratios, supervision, diapering, meals, documentation)\n2. Follow BHA's policies, which are designed to keep you in compliance\n3. Ask questions when you are unsure\n4. Report concerns immediately (maintenance issues, missing records, unsafe conditions)\n5. Never take shortcuts, even when you are short-staffed or tired\n\n[keypoint]If you do the right thing every time, even when no one is watching, you will never have a compliance problem.[/keypoint]"},{"type":"content","title":"Common Violations to Avoid","body":"These are the most frequently cited violations in Texas child care centers:\n\n1. Ratio violations: Not enough adults for the number of children\n2. Supervision lapses: Children out of sight or hearing of a caregiver\n3. Incomplete records: Missing immunization records, unsigned consent forms, expired background checks\n4. Improper medication storage or administration\n5. Failure to conduct or document fire and weather drills\n6. Hazardous materials left accessible to children\n7. Failure to report suspected abuse or neglect\n\n[callout-tip]If you read this list and think, 'Those are all obvious,' good. They should be. But they are still the most common violations because people get busy, distracted, or complacent. Stay vigilant.[/callout-tip]\n[reveal=Click to see the top 7 violations]1. Ratio violations. 2. Supervision lapses. 3. Incomplete records. 4. Improper medication storage. 5. Failure to conduct or document drills. 6. Hazardous materials accessible to children. 7. Failure to report suspected abuse or neglect.[/reveal]"},{"type":"content","title":"Where to Find the Standards","body":"The full text of TAC Chapter 746 is publicly available online. You can access it through the Texas Secretary of State's website or through the HHSC CCR website.\n\nBHA also maintains a printed copy of the Minimum Standards in the director's office. You are welcome to review it at any time.\n\nIf you ever have a question about whether something is allowed, check the standards or ask the director. Do not guess.\n\n[callout-info]The standards are updated periodically. When changes are made, the director will inform you and provide any additional training needed to comply with the new rules.[/callout-info]"},{"type":"content","title":"BHA's Commitment to Excellence","body":"Minimum Standards set the floor. BHA aims higher.\n\nExamples of how BHA exceeds Minimum Standards:\n- Tighter ratios in most classrooms\n- Monthly character development themes integrated into the curriculum\n- Daily social-emotional check-in routines\n- Family connection practices that honor diverse family structures\n- Brightwheel technology for real-time documentation and parent communication\n- 24-hour operational flexibility for nontraditional schedules\n\nYou are part of a team that does not settle for 'good enough.' We aim for excellent.\n\n[callout-tip]When you are asked why BHA does something differently, the answer is almost always: because we believe children deserve more than the minimum.[/callout-tip]"},{"type":"content","title":"Scenario: Putting It All Together","body":"[scenario]It is 3:15 PM. You are in Classroom 4 (3-year-olds) with 14 children and one other teacher. Another staff member tells you she needs to leave for a doctor's appointment and walks out. An inspector walks in five minutes later.\n\nWhat are the problems?\n1. You are now at a 1:14 ratio in a room where the state maximum is 1:15. You are technically within ratio, but you have no coverage if another child arrives or if you need to step out.\n2. Another staff member left without ensuring a replacement was in the room.\n\nWhat should you have done?\nBefore another staff member left, you should have called the director to request a floater. If no floater was available, the floater or another staff member should have waited until coverage arrived. You should never be the only adult in a full classroom without a clear backup plan.\n\nWhat do you tell the inspector?\nAnswer honestly: 'My floater or another staff member just left for an appointment. I am the only adult in the room. I have called the director for a replacement.' Do not lie. Do not cover for the floater or another staff member.[/scenario]"},{"type": "scenario-branch", "title": "Interactive Scenario: Inspector Visit", "scenarioId": "m2_inspector"},{"type":"content","title":"Module 2 Summary","body":"Here is what you should take away from this module:\n\n[keypoint]TAC Chapter 746 governs everything BHA does. Compliance is not optional, and every employee shares responsibility for maintaining it.[/keypoint]\n\n- Minimum Standards protect children, families, staff, and BHA's license\n- Inspections can happen at any time without notice\n- Every employee must have cleared background checks, CPR/First Aid, and required training hours\n- Ratios must be maintained at all times, including during mixed-age grouping\n- Record keeping is critical and audited regularly\n- You are a mandatory reporter of suspected child abuse or neglect\n- Common violations are avoidable if you stay vigilant and follow procedures\n\nYou are now ready for the Module 2 quiz."}];
